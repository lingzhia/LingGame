<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTS · 阶段1 相机与选择</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#10140f;
    font-family:-apple-system,"PingFang SC",sans-serif;color:#ddd8c8;user-select:none}
  #cv{display:block;position:absolute;inset:0;cursor:crosshair}
  #hud{position:absolute;left:0;top:0;padding:8px 14px;font-size:12px;
    color:#9fb08e;font-variant-numeric:tabular-nums;pointer-events:none;line-height:1.7}
  #hud b{color:#ffd76a;font-weight:600}
  #help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    font-size:12px;color:#8d9c7d;background:rgba(16,20,15,.8);
    padding:6px 14px;border-radius:14px;border:1px solid #2c3626;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div>FPS <b id="fps">--</b> · 单位 <b id="cnt">0</b> · 已选 <b id="sel">0</b></div>
  <div>相机 <b id="cam">0,0</b> · 缩放 <b id="zoom">1.00</b></div>
</div>
<div id="help">左键框选 / 点选 · Shift 加选 · 右键移动 · WASD 或推边平移 · 滚轮缩放 · 中键拖拽</div>

<script>
(function(){
'use strict';

/* =====================================================================
   阶段 1：相机 + 选择 + 移动
   目标不是"功能多"，是把 RTS 里 80% 的操作手感做顺。
   结构上从第一天就分三层：世界状态（纯数据）→ 逻辑 tick → 渲染。
   将来换引擎时，第一层和第二层可以整体搬走，只重写第三层。
   ===================================================================== */

const TILE = 48, MW = 80, MH = 56;
const WW = MW*TILE, WH = MH*TILE;
const TICK = 1/30;                 // 逻辑固定 30Hz，与显示器刷新率解耦

/* ---------- 第 1 层：世界状态。只有数字和数组，没有任何画布概念 ---------- */
const W = {
  t: 0,
  units: [],
  sel: [],
  marks: [],                       // 右键点击的涟漪特效
};

let uid = 1;
function addUnit(type, x, y, owner){
  const base = type === 'tank'
    ? { hp: 300, speed: 118, r: 13 }
    : { hp: 80,  speed: 96,  r: 9  };
  const u = {
    id: uid++, type, owner, x, y, px: x, py: y,
    hp: base.hp, maxHp: base.hp, speed: base.speed, r: base.r,
    dest: null, face: owner ? Math.PI : 0,
  };
  W.units.push(u);
  return u;
}

/* ---------- 第 2 层：相机（也属于状态，但独立于 canvas 尺寸之外的只有它自己） ---------- */
const cam = { x: 0, y: 0, z: 1 };
const clamp = (v,a,b)=> v<a?a:v>b?b:v;

/* ---------- 画布 ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = VW*DPR; cv.height = VH*DPR;
  cv.style.width = VW+'px'; cv.style.height = VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

const s2w = (sx,sy)=>({ x:(sx-VW/2)/cam.z + cam.x, y:(sy-VH/2)/cam.z + cam.y });
const w2s = (wx,wy)=>({ x:(wx-cam.x)*cam.z + VW/2, y:(wy-cam.y)*cam.z + VH/2 });

function clampCam(){
  const hw = VW/2/cam.z, hh = VH/2/cam.z;
  cam.x = clamp(cam.x, Math.min(hw, WW/2), Math.max(WW-hw, WW/2));
  cam.y = clamp(cam.y, Math.min(hh, WH/2), Math.max(WH-hh, WH/2));
}

/* ---------- 输入状态 ---------- */
const input = {
  mx: 0, my: 0, inside: false,
  down: false, dragged: false, sx: 0, sy: 0, ex: 0, ey: 0,
  pan: false, px: 0, py: 0, keys: {},
};

/* =====================================================================
   逻辑 tick
   ===================================================================== */
function step(){
  W.t += TICK;
  for(const u of W.units){
    u.px = u.x; u.py = u.y;                       // 渲染插值用的上一帧位置
    if(u.dest) moveToward(u, u.dest.x, u.dest.y);
  }
  separate();                                     // 互相挤开，避免叠成一点
  for(const m of W.marks) m.t += TICK;
  W.marks = W.marks.filter(m => m.t < m.life);
}

function moveToward(u, tx, ty){
  const dx = tx-u.x, dy = ty-u.y;
  const d = Math.hypot(dx,dy);
  if(d < 3){ u.dest = null; return; }
  const s = u.speed * TICK;
  const step = Math.min(d, s)/d;
  u.x += dx*step; u.y += dy*step;
  u.face = Math.atan2(dy,dx);
  u.x = clamp(u.x, u.r, WW-u.r);
  u.y = clamp(u.y, u.r, WH-u.r);
  if(d <= s) u.dest = null;
}

/* 位置修正：每 tick 把重叠的单位推开一半距离。
   这是最便宜的"避让"，几十个单位够用；上百个再上真正的寻路和局部避障。 */
function separate(){
  const us = W.units;
  for(let i=0;i<us.length;i++){
    for(let j=i+1;j<us.length;j++){
      const a = us[i], b = us[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const rr = a.r + b.r;
      const d2 = dx*dx + dy*dy;
      if(d2 > rr*rr || d2 < 0.0001) continue;
      const d = Math.sqrt(d2);
      const push = (rr-d)*0.5;
      const nx = dx/d, ny = dy/d;
      a.x -= nx*push; a.y -= ny*push;
      b.x += nx*push; b.y += ny*push;
    }
  }
}

/* =====================================================================
   命令
   ===================================================================== */
function orderMove(units, wx, wy){
  const n = units.length;
  if(!n) return;
  const cols = Math.ceil(Math.sqrt(n));
  const gap = 34;
  units.forEach((u,i)=>{
    const cx = i % cols, cy = Math.floor(i/cols);
    u.dest = {
      x: clamp(wx + (cx-(cols-1)/2)*gap, 8, WW-8),
      y: clamp(wy + (cy-Math.ceil(n/cols)/2)*gap, 8, WH-8),
    };
  });
  W.marks.push({ x: wx, y: wy, t: 0, life: .55 });
}

/* =====================================================================
   渲染
   ===================================================================== */
let alpha = 0;

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#10140f';
  ctx.fillRect(0,0,VW,VH);

  drawGround();
  drawMarks();
  for(const u of W.units) drawUnit(u);
  for(const u of W.sel) drawSelRing(u);

  if(input.down && input.dragged) drawBox();
  drawHud();
}

function drawGround(){
  const x0 = Math.max(0, Math.floor((cam.x - VW/2/cam.z)/TILE)-1);
  const y0 = Math.max(0, Math.floor((cam.y - VH/2/cam.z)/TILE)-1);
  const x1 = Math.min(MW-1, Math.ceil((cam.x + VW/2/cam.z)/TILE));
  const y1 = Math.min(MH-1, Math.ceil((cam.y + VH/2/cam.z)/TILE));

  const w = TILE*cam.z + .6;
  for(let ty=y0; ty<=y1; ty++){
    for(let tx=x0; tx<=x1; tx++){
      const p = w2s(tx*TILE, ty*TILE);
      // 两色棋盘 + 一点点哈希扰动，比纯色地面耐看，也让人能看出格子尺寸
      const n = ((tx*73856093) ^ (ty*19349663)) >>> 0;
      const k = (n % 7) / 7;
      const g = 62 + Math.round(k*10);
      ctx.fillStyle = `rgb(${g-16},${g+10},${Math.round(g*0.72)})`;
      ctx.fillRect(p.x, p.y, w, w);
    }
  }
  // 每 4 格一条淡线，给距离感
  ctx.strokeStyle = 'rgba(0,0,0,.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let tx=x0; tx<=x1+1; tx++){
    if(tx % 4) continue;
    const p = w2s(tx*TILE, 0);
    ctx.moveTo(Math.round(p.x)+.5, 0); ctx.lineTo(Math.round(p.x)+.5, VH);
  }
  for(let ty=y0; ty<=y1+1; ty++){
    if(ty % 4) continue;
    const p = w2s(0, ty*TILE);
    ctx.moveTo(0, Math.round(p.y)+.5); ctx.lineTo(VW, Math.round(p.y)+.5);
  }
  ctx.stroke();
}

function drawUnit(u){
  const x = u.px + (u.x-u.px)*alpha;
  const y = u.py + (u.y-u.py)*alpha;
  const p = w2s(x,y);
  const z = cam.z;
  const blue = u.owner === 0;

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.arc(p.x+1.5*z, p.y+2*z, u.r*z, 0, 7); ctx.fill();

  ctx.fillStyle = blue ? '#4d84c9' : '#c9564a';
  ctx.beginPath(); ctx.arc(p.x, p.y, u.r*z, 0, 7); ctx.fill();
  ctx.strokeStyle = blue ? '#a9cdf5' : '#f0b0a4';
  ctx.lineWidth = Math.max(1, 1.2*z);
  ctx.stroke();

  // 朝向：一条短线。没有它，单位移动看起来像在"滑"而不是"走"
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(u.face)*u.r*z*1.5, p.y + Math.sin(u.face)*u.r*z*1.5);
  ctx.stroke();
}

function drawSelRing(u){
  const x = u.px + (u.x-u.px)*alpha;
  const y = u.py + (u.y-u.py)*alpha;
  const p = w2s(x,y);
  ctx.strokeStyle = 'rgba(150,240,140,.9)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + 3*cam.z, (u.r+5)*cam.z, (u.r+3)*cam.z, 0, 0, 7);
  ctx.stroke();
}

function drawMarks(){
  for(const m of W.marks){
    const k = m.t/m.life;
    const p = w2s(m.x, m.y);
    ctx.strokeStyle = `rgba(190,240,160,${1-k})`;
    ctx.lineWidth = 2*cam.z;
    ctx.beginPath(); ctx.arc(p.x, p.y, (8+k*26)*cam.z, 0, 7); ctx.stroke();
  }
}

function drawBox(){
  const x = Math.min(input.sx,input.ex), y = Math.min(input.sy,input.ey);
  const w = Math.abs(input.ex-input.sx), h = Math.abs(input.ey-input.sy);
  ctx.fillStyle = 'rgba(140,220,120,.10)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = 'rgba(170,240,150,.85)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+.5,y+.5,w,h);
}

function drawHud(){
  document.getElementById('cnt').textContent = W.units.length;
  document.getElementById('sel').textContent = W.sel.length;
  document.getElementById('cam').textContent = Math.round(cam.x)+','+Math.round(cam.y);
  document.getElementById('zoom').textContent = cam.z.toFixed(2);
}

/* =====================================================================
   输入
   ===================================================================== */
cv.addEventListener('mousedown', e=>{
  if(e.button === 0){
    input.sx = input.ex = e.clientX;
    input.sy = input.ey = e.clientY;
    input.down = true; input.dragged = false;
  } else if(e.button === 1){
    e.preventDefault();
    input.pan = true; input.px = e.clientX; input.py = e.clientY;
  }
});

cv.addEventListener('mousemove', e=>{
  input.mx = e.clientX; input.my = e.clientY; input.inside = true;
  if(input.pan){
    cam.x -= (e.clientX-input.px)/cam.z;
    cam.y -= (e.clientY-input.py)/cam.z;
    input.px = e.clientX; input.py = e.clientY;
    clampCam();
  }
  if(input.down){
    input.ex = e.clientX; input.ey = e.clientY;
    if(Math.abs(input.ex-input.sx) > 5 || Math.abs(input.ey-input.sy) > 5) input.dragged = true;
  }
});

window.addEventListener('mouseup', e=>{
  if(e.button === 1){ input.pan = false; return; }
  if(e.button !== 0 || !input.down) return;
  input.down = false;

  if(input.dragged){
    boxSelect(input.sx, input.sy, input.ex, input.ey, e.shiftKey);
  } else {
    const w = s2w(input.mx, input.my);
    const hit = pick(w.x, w.y);
    if(hit && hit.owner === 0){
      if(e.shiftKey){
        if(!W.sel.includes(hit)) W.sel.push(hit);
      } else W.sel = [hit];
    } else if(!e.shiftKey){
      W.sel = [];
    }
  }
});

cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(!W.sel.length) return;
  const w = s2w(e.clientX, e.clientY);
  orderMove(W.sel, w.x, w.y);
});

cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const before = s2w(e.clientX, e.clientY);
  cam.z = clamp(cam.z * (e.deltaY > 0 ? .88 : 1.14), .4, 1.8);
  const after = s2w(e.clientX, e.clientY);
  cam.x += before.x - after.x;
  cam.y += before.y - after.y;
  clampCam();
}, { passive:false });

window.addEventListener('keydown', e=>{ input.keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e=>{ input.keys[e.key.toLowerCase()] = false; });

function pick(wx, wy){
  let best = null, bd = 1e9;
  for(const u of W.units){
    const d = Math.hypot(u.x-wx, u.y-wy);
    if(d < u.r+8 && d < bd){ bd = d; best = u; }
  }
  return best;
}

function boxSelect(x1,y1,x2,y2,additive){
  const ax = Math.min(x1,x2), bx = Math.max(x1,x2);
  const ay = Math.min(y1,y2), by = Math.max(y1,y2);
  const got = [];
  for(const u of W.units){
    if(u.owner !== 0) continue;
    const p = w2s(u.x,u.y);
    if(p.x>=ax && p.x<=bx && p.y>=ay && p.y<=by) got.push(u);
  }
  if(additive){ for(const u of got) if(!W.sel.includes(u)) W.sel.push(u); }
  else W.sel = got;
}

/* 相机连续移动：键盘 + 屏幕边缘推。
   边缘推是红警的核心手感之一，阈值给 10px，速度随缩放变化（放大时慢一点）。 */
function updateCamera(dt){
  let dx = 0, dy = 0;
  const k = input.keys;
  if(k['a'] || k['arrowleft'])  dx--;
  if(k['d'] || k['arrowright']) dx++;
  if(k['w'] || k['arrowup'])    dy--;
  if(k['s'] || k['arrowdown'])  dy++;

  const edge = 10, push = 1;
  if(input.inside && !input.pan && !input.down){
    if(input.mx < edge) dx -= push;
    if(input.mx > VW-edge) dx += push;
    if(input.my < edge) dy -= push;
    if(input.my > VH-edge) dy += push;
  }
  if(dx || dy){
    const len = Math.hypot(dx,dy) || 1;
    const sp = 900/cam.z * dt;
    cam.x += dx/len*sp;
    cam.y += dy/len*sp;
    clampCam();
  }
}

/* =====================================================================
   开局 + 主循环
   ===================================================================== */
function setup(){
  resize();
  // 蓝方两队，红方一队，纯粹用来测试选择与移动
  for(let i=0;i<6;i++) addUnit('inf', 900 + (i%3)*54, 1500 + Math.floor(i/3)*54, 0);
  for(let i=0;i<3;i++) addUnit('tank', 760 + i*70, 1620, 0);
  for(let i=0;i<5;i++) addUnit('inf', 2200 + (i%3)*54, 800 + Math.floor(i/3)*54, 1);
  for(let i=0;i<2;i++) addUnit('tank', 2140 + i*70, 900, 1);

  cam.x = 900; cam.y = 1550; cam.z = 1;
  clampCam();
}

let last = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0;

function frame(now){
  const dt = Math.min(.1, (now-last)/1000);
  last = now;

  updateCamera(dt);          // 相机按真实时间走，手感才跟得上鼠标
  acc += dt;
  while(acc >= TICK){ step(); acc -= TICK; }   // 逻辑固定步长
  alpha = acc / TICK;                          // 渲染插值系数

  render();

  fpsAcc += dt; fpsN++;
  if(fpsAcc > .5){
    document.getElementById('fps').textContent = Math.round(fpsN/fpsAcc);
    fpsAcc = 0; fpsN = 0;
  }
  requestAnimationFrame(frame);
}

setup();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
