<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTS · 初版（2.5D 等距）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e120d;
    font-family:-apple-system,"PingFang SC",sans-serif;color:#ddd8c8;user-select:none}
  #cv{display:block;position:absolute;inset:0;cursor:crosshair}
  #hud{position:absolute;left:0;top:0;padding:8px 14px;font-size:12px;line-height:1.75;
    color:#93a382;font-variant-numeric:tabular-nums;pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.7)}
  #hud b{color:#ffd76a;font-weight:600}
  #help{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    font-size:12px;color:#8d9c7d;background:rgba(14,18,13,.82);
    padding:6px 14px;border-radius:14px;border:1px solid #2c3626;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div>FPS <b id="fps">--</b> · 单位 <b id="cnt">0</b> · 已选 <b id="sel">0</b></div>
  <div>格 <b id="tile">-, -</b> · 缩放 <b id="zoom">1.00</b></div>
</div>
<div id="help">左键框选 / 点选 · Shift 加选 · 右键移动 · WASD 或推边平移 · 滚轮缩放 · 中键拖拽</div>

<script src="sprites.js"></script>
<script>
(function(){
'use strict';

/* =========================================================================
   初版 · 2.5D 等距
   -------------------------------------------------------------------------
   三层结构（将来换引擎时前两层可整体搬走）：
     1) 世界状态：纯数据，单位坐标是正交的 (x, y)，单位是"格"
     2) 逻辑 tick：固定 30Hz，只改数据，不碰画布
     3) 渲染：把 (x, y, z) 投影成屏幕，按深度排序后画上去

   投影：sx = (x - y) * 32 ; sy = (x + y) * 16 - z
   ========================================================================= */

const TILE_W = 64, TILE_H = 32;
const HALF_W = TILE_W/2, HALF_H = TILE_H/2;
const MW = 60, MH = 60;
const TICK = 1/30;

const isoX = (x, y) => (x - y) * HALF_W;
const isoY = (x, y, z) => (x + y) * HALF_H - (z || 0);

/* ---------- 世界状态 ---------- */
const W = { t: 0, units: [], buildings: [], props: [], ore: [], sel: [], marks: [] };
let uid = 1;

const UNIT_DEF = {
  inf:  { hp: 80,  speed: 3.2, r: .34 },
  tank: { hp: 300, speed: 3.9, r: .46 },
  harv: { hp: 210, speed: 3.4, r: .46 },
};

function addUnit(type, x, y, owner){
  const d = UNIT_DEF[type];
  const u = { id: uid++, type, owner, x, y, px: x, py: y,
              hp: d.hp, maxHp: d.hp, speed: d.speed, r: d.r,
              dest: null, face: owner ? Math.PI : 0 };
  W.units.push(u);
  return u;
}

function addBuilding(type, tx, ty, owner){
  const d = ART.BLD[type];
  W.buildings.push({ id: uid++, type, tx, ty, w: d.w, h: d.h, owner, H: d.H });
}

function addProp(kind, x, y){
  W.props.push({ kind, x, y, v: (Math.random()*3)|0 });
}

/* ---------- 相机 ---------- */
const cam = { x: 0, y: 0, z: 1 };
const clamp = (v,a,b)=> v<a?a:v>b?b:v;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = VW*DPR; cv.height = VH*DPR;
  cv.style.width = VW+'px'; cv.style.height = VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);

const w2s = (x, y, z)=>{
  const px = isoX(x,y), py = isoY(x,y,z);
  return { x: (px - cam.x)*cam.z + VW/2, y: (py - cam.y)*cam.z + VH/2 };
};
const s2g = (sx, sy)=>{
  const px = (sx - VW/2)/cam.z + cam.x;
  const py = (sy - VH/2)/cam.z + cam.y;
  return { x: px/(2*HALF_W) + py/(2*HALF_H),
           y: py/(2*HALF_H) - px/(2*HALF_W) };
};

function clampCam(){
  cam.x = clamp(cam.x, isoX(0, MH), isoX(MW, 0));
  cam.y = clamp(cam.y, 0, isoY(MW, MH, 0));
}

/* ---------- 输入 ---------- */
const input = { mx:0, my:0, inside:false, down:false, dragged:false,
                sx:0, sy:0, ex:0, ey:0, pan:false, px:0, py:0, keys:{} };

/* =========================================================================
   逻辑 tick
   ========================================================================= */
function step(){
  W.t += TICK;
  for(const u of W.units){
    u.px = u.x; u.py = u.y;
    if(u.dest) moveToward(u, u.dest.x, u.dest.y);
  }
  separate();
  for(const m of W.marks) m.t += TICK;
  W.marks = W.marks.filter(m => m.t < m.life);
}

function moveToward(u, tx, ty){
  const dx = tx-u.x, dy = ty-u.y;
  const d = Math.hypot(dx,dy);
  if(d < .05){ u.dest = null; return; }
  const s = u.speed * TICK;
  const k = Math.min(d, s)/d;
  u.x += dx*k; u.y += dy*k;
  u.face = Math.atan2(dy,dx);
  u.x = clamp(u.x, .3, MW-.3);
  u.y = clamp(u.y, .3, MH-.3);
  if(d <= s) u.dest = null;
}

/* 互推：几十个单位够用。上百个再上真正的寻路 + 局部避障。 */
function separate(){
  const us = W.units;
  for(let i=0;i<us.length;i++){
    for(let j=i+1;j<us.length;j++){
      const a = us[i], b = us[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const rr = a.r + b.r;
      const d2 = dx*dx + dy*dy;
      if(d2 > rr*rr || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const push = (rr-d)*.5;
      const nx = dx/d, ny = dy/d;
      a.x -= nx*push; a.y -= ny*push;
      b.x += nx*push; b.y += ny*push;
    }
  }
}

function orderMove(units, gx, gy){
  const n = units.length;
  if(!n) return;
  const cols = Math.ceil(Math.sqrt(n));
  const gap = 1.15;
  units.forEach((u,i)=>{
    const cx = i % cols, cy = Math.floor(i/cols);
    u.dest = {
      x: clamp(gx + (cx-(cols-1)/2)*gap, .4, MW-.4),
      y: clamp(gy + (cy-Math.ceil(n/cols)/2)*gap, .4, MH-.4),
    };
  });
  W.marks.push({ x: gx, y: gy, t: 0, life: .6 });
}

/* =========================================================================
   渲染
   ========================================================================= */
let alpha = 0;

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0e120d';
  ctx.fillRect(0,0,VW,VH);

  drawGround();
  drawOre();
  drawMarks();

  /* 深度排序：x+y 越大越近。
     建筑用前沿角 (tx+w, ty+h) 参与排序，单位才能正确地从楼前走过。 */
  const list = [];
  for(const b of W.buildings) list.push({ d: b.tx + b.ty + b.w + b.h, b });
  for(const p of W.props)     list.push({ d: p.x + p.y, p });
  for(const u of W.units)     list.push({ d: u.x + u.y, u });
  list.sort((a,b)=> a.d - b.d);
  for(const it of list){
    if(it.b) drawBuilding(it.b);
    else if(it.p) drawProp(it.p);
    else drawUnit(it.u);
  }

  for(const u of W.sel) drawSelRing(u);
  if(input.down && input.dragged) drawBox();
  drawHud();
}

function drawGround(){
  const cs = [s2g(0,0), s2g(VW,0), s2g(0,VH), s2g(VW,VH)];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const c of cs){
    x0=Math.min(x0,c.x); x1=Math.max(x1,c.x);
    y0=Math.min(y0,c.y); y1=Math.max(y1,c.y);
  }
  x0 = Math.max(0, Math.floor(x0)-1); x1 = Math.min(MW-1, Math.ceil(x1)+1);
  y0 = Math.max(0, Math.floor(y0)-1); y1 = Math.min(MH-1, Math.ceil(y1)+1);

  const hw = HALF_W*cam.z, hh = HALF_H*cam.z;
  const COLORS = ['#4f5f3e', '#556542', '#475636'];

  for(let k=0;k<3;k++){
    ctx.beginPath();
    for(let ty=y0; ty<=y1; ty++){
      for(let tx=x0; tx<=x1; tx++){
        const n = ((tx*73856093) ^ (ty*19349663)) >>> 0;
        if(n % 3 !== k) continue;
        const c = w2s(tx+.5, ty+.5, 0);
        ctx.moveTo(c.x, c.y - hh);
        ctx.lineTo(c.x + hw, c.y);
        ctx.lineTo(c.x, c.y + hh);
        ctx.lineTo(c.x - hw, c.y);
        ctx.closePath();
      }
    }
    ctx.fillStyle = COLORS[k];
    ctx.fill();
  }

  ctx.beginPath();
  for(let ty=y0; ty<=y1+1; ty++){
    for(let tx=x0; tx<=x1+1; tx++){
      const a = w2s(tx, ty, 0);
      if(tx <= x1){ const b = w2s(tx+1, ty, 0); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
      if(ty <= y1){ const c = w2s(tx, ty+1, 0); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); }
    }
  }
  ctx.strokeStyle = 'rgba(0,0,0,.10)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawOre(){
  const z = cam.z;
  for(const t of W.ore){
    const p = w2s(t.x + .5, t.y + .5, 0);
    if(p.x < -90*z || p.x > VW+90*z || p.y < -90*z || p.y > VH+90*z) continue;
    const sp = ART.ore(t.v);
    ctx.drawImage(sp.img, p.x - sp.ax*z, p.y - sp.ay*z, sp.w*z, sp.h*z);
  }
}

function drawProp(p){
  const z = cam.z;
  const s = w2s(p.x, p.y, 0);
  const sp = ART.prop(p.kind + p.v);
  ctx.drawImage(sp.img, s.x - sp.ax*z, s.y - sp.ay*z, sp.w*z, sp.h*z);
}

/* 单位朝向 → 精灵角度。
   等距下"格坐标里的方向"和"屏幕上的方向"不是同一个角，这里做一次换算。 */
function spriteAngle(face){
  const c = Math.cos(face), s = Math.sin(face);
  return Math.round(Math.atan2(s + c, c - s) / (Math.PI*2) * ART.DIRS);
}

function drawUnit(u){
  const x = u.px + (u.x-u.px)*alpha;
  const y = u.py + (u.y-u.py)*alpha;
  const s = w2s(x, y, 0);
  const z = cam.z;

  ctx.fillStyle = 'rgba(0,0,0,.26)';
  ctx.beginPath();
  ctx.ellipse(s.x, s.y, 12*z, 5.5*z, 0, 0, 7);
  ctx.fill();

  const sp = ART.unit(u.type, u.owner, spriteAngle(u.face));
  ctx.drawImage(sp.img, s.x - sp.ax*z, s.y - sp.ay*z, sp.w*z, sp.h*z);
}

function drawBuilding(b){
  const z = cam.z;
  const c = w2s(b.tx + b.w/2, b.ty + b.h/2, 0);
  const sp = ART.bld(b.type, b.owner);
  ctx.drawImage(sp.img, c.x - sp.ax*z, c.y - sp.ay*z, sp.w*z, sp.h*z);
}

function drawSelRing(u){
  const x = u.px + (u.x-u.px)*alpha;
  const y = u.py + (u.y-u.py)*alpha;
  const p = w2s(x, y, 0);
  const r = (u.r*HALF_W + 6) * cam.z;
  ctx.strokeStyle = 'rgba(150,240,140,.95)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + cam.z, r, r*.5, 0, 0, 7);
  ctx.stroke();
}

function drawMarks(){
  for(const m of W.marks){
    const k = m.t/m.life;
    const p = w2s(m.x, m.y, 0);
    const r = (6 + k*22) * cam.z;
    ctx.strokeStyle = `rgba(190,240,160,${1-k})`;
    ctx.lineWidth = 2*cam.z;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r, r*.5, 0, 0, 7);
    ctx.stroke();
  }
}

function drawBox(){
  const x = Math.min(input.sx,input.ex), y = Math.min(input.sy,input.ey);
  const w = Math.abs(input.ex-input.sx), h = Math.abs(input.ey-input.sy);
  ctx.fillStyle = 'rgba(140,220,120,.10)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = 'rgba(170,240,150,.85)'; ctx.lineWidth = 1;
  ctx.strokeRect(x+.5,y+.5,w,h);
}

function drawHud(){
  const g = s2g(input.mx, input.my);
  document.getElementById('cnt').textContent = W.units.length;
  document.getElementById('sel').textContent = W.sel.length;
  document.getElementById('tile').textContent =
    (g.x>=0&&g.x<MW&&g.y>=0&&g.y<MH) ? `${g.x.toFixed(1)}, ${g.y.toFixed(1)}` : '-, -';
  document.getElementById('zoom').textContent = cam.z.toFixed(2);
}

/* =========================================================================
   输入
   ========================================================================= */
cv.addEventListener('mousedown', e=>{
  if(e.button === 0){
    input.sx = input.ex = e.clientX;
    input.sy = input.ey = e.clientY;
    input.down = true; input.dragged = false;
  } else if(e.button === 1){
    e.preventDefault();
    input.pan = true; input.px = e.clientX; input.py = e.clientY;
  }
});

cv.addEventListener('mousemove', e=>{
  input.mx = e.clientX; input.my = e.clientY; input.inside = true;
  if(input.pan){
    cam.x -= (e.clientX-input.px)/cam.z;
    cam.y -= (e.clientY-input.py)/cam.z;
    input.px = e.clientX; input.py = e.clientY;
    clampCam();
  }
  if(input.down){
    input.ex = e.clientX; input.ey = e.clientY;
    if(Math.abs(input.ex-input.sx) > 5 || Math.abs(input.ey-input.sy) > 5) input.dragged = true;
  }
});

window.addEventListener('mouseup', e=>{
  if(e.button === 1){ input.pan = false; return; }
  if(e.button !== 0 || !input.down) return;
  input.down = false;

  if(input.dragged){
    boxSelect(input.sx, input.sy, input.ex, input.ey, e.shiftKey);
  } else {
    const g = s2g(input.mx, input.my);
    const hit = pick(g.x, g.y);
    if(hit && hit.owner === 0){
      if(e.shiftKey){ if(!W.sel.includes(hit)) W.sel.push(hit); }
      else W.sel = [hit];
    } else if(!e.shiftKey){
      W.sel = [];
    }
  }
});

cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(!W.sel.length) return;
  const g = s2g(e.clientX, e.clientY);
  orderMove(W.sel, g.x, g.y);
});

cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const before = s2g(e.clientX, e.clientY);
  cam.z = clamp(cam.z * (e.deltaY > 0 ? .88 : 1.14), .45, 1.8);
  const after = s2g(e.clientX, e.clientY);
  cam.x += isoX(before.x,before.y) - isoX(after.x,after.y);
  cam.y += isoY(before.x,before.y,0) - isoY(after.x,after.y,0);
  clampCam();
}, { passive:false });

window.addEventListener('keydown', e=>{ input.keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e=>{ input.keys[e.key.toLowerCase()] = false; });

function pick(gx, gy){
  let best = null, bd = 1e9;
  for(const u of W.units){
    const d = Math.hypot(u.x-gx, u.y-gy);
    if(d < u.r + .35 && d < bd){ bd = d; best = u; }
  }
  return best;
}

function boxSelect(x1,y1,x2,y2,additive){
  const ax = Math.min(x1,x2), bx = Math.max(x1,x2);
  const ay = Math.min(y1,y2), by = Math.max(y1,y2);
  const got = [];
  for(const u of W.units){
    if(u.owner !== 0) continue;
    const p = w2s(u.x, u.y, 0);
    if(p.x>=ax && p.x<=bx && p.y>=ay && p.y<=by) got.push(u);
  }
  if(additive){ for(const u of got) if(!W.sel.includes(u)) W.sel.push(u); }
  else W.sel = got;
}

function updateCamera(dt){
  let dx = 0, dy = 0;
  const k = input.keys;
  if(k['a'] || k['arrowleft'])  dx--;
  if(k['d'] || k['arrowright']) dx++;
  if(k['w'] || k['arrowup'])    dy--;
  if(k['s'] || k['arrowdown'])  dy++;

  const edge = 10;
  if(input.inside && !input.pan && !input.down){
    if(input.mx < edge) dx--;
    if(input.mx > VW-edge) dx++;
    if(input.my < edge) dy--;
    if(input.my > VH-edge) dy++;
  }
  if(dx || dy){
    const len = Math.hypot(dx,dy) || 1;
    const sp = 1050 * dt / cam.z;
    cam.x += dx/len*sp;
    cam.y += dy/len*sp;
    clampCam();
  }
}

/* =========================================================================
   开局
   ========================================================================= */
function setup(){
  resize();
  ART.build();

  addBuilding('yard',     4, 44, 0);
  addBuilding('barracks', 10, 44, 0);
  addBuilding('power',    10, 40, 0);
  addBuilding('yard',    52, 12, 1);
  addBuilding('barracks', 46, 14, 1);
  addBuilding('refinery', 48, 18, 1);

  for(let i=0;i<6;i++) addUnit('inf', 7 + (i%3)*1.1, 49 + Math.floor(i/3)*1.1, 0);
  for(let i=0;i<3;i++) addUnit('tank', 11 + i*1.5, 51, 0);
  addUnit('harv', 13, 48, 0);
  for(let i=0;i<5;i++) addUnit('inf', 45 + (i%3)*1.1, 21 + Math.floor(i/3)*1.1, 1);
  for(let i=0;i<2;i++) addUnit('tank', 43 + i*1.5, 23, 1);
  addUnit('harv', 51, 22, 1);

  seedOre(16, 52, 3.2); seedOre(24, 46, 2.4);
  seedOre(42, 8, 3.2);  seedOre(34, 14, 2.4);
  seedOre(29, 29, 3.6); seedOre(31, 32, 2.6);
  seedOre(12, 30, 2.2); seedOre(47, 36, 2.2);

  const busy = (tx,ty)=>{
    for(const b of W.buildings)
      if(tx>=b.tx-1 && tx<=b.tx+b.w && ty>=b.ty-1 && ty<=b.ty+b.h) return true;
    return false;
  };
  for(let i=0;i<200;i++){
    const tx = 2 + Math.random()*(MW-4), ty = 2 + Math.random()*(MH-4);
    if(busy(tx,ty)) continue;
    if(W.ore.some(o=> Math.hypot(o.x-tx, o.y-ty) < 2.5)) continue;
    addProp(Math.random() < .72 ? 'tree' : 'rock', tx, ty);
  }

  cam.x = isoX(9, 48); cam.y = isoY(9, 48, 0);
  cam.z = 1;
  clampCam();
}

function seedOre(cx, cy, r){
  for(let ty=Math.floor(cy-r); ty<=Math.ceil(cy+r); ty++){
    for(let tx=Math.floor(cx-r); tx<=Math.ceil(cx+r); tx++){
      if(tx<1||ty<1||tx>=MW-1||ty>=MH-1) continue;
      const d = Math.hypot(tx+0.5-cx, ty+0.5-cy);
      if(d > r - Math.random()*0.7) continue;
      W.ore.push({ x:tx, y:ty, v:(Math.random()*3)|0 });
    }
  }
}

let last = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0;

function frame(now){
  const dt = Math.min(.1, (now-last)/1000);
  last = now;

  updateCamera(dt);
  acc += dt;
  while(acc >= TICK){ step(); acc -= TICK; }
  alpha = acc/TICK;

  render();

  fpsAcc += dt; fpsN++;
  if(fpsAcc > .5){
    document.getElementById('fps').textContent = Math.round(fpsN/fpsAcc);
    fpsAcc = 0; fpsN = 0;
  }
  requestAnimationFrame(frame);
}

setup();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
