<script>
(function(){
'use strict';

/* ============================================================
   WordTower · 文字塔防（复刻）
   核心：1V1 上下分屏双线对攻 / 主公 3 命 / 8×8 棋盘 ·
        出兵点一格、主公一格、中间一条蛇形路占若干格 /
        蛇形路每局随机重掷（不许占满任何 2×2 田字格） /
        征兵一次刷新 5 格（旧牌自动回收） / 馒头只来自杀敌 /
        同字升阶 / 12 名将拼名召唤 / 羁绊 /
        神秘商人道具 / 白绿蓝紫金五品
   版式：竖屏 720×1446，分上中下三段 ——
        上 1/3 左半是战况面板（馒头/波次/主公/羁绊），右半是敌军缩略图（点一下放大到上 2/3，再点收起）；
        下 2/3 是玩家操作区：我方棋盘按 1.16 倍渲染 + 兵营 + 按键。
        世界坐标（两块 8×8 棋盘、格距 72、上下镜像）一个字没动，
        缩放只是「怎么画」，射程/行军/命中全在世界坐标里算，上下依旧完全对称。
   ============================================================ */

/* ---------------- 画布 ---------------- */
const W = 720, H = 1446;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1;

/* 棋盘：8 列 × 8 行的一张方阵。
   出兵点与主公各自就是棋盘上的一个格子，两点之间用一条蛇形「路」连起来 ——
   路格与主公格不可布防，其余格子才是能摆兵、摆将的地方。
   竖版比例：两块棋盘上下叠放，纵向一共 16 行格子 —— 画面天生偏瘦长。
   所以格子从 78 收到 72，上下留白（HUD / 中缝 / 手牌 / 按钮）一并压紧，
   整幅画布从 720×1620 收到 720×1446，左右留白用阵营标签填上。 */
const COLS = 8, ROWS = 8, CELL = 72;
const BX = (W - COLS * CELL) / 2;        // 72
const Y_ENEMY = 80;                       // 电脑方棋盘 y0 -> 80..656
const Y_MINE  = 676;                      // 我方棋盘 y0 -> 676..1252
const MID1 = 656, MID2 = 676;             // 中缝（双方的出兵点都贴着它）
const ADU_R = 24;

const cellAt = (c, r) => c + r*COLS;

/* 熟地（开局直接能布阵的格子）与荒地：
   一局开始时只发 START_OPEN 格熟地 —— 从「离路近、贴着主公、靠前线」的次序里挑最好的几格，
   其余可布防的格子全是荒地，得一格一格用铲子挖开。
   电脑半场拿的是同一张名单的上下镜像（FREE_E），两边地界完全对等。 */
const START_OPEN = 7;
/* 开局熟地数直接决定「守军上限」，所以它和铲子掉率是一对：7 格起手 + 铲子 16%，
   一局大约能开到 10-12 格。原来 5 格 + 10% 时整局只有 6-8 格，第 3 波起就摆不满防线了。 */
const SHOVEL_RATE = 0.16;
let FREE_M = {}, FREE_E = {};        // 熟地名单：我方 / 电脑半场（上下镜像）
function computeFreeLand(){
  const cand = [];
  for (let i = 0; i < COLS*ROWS; i++){
    if (isRoad(i, true)) continue;
    cand.push(i);
  }
  // 分数高的先给：离路近、挨着主公、越靠前线越好
  cand.sort((a, b) => (cellScore(b, true) - cellScore(a, true)) || (a - b));
  FREE_M = {}; FREE_E = {};
  for (const i of cand.slice(0, START_OPEN)){
    FREE_M[i] = true;
    FREE_E[cellAt(colOf(i), ROWS - 1 - rowOf(i))] = true;
  }
}

/* ---------------- 随机地图 ----------------
   一条「路」= 从出兵点（紧贴中缝那一行的一格）出发、一路往下蛇行到主公身前的一串格子。
   本地坐标 [列, 行]：行 0 贴着中缝，行 ROWS-1 是最里侧（主公坐的那一行）。
   两条硬规矩：
     1) 路是一串首尾相连、互不重叠的格子，最后停在与主公正交相邻的那一格；
     2) 任何 2×2 田字格都不允许被路块（含主公那一格）占满 ——
        占满了就会出现一块实心死角，既糊成一团，也挡住布防视野。
   每次开局重掷一张；电脑半场用同一张图上下镜像，两边完全对等。 */

let PATH_M = [];                     // 我方半场的路
let ADU_M_C = [0, ROWS-1];           // 我方主公：路的尽头再往里一格
let PATH_E = [];                     // 电脑半场（上下镜像）
let ADU_E_C = [0, 0];
let PATH_CELLS_M = [], PATH_CELLS_E = [];
let ADU_M_CELL = 0, ADU_E_CELL = 0;
let ADU_M = { x: 0, y: 0, r: ADU_R }, ADU_E = { x: 0, y: 0, r: ADU_R };

let mapRnd = Math.random;            // 地图专用的随机源（可换种子复现）
let fixedSeed = null;
let gRnd = Math.random;              // 对局随机源：征兵/商店/AI 抽牌/来兵等玩法随机都走它，有种子即可整局复现
function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const mapInt = n => (mapRnd() * n) | 0;

/* 掷一条候选路：从 (startC,0) 随机往下走，最后必须停在主公正上方那一格 */
function rollPath(){
  const startC = mapInt(COLS), aduC = mapInt(COLS);
  const path = [], seen = {};
  const push = (c, r) => { path.push([c, r]); seen[r*COLS + c] = 1; };
  let c = startC, r = 0, run = 0, guard = 0;
  push(c, r);
  while (guard++ < 160){
    if (r === ROWS-2 && c === aduC) break;        // 停到主公跟前，收工
    if (r === ROWS-2){                            // 倒数第二行：只朝主公那一列靠
      c += (c < aduC ? 1 : -1);
      push(c, r);
      continue;
    }
    const canL = c > 0 && !seen[r*COLS + c-1];
    const canR = c < COLS-1 && !seen[r*COLS + c+1];
    // 横着跑太长就往下拐：横带短一点，路才铺得开
    const mustDown = run >= 5 + mapInt(4) || !(canL || canR);
    if (mustDown || mapRnd() < 0.27){
      r++; run = 0; push(c, r);
    } else if (canL && canR){
      c += (mapRnd() < 0.5 ? -1 : 1); run++; push(c, r);
    } else if (canL){
      c--; run++; push(c, r);
    } else {
      c++; run++; push(c, r);
    }
  }
  const cols = {};
  for (const p of path) cols[p[0]] = 1;
  return { path, aduC, cols: Object.keys(cols).length };
}

/* 2×2 校验：任何一个田字格都不许被路块占满 */
function quadOK(path, aduC){
  const road = {};
  for (const p of path) road[p[1]*COLS + p[0]] = 1;
  road[(ROWS-1)*COLS + aduC] = 1;                 // 主公那一格也是路
  for (let r = 0; r < ROWS-1; r++)
    for (let c = 0; c < COLS-1; c++)
      if (road[r*COLS+c] && road[r*COLS+c+1] &&
          road[(r+1)*COLS+c] && road[(r+1)*COLS+c+1]) return false;
  return true;
}

/* 兜底地图：万一脸黑掷不出合格的，就用这张手写的（同样满足 2×2 约束） */
const FALLBACK = { aduC: 3, path: [
  [3,0],
  [3,1],[2,1],[1,1],[0,1],
  [0,2],[0,3],[0,4],
  [1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],
  [7,5],[7,6],
  [6,6],[5,6],[4,6],[3,6],
] };

/* 把一条路写进全局：我方用原样，电脑半场上下镜像 */
function applyMap(path, aduC){
  PATH_M = path.map(p => [p[0], p[1]]);
  ADU_M_C = [aduC, ROWS-1];
  PATH_E = PATH_M.map(p => [p[0], ROWS - 1 - p[1]]);
  ADU_E_C = [ADU_M_C[0], ROWS - 1 - ADU_M_C[1]];
  PATH_CELLS_M = PATH_M.map(p => cellAt(p[0], p[1]));
  PATH_CELLS_E = PATH_E.map(p => cellAt(p[0], p[1]));
  ADU_M_CELL = cellAt(ADU_M_C[0], ADU_M_C[1]);
  ADU_E_CELL = cellAt(ADU_E_C[0], ADU_E_C[1]);
  ADU_M = { x: cellCX(ADU_M_C[0]), y: cellCY(ADU_M_C[0], ADU_M_C[1], Y_MINE), r: ADU_R };
  ADU_E = { x: cellCX(ADU_E_C[0]), y: cellCY(ADU_E_C[0], ADU_E_C[1], Y_ENEMY), r: ADU_R };
}

/* 掷一张新地图。seed 给了就按种子复现（方便调试／写测试） */
function genMap(seed){
  if (seed === undefined) seed = fixedSeed;
  mapRnd = (seed === null || seed === undefined) ? Math.random : mulberry32(seed >>> 0);
  for (let attempt = 0; attempt < 900; attempt++){
    const m = rollPath();
    if (m.path.length < 20) continue;       // 太短：一路直下，既没布防纵深，敌军也跑得太快
    if (m.cols < 5) continue;               // 太窄：整条路挤在两三列里
    if (!quadOK(m.path, m.aduC)) continue;  // 占满了某个田字格
    applyMap(m.path, m.aduC);
    return { path: PATH_M.slice(), aduC: ADU_M_C[0] };
  }
  applyMap(FALLBACK.path, FALLBACK.aduC);
  return { path: PATH_M.slice(), aduC: ADU_M_C[0] };
}
genMap();

function pathList(mine){ return (mine === false) ? PATH_E : PATH_M; }
function pathCells(mine){ return (mine === false) ? PATH_CELLS_E : PATH_CELLS_M; }
function isPathCell(cell, mine){ return pathCells(mine).indexOf(cell) >= 0; }
function isAduCell(cell, mine){ return cell === (mine === false ? ADU_E_CELL : ADU_M_CELL); }
/* 路格 + 主公格：整条通道都不能布防 */
function isRoad(cell, mine){ return isPathCell(cell, mine) || isAduCell(cell, mine); }
/* 路的折线点（格心）：敌兵沿着它一个点一个点地走，
   走完最后一个点再往前一步就是主公 */
function pathPoints(mine){
  const base = (mine === false) ? Y_ENEMY : Y_MINE;
  return pathList(mine).map(p => ({ x: cellCX(p[0]), y: cellCY(p[0], p[1], base) }));
}
function spawnPos(mine){
  const base = (mine === false) ? Y_ENEMY : Y_MINE;
  const p = pathList(mine)[0];
  return { x: cellCX(p[0]), y: cellCY(p[0], p[1], base) };
}
/* 某个格子离「路」最近还隔着几格（切比雪夫距离）：1 = 紧贴路边，越大越荒 */
function pathAway(cell, mine){
  const c = colOf(cell), r = rowOf(cell);
  let best = 99;
  for (const p of pathList(mine))
    best = Math.min(best, Math.max(Math.abs(p[0] - c), Math.abs(p[1] - r)));
  return best;
}
/* 电脑能不能在这一格布阵：熟地名单（FREE_E）里的，或它自己用铲子挖开的 */
function aiLandOK(cell){
  if (FREE_E[cell]) return true;
  return !!(G && G.aiUnlocked && G.aiUnlocked[cell]);
}
/* ---------------- 某一侧的统一访问器 ----------------
   同一套决策代码要能同时驱动「电脑」和「挂机时的我方」，
   所以凡是要碰棋盘/手牌/熟地的地方都走这里，不再直接写 G.board / G.enBoard。 */
function sideBoard(mine){ return mine ? G.board : G.enBoard; }
function sideHand(mine){ return mine ? G.hand : G.ai.hand; }
function sideUnlocked(mine){ return mine ? G.unlocked : G.aiUnlocked; }
function landOKOf(cell, mine){ return mine ? !!G.unlocked[cell] : aiLandOK(cell); }
const AI_TICK = 0.55;        // 电脑对手的决策间隔（秒），真值取 AI_LEVELS[lv].tick
/* ---------------- 电脑难度 ----------------
   强度只调「决策质量」，不调兵种数值 —— 调数值会变成"AI 在作弊"，玩家一眼看得出来。
   四个旋钮：
     tick      多久想一次棋（越短越像个手快的人）
     raiderCap 同时在路上的主动出击兵上限（人类可以随时把整手牌倒上路）
     maxChars  盘上肯留几个"还没配成对"的单字（决定它拼不拼得出名将）
     holdFree  至少留几格空地才肯拿单字去占坑
     shieldAt  掉到几命就舍得开神兵符
     rush      会不会在开波前把落不下的兵集中推上路
   改难度只动这张表。 */
const AI_LEVELS = [
  { name:'新兵', desc:'想得慢，忘了往路上推兵', tick:0.80, raiderCap:3, maxChars:3, holdFree:5, shieldAt:1, rush:false },
  { name:'老将', desc:'会留格拼将，开波前集中推兵', tick:0.55, raiderCap:6, maxChars:5, holdFree:2, shieldAt:2, rush:true  },
  { name:'枭雄', desc:'想得快，路上常年压着 9 个兵', tick:0.40, raiderCap:9, maxChars:7, holdFree:1, shieldAt:2, rush:true  },
];
let AI_LV = 1;                       // 默认「老将」；0 新兵 / 1 老将 / 2 枭雄
const AIC = () => AI_LEVELS[clamp(AI_LV | 0, 0, AI_LEVELS.length - 1)];
function setAILevel(n){ AI_LV = clamp(n | 0, 0, AI_LEVELS.length - 1); return AI_LEVELS[AI_LV].name; }
/* 挂机：让电脑接管我方（单人对局专用）。
   它和难度是两回事 —— 难度管的是对面那一半；挂机只是把我方也交给同一套决策。
   开/关都会记进录像，所以挂机打的局依旧能完整回放。 */
let AUTOPILOT = false;
function setAutopilot(v){
  AUTOPILOT = !!v;
  if (G){ G.autopilot = AUTOPILOT; G.bot.t = 0; }
  if (REC.on) REC.auto.push([SIM.n, AUTOPILOT ? 1 : 0]);
  return AUTOPILOT;
}
/* 电脑盘上最多留几个「还没配成对」的单字（它们只是等伙伴的种子）。
   单字落地只是个占位道具（血 1、不会攻击），堆多了就是把熟地变成死地。 */
const AI_MAX_CHARS = 3;
/* 电脑盘上剩下的空熟地少于这个数时，就不再拿「配不成对的单字」去占坑了 ——
   坑位留给真兵更划算。 */
const AI_HOLD_FREE = 4;
/* 电脑要不要做异字合成（弩/骁/钺/铁/戟/骧这六个合成兵种）。
   关掉的理由：玩家看到对面凭空冒出没见过的兵种，第一反应是「AI 在作弊」——
   这是可读性问题，不是强度问题。打开 = true 即恢复对称规则。 */
const AI_FUSE = false;
/* 异字合成（弩/骁/钺/铁/戟/骧）整体关掉：两个不同兵种叠在一起不再变出新兵种。
   兵种就只留刀/枪/弓/骑四种 + 同种升阶 + 拼名召将，规则一眼能算清。
   想恢复只需把 FUSE_ON 改 true。 */
const FUSE_ON = false;
/* 电脑的合成结果是否允许落地：异字合成关着的时候，弓1+骑1 不再变骁骑 */
function aiCombOK(comb){
  return !!AI_FUSE || !(comb && comb.kind === 'unit' && !!FUSE[comb.type]);
}

/* ---------------- 版式：上中下三段 ----------------
   上 1/3 再横着切一半：
     左半 = 战况面板（馒头 / 波次 / 主公 / 羁绊，能读的都放这儿）
     右半 = 敌军缩略图（只读，点一下放大到上 2/3，再点收起）
   下 2/3 = 玩家操作区：我方棋盘（放大 1.16 倍渲染）+ 兵营 + 按键。
   世界坐标一个字没动 —— 两块棋盘还是同样大小、同样格距，
   变的是「怎么把世界画到屏幕上」：每个视口一套 ox/oy/k，
   逻辑（射程、行军、命中）全在世界坐标里算，所以上下依旧完全对称。 */
const TOP_H = Math.round(H / 3);          // 482
const BOT_Y = TOP_H;                      // 482
const BIG_H = Math.round(H * 2 / 3);      // 964（敌军放大后盖住上 2/3）
const TOP_L = { x: 0, y: 0, w: W/2, h: TOP_H };
const TOP_R = { x: W/2, y: 0, w: W/2, h: TOP_H };
const PLAY_S = 1.16;                      // 我方棋盘的渲染倍率（世界 576 → 668）
const MINI_K = 0.58;                      // 敌军缩略图倍率（世界 576 → 334）
const BIG_K  = 1.10;                      // 敌军放大后的倍率

const HAND_N = 5, HAND_S = 86, HAND_GAP = 8, HAND_Y = 1188;
const HAND_X0 = (W - (HAND_N * HAND_S + (HAND_N - 1) * HAND_GAP)) / 2; // 129
const BTN_ENLIST = { x: 24, y: 1296, w: 236, h: 58 };
const SLOT = [{ x: 276, y: 1297 }, { x: 344, y: 1297 }];
const SLOT_S = 56;
const BTN_PAUSE = { x: TOP_L.w - 68, y: 16, w: 50, h: 50 };   // 战况面板右上角
const BTN_AUTO  = { x: TOP_L.w - 136, y: 16, w: 62, h: 50 };  // 挂机开关（暂停键左边）
const BTN_FOLD = { x: W - 96, y: 26, w: 74, h: 44 };           // 放大视图里的「收起」

/* 视口：矩形（屏幕裁剪区）+ 缩放 k + 世界原点 wy0 落在屏幕的哪个 y。
   横向一律居中，所以只给 oy。 */
function mkView(rect, k, wy0, oy){
  const bw = COLS * CELL * k;
  return { k, wy0, ox: rect.x + (rect.w - bw)/2, oy,
           clip: { x: rect.x, y: rect.y, w: rect.w, h: rect.h } };
}
const V_MINI = mkView(TOP_R,          MINI_K, Y_ENEMY, 56);    // 敌军缩略图
const V_BIG  = mkView({ x:0, y:0, w:W, h:BIG_H }, BIG_K, Y_ENEMY, 168);  // 敌军放大
const V_PLAY = mkView({ x:0, y:BOT_Y, w:W, h:H-BOT_Y }, PLAY_S, Y_MINE, 496); // 我方棋盘

/* 屏幕点 -> 世界坐标（视口内） */
function viewPt(v, wx, wy){
  return { x: v.ox + (wx - BX) * v.k, y: v.oy + (wy - v.wy0) * v.k };
}
/* 世界坐标 -> 屏幕坐标（视口内） */
function viewWorld(v, p){
  return { x: BX + (p.x - v.ox) / v.k, y: v.wy0 + (p.y - v.oy) / v.k };
}
/* 某一格在屏幕上的矩形（拖拽高亮 / 落点提示用） */
function cellRectV(v, idx){

function fuseKey(a, b){
  const k1 = a + '+' + b, k2 = b + '+' + a;
  return FUSE[k1] ? k1 : (FUSE[k2] ? k2 : null);
}
/* 伤害形态查询：守军/行军兵都走这里。合成兵与名将没有 hitMode = 单体。 */
function hitModeOf(u){
  if (!u) return 'single';
  if (u.hitMode) return u.hitMode;
  const t = u.type && (UNITS[u.type] || FUSE[u.type]);
  return (t && t.hitMode) || 'single';
}

/* ---------------- 名将成长 ----------------
   合成不是唯一的升阶路：名将在场上杀敌会自己攒经验，攒够就自动升一阶。
   两条路共用 heroHpMul / heroAtkMul / heroRateMul，最后长成同一个东西。
   经验只按「谁补的最后一刀」算 —— 谁杀的谁长，不吃队友的战功。 */
const HERO_XP = [0, 40, 110, 220, 380];        // 升到下一级所需经验，按当前等级索引
function heroXpGain(foe){                       // 击杀一个敌兵给多少经验：看它的品阶
  return 6 + 5 * ((foe && foe.level ? foe.level : 1) - 1);
}
function heroMaxLv(u){ return (HEROES[u.type] && HERO_MAXLV[HEROES[u.type].r]) || 5; }
function heroXpNeed(u){ return HERO_XP[u.level] || 0; }
/* 记一次经验，返回这次升了几阶（0 = 没升） */
function addHeroXp(u, foe, mine){
  if (!u || u.kind !== 'hero' || !HEROES[u.type]) return 0;
  const cap = heroMaxLv(u);
  if (u.level >= cap) return 0;
  u.xp = (u.xp || 0) + heroXpGain(foe);
  let up = 0;
  while (u.level < cap && u.xp >= heroXpNeed(u)){ u.xp -= heroXpNeed(u); u.level++; up++; }
  if (!up) return 0;
  // 升阶：按新等级重算三维，顺手回满血
  const h = HEROES[u.type];
  u.maxHp = Math.round(h.hp * heroHpMul(u.level));
  u.hp = u.maxHp;
  u.atk = Math.round(h.atk * heroAtkMul(u.level));
  u.rate = h.rate * heroRateMul(u.level);
  const p = unitPos(u, mine ? Y_MINE : Y_ENEMY);
  burst(p.x, p.y, 22, GOLD);
  floater(p.x, p.y - 44, 'Lv.' + u.level, mine ? GOLD : SEAL);
  toast((mine ? '' : '敌方 ') + u.type + ' 升到 ' + u.level + ' 阶！');
  sfx('hero');
  return up;
}
/* 打一下 + 结算经验：所有「守军打行军兵」的伤害都走这里 */
function dealFrom(u, e, d, mine){
  if (!e || e.hp <= 0) return;
  damageMarcher(e, d, mine ? 'me' : 'ai');
  if (e.hp <= 0) addHeroXp(u, e, mine);
}

/* ---------------- 武将文字池 ----------------
   整局只有一套卡：把 12 个名将的名字全部拆成单字，洗成一池（24 张）。
   同一个字在池里有几张，取决于有几个名将的名字用到它 ——
   「关」×3（关羽/关兴/关平）、「张」×3（张飞/张苞/张翼）、「黄」×3（黄忠/黄祖/黄盖），
   其余各 ×1。
   所以「羽」全池只有一张：同一时刻最多只能召出一个关羽。
   摸空不重洗 —— 字离开战场就回池（阵亡 / 遣散 / 被顶掉 / 征兵回收 / 上路换兵），
   场上站着的武将，对面就拼不出第二个同名将 —— 靠摸牌时的实时过滤，不靠落子判定。
   双方共用同一个池，谁摸到算谁的。 */
const HERO_CHAR_POOL0 = [];
for (const n in HEROES) HERO_CHAR_POOL0.push(HEROES[n].a, HEROES[n].b);
function shuffleInPlace(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (gRnd() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 从池子里摸走一张指定的字（摸不到 / 该字的名将正在场上，返回 false） */
function takePoolChar(c){
  if (fieldCharSet()[c]) return false;     // 场上有这个字的名将：不能再摸出第二个
  const i = G.charPool ? G.charPool.indexOf(c) : -1;
  if (i < 0) return false;
  G.charPool.splice(i, 1);
  return true;
}
/* 从池子里随机摸一张：preferGold = 优先摸金将的字（招贤被动） */
const GOLD_CHARS = [];
for (const n of GOLD_HEROES) GOLD_CHARS.push(HEROES[n].a, HEROES[n].b);
/* 收集「双方场上」的字：守军单字 + 名将名字里的两个字（手牌不算，还没上场） */
function fieldCharSet(){
  const used = {};
  for (const b of [G.board, G.enBoard]){
    for (const u of b){
      if (!u) continue;
      if (u.kind === 'char') used[u.char] = true;
      else if (u.kind === 'hero' && HEROES[u.type]){ used[HEROES[u.type].a] = true; used[HEROES[u.type].b] = true; }
    }
  }
  return used;
}
/* 一轮摸空 -> 没有了。整局只有一套卡（24 字，含同姓的重复字：关x3 张x3 黄x3），不再重洗。
   字离开战场（阵亡 / 遣散 / 被顶掉 / 征兵回收 / 上路换兵）就按份回池，见 returnTileChars。 */
function returnChar(c){
  if (!c) return;
  (G.charPool || (G.charPool = [])).push(c);
}
function returnTileChars(t){
  if (!t) return;
  if (t.kind === 'char') returnChar(t.char);
  else if (t.kind === 'hero' && HEROES[t.type]){ returnChar(HEROES[t.type].a); returnChar(HEROES[t.type].b); }
}
function drawPoolChar(preferGold){
  const pool = G.charPool || (G.charPool = []);
  /* 场上的字实时排除（兜底）：名将活着，他的字就摸不出来。 */
  const used = fieldCharSet();
  const avail = pool.filter(c => !used[c]);
  if (!avail.length) return null;                // 池子真的空了：这一手改发兵
  let idx = (gRnd() * avail.length) | 0;
  if (preferGold){
    const g = [];
    for (let i = 0; i < avail.length; i++) if (GOLD_CHARS.indexOf(avail[i]) >= 0) g.push(i);
    if (g.length) idx = g[(gRnd() * g.length) | 0];
  }
  if (idx < 0) idx = (gRnd() * avail.length) | 0;
  const c = avail[idx];
  pool.splice(pool.indexOf(c), 1);
  return c;
}
