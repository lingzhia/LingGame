/* ---------------- 网络 ---------------- */
/* 后台标签页里的定时器会被浏览器节流到几十秒；切回前台时立刻补一次，
   不然人看到的是「明明刚才是好的，怎么一回来就连不上」 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (NET.screen !== 'online' && NET.screen !== 'lobby') return;
  if (NET.link === 'online' || NET.link === 'connecting') return;
  clearRetry();
  netConnect();
});
/* 连不上别只留一行红字：自动退避重试几次，再给一个手动重试按钮。
   浏览器/系统偶发拒连（代理、休眠唤醒、后台标签页被节流）都靠这个兜回来。 */
const NET_RETRY = { max:5, wait:[1200, 1800, 2600, 3600, 5000] };
let retryTimer = null;
function clearRetry(){
  if (retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
}
function scheduleRetry(msg){
  clearRetry();
  if (NET.screen !== 'online' && NET.screen !== 'lobby'){ NET.status = msg; return; }
  if (NET.tries >= NET_RETRY.max){
    NET.status = msg + ' · 重试 ' + NET_RETRY.max + ' 次都没成功';
    return;
  }
  const wait = NET_RETRY.wait[Math.min(NET.tries, NET_RETRY.wait.length - 1)];
  NET.tries++;
  NET.status = msg + ' · 正在自动重试（' + NET.tries + '/' + NET_RETRY.max + '）';
  retryTimer = setTimeout(() => {
    retryTimer = null;
    if (NET.screen === 'online' || NET.screen === 'lobby') netConnect();
  }, wait);
}

function netReady(){ return !!(NET.ws && NET.ws.readyState === 1); }
function netSend(o){
  const ws = NET.ws;
  if (!ws || ws.readyState !== 1) return false;
  const out = o.t ? o : { t:'relay', data:o };    // 带 t 的是协议消息，其余是游戏内通道
  try { ws.send(JSON.stringify(out)); return true; } catch (e){ return false; }
}
function netClose(){
  NET.peer = false;
  clearRetry();
  if (NET.ws){
    NET.ws.onopen = null;
    NET.ws.onmessage = null;
    NET.ws.onerror = null;
    NET.ws.onclose = null;
    try { NET.ws.close(); } catch (e){}
  }
  NET.ws = null;
  NET.rooms = [];
}
function netAutoConnect(){
  if (NET.ws && NET.ws.readyState === 1){        // 已经连着：进来就把灯点亮，别显示「未连接」
    NET.link = 'online'; NET.status = '服务器在线'; NET.tries = 0; clearRetry(); return;
  }
  if (NET.ws && NET.ws.readyState === 0) return;
  netConnect();
}
/* 连不上时补一句人话：最常见的原因就是第二台设备填了 localhost */
function addrHint(addr){
  if (!isLoopbackAddr(addr)) return '';
  const h = location.hostname || '';
  if (!h || /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(h)) return '';
  return ' · localhost 只指你自己这台机器，要填服务器那台的 IP';
}
function connFailMsg(addr){ return '连不上 ' + addr + addrHint(addr); }
/* WS 连不上时，再探一下同一个端口的普通网页：
   网页能开 → 服务器活着，是这个浏览器把 WebSocket 拦了（代理插件/系统代理最常见）
   网页也开不了 → 地址填错了，或者不在同一个网段/被防火墙挡了
   这两件事在界面上长得一模一样，不探一下只能靠猜。 */
let httpProbeT = 0;
function probeServer(addr){
  const now = Date.now();
  if (now - httpProbeT < 2500) return;
  httpProbeT = now;
  const u = addr.replace(/^ws:/i, 'http:').replace(/^wss:/i, 'https:').replace(/\/+$/, '') + '/';
  fetch(u, { method:'GET', mode:'no-cors', cache:'no-store' })
    .then(() => { if (NET.link === 'offline')
      NET.status = '网页能开但 WebSocket 被拦了（' + addr + '）· 查浏览器代理/插件'; })
    .catch(() => { if (NET.link === 'offline')
      NET.status = '完全没响应（' + addr + '）· 查 IP 和端口、或防火墙'; });
}
function netConnect(){
  const raw = inputVal(addrInput, NET.addr);
  NET.addr = normalizeAddr(raw) || defaultAddr();
  if (addrInput && addrInput.value !== NET.addr) addrInput.value = NET.addr;
  const addr = NET.addr;
  netClose();
  NET.link = 'connecting'; NET.status = '连接中…';
  let ws;
  try { ws = new WebSocket(addr); }
  catch (e){ NET.link = 'offline'; NET.status = '服务器地址格式不对：' + addr; return; }
  NET.ws = ws;
  let opened = false;
  ws.onopen = () => {
    opened = true;
    NET.tries = 0; clearRetry();
    NET.link = 'online'; NET.status = '服务器在线';
    ws.send(JSON.stringify({ t:'list' }));
    const nr = NET.pendingRoom;
    if (nr){                                   // ?net=host|guest 直连用
      NET.pendingRoom = '';
      ws.send(JSON.stringify(NET.pendingRole === 'host'
        ? { t:'create', room:nr, pwd:'' }
        : { t:'join', room:nr, pwd:'' }));
    }
  };
  ws.onerror = () => {
    if (NET.ws !== ws || opened) return;       // 已经换了新连接 / 连上之后再报错，交给 onclose
    NET.link = 'offline';
    probeServer(addr);
    scheduleRetry(connFailMsg(addr));
  };
  ws.onclose = () => {
    if (NET.ws !== ws) return;
    NET.peer = false;
    if (!opened){ NET.link = 'offline'; probeServer(addr); scheduleRetry(connFailMsg(addr)); return; }
    NET.link = 'offline';
    if (NET.pvp){
      NET.status = '连接断开';
      if (G.phase !== 'over'){ G.phase = 'over'; G.result = 'lose'; toast('连接断开 · 本局判负'); }
    } else if (NET.screen === 'online' || NET.screen === 'lobby'){
      NET.status = '连接已断开 · 正在自动重连…';
      scheduleRetry('连接已断开');
    } else {
      NET.status = '连接已断开';       // 房间/对局中断线不自动重连，回去重进更干净
    }
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e){ return; }
    netOnMessage(m);
  };
}
function netOnMessage(m){
  if (m.t === 'rooms'){
    NET.rooms = Array.isArray(m.list) ? m.list : [];
    return;
  }
  if (m.t === 'created' || m.t === 'joined'){
    NET.waitT = 0; NET.panelMsg = ''; NET.panelBad = false;
    NET.joinNo = ''; NET.joinName = ''; NET.tmpPwd = '';    // 用掉了就清掉，别带到下一间房
    if (joinNoInput) joinNoInput.value = '';
    if (pwdInput) pwdInput.value = '';
    NET.room = m.room;
    NET.role = m.t === 'created' ? 'host' : 'guest';
    NET.peer = !!m.peer;
    NET.peerReady = false; NET.ready = false;
    enterRoom();
    return;
  }
  if (m.t === 'peer'){
    NET.peer = true; NET.peerReady = false;
    if (NET.screen === 'room') toast('对手已进入房间');
    return;
  }
  if (m.t === 'peerleft'){
    NET.peer = false; NET.peerReady = false;
    if (NET.pvp && G.phase !== 'over'){ G.phase = 'over'; G.result = 'win'; toast('对手离开 · 本局判胜'); }
    else if (NET.screen === 'room') toast('对手已离开房间');
    return;
  }
  if (m.t === 'dissolved'){
    const inRoom = NET.screen === 'room' || NET.pvp;
    NET.pvp = false; NET.peer = false; NET.peerReady = false; NET.ready = false;
    NET.room = ''; NET.role = '';
    if (inRoom){ showScreen('lobby'); toast(m.msg || '房间已解散'); }
    return;
  }
  if (m.t === 'relay'){ netOnGame(m.data); return; }
  if (m.t === 'err'){
    NET.waitT = 0;
    const msg = m.msg || '服务器拒绝';
    NET.status = msg;
    if (NET.panel){ NET.panelMsg = msg; NET.panelBad = true; }   // 浮层开着就写在浮层里
    else toast(msg);
    return;
  }
}
/* 进房间（还没开局）：先摆一张干净空盘，看得见但动不了 */
function enterRoom(){
  NET.panel = '';
  NET.pvp = false;
  newGame();
  showScreen('room');
}
/* 房主发种子，双方用同一个种子开同一张地图 */
function pvpHostStart(){
  if (NET.pvp) return;                    // 已经在打/已经开过局
  NET.seed = (Math.random() * 1e9) | 0;
  netSend({ t:'started' });               // 告诉服务器这局开打了，大厅不再挂着这间房
  netSend({ k:'start', seed:NET.seed });
  pvpStart(NET.seed, true);
}
function pvpStart(seed, isHost){
  if (NET.pvp) return;
  NET.started = true;
  NET.pvp = true;
  NET.role = isHost ? 'host' : 'guest';
  NET.seen = {};
  fixedSeed = seed >>> 0;
  showScreen('game');
  newGame();
  G.vsAI = false;              // 联机不可暂停（暂停会让两边时间线错开）
  startBattle();
  toast('联机对局开始 · 对手已就位', GOLD);
}
function netOnGame(d){
  if (!d) return;
  if (d.k === 'ready'){ NET.peerReady = true; toast('对手已准备'); return; }
  if (d.k === 'start'){ pvpStart(d.seed, false); return; }
  if (d.k === 'wave'){ netApplyWave(d.n); return; }
  if (d.k === 'again'){ gotoRoom(false); return; }   // 对面点了再来一局，一起回等候室
  if (!NET.pvp) return;
  if (d.k === 'side') netApplySide(d);
  else if (d.k === 'raid') netApplyRaid(d);
  else if (d.k === 'atk'){                                 // 对面战功满的突击队压过来了
    G.spawnLeft += Math.max(0, Math.min(12, d.n | 0));
    if (G.spawnGap <= 0) G.spawnGap = 0.30;
  }
  else if (d.k === 'over') netApplyOver(d.winner);
}
/* 对面速清提前开了一波：跟上，别让两边波号分叉（兵种是按波号算的） */
function netApplyWave(n){
  if (!NET.pvp || typeof n !== 'number') return;
  if (G.phase !== 'battle') return;
  if (n === G.wave + 1) startWave(false);
}
/* 同一间房里再来一局：不清连接、不清房间，只把对局状态推倒重来，回到等候室。
   bcast=true 表示是自己点的（要通知对面），false 表示收到了对面的通知。 */
function gotoRoom(bcast){
  if (NET.screen === 'room' && !NET.pvp) return;     // 已经回来了，别重复推倒
  if (bcast) netSend({ k:'again' });
  NET.pvp = false;
  NET.started = false;
  NET.ready = false;
  NET.peerReady = false;
  NET.seen = {};
  NET.seq = 0;
  NET.pushT = 0;
  G.result = '';
  G.phase = 'prep';
  closeInspect();
  newGame();
  showScreen('room');
  toast('准备再来一局', GOLD);
}
/* 结算后回大厅：连着的就回大厅，断了的回首页 */
function gotoLobby(){
  if (NET.ws && NET.ws.readyState === 1){
    netSend({ t:'leave' });
    NET.pvp = false; NET.started = false; NET.ready = false; NET.peerReady = false;
    NET.seen = {}; NET.role = ''; NET.room = '';
    G.result = ''; G.phase = 'prep';
    showScreen('lobby');
  } else {
    netClose();
    NET.pvp = false; NET.started = false; NET.peer = false; NET.peerReady = false;
    NET.ready = false; NET.role = ''; NET.room = ''; NET.link = 'idle';
    G.result = ''; G.phase = 'prep';
    showScreen('home');
  }
}
/* 终局裁定：命只由自己掉自己上报，所以房主手里的两个数（我的 myLife + 对面推来的 enLife）
   就是两边唯一的真相。由房主算一次、发一次，客机照办 —— 不会出现两边各判各的。 */
function netCheckOver(){
  if (!NET.pvp || NET.role !== 'host' || G.phase === 'over') return;
  const me = G.myLife, foe = G.enLife;
  if (me > 0 && foe > 0) return;
  const winner = (me <= 0 && foe <= 0) ? 'draw' : (me <= 0 ? 'guest' : 'host');
  netSend({ k:'over', winner });
  netApplyOver(winner);
}
function netApplyOver(winner){
  if (G.phase === 'over') return;
  if (winner === 'draw'){ G.phase = 'over'; G.result = 'draw'; sfx('lost'); return; }
  endGame(winner === NET.role);
}
/* 把自己这一侧的盘面推给对面（操作后立刻推一次，平时 0.4s 补一次） */
function netPushSide(){
  if (!NET.pvp || !NET.ws || NET.ws.readyState !== 1) return;
  /* 我派上路的兵（排队 + 行军）也要一起报过去 —— 否则对面右上角永远只看到
     一块空棋盘：兵拖到路上就不再属于 G.board 了，对方根本看不到我在出兵。 */
  const out = [];
  for (const m of G.marchers){
    if (m.owner !== 'me') continue;
    const col = clamp(Math.floor((m.x - BX) / CELL), 0, COLS - 1);
    const row = clamp(Math.floor((m.y - Y_MINE) / CELL), 0, ROWS - 1);
    out.push({ c: row * COLS + col, q: m.queued ? 1 : 0 });
  }
  netSend({
    k:'side',
    board: G.board,
    hand: G.hand,
    unlocked: G.unlocked,
    mantou: G.mantou,
    lives: G.myLife,
    max: G.myMax,
    out,
    pas: G.passive,      // 被动也要报：对撞伤害两端各算一遍，攻加成不一致就会分叉
  });
}
/* 收到对面盘面：镜像到自己的敌方棋盘 */
function netApplySide(d){
  if (Array.isArray(d.board)){
    const b = new Array(COLS*ROWS).fill(null);
    for (let i = 0; i < d.board.length; i++){
      const u = d.board[i];
      if (!u) continue;
      const j = mirrorCell(i);
      b[j] = u;
      /* 棋子内部的 cell/cells 还是发送方的格子编号 —— 不翻过来的话
         isAnchor(u,i) 永远不成立（8 行镜像没有一格映射回自己），
         整个敌方棋盘一格都画不出来，武将的位置也是错的。 */
      u.cell = j;
      if (Array.isArray(u.cells)) u.cells = u.cells.map(mirrorCell);
    }
    G.enBoard = b;
  }
  if (Array.isArray(d.hand)) G.ai.hand = d.hand;
  if (d.unlocked){
    const unl = {};
    for (const k in d.unlocked) unl[mirrorCell(+k)] = true;
    G.aiUnlocked = unl;
  }
  if (typeof d.mantou === 'number') G.ai.mantou = d.mantou;
  if (d.pas) G.ai.passive = d.pas;                   // 对面的被动道具（兵书攻加成等）
  if (typeof d.lives === 'number') G.enLife = d.lives;
  if (typeof d.max === 'number') G.enMax = d.max;
  G.enOut = Array.isArray(d.out) ? d.out : [];      // 对方派上路的兵（只用来画）
  refreshAiBonds();
}
/* 对手把兵派上路：在镜像格上生成一个敌方行军兵 */
function netApplyRaid(d){
  if (!d || typeof d.cell !== 'number') return;
  if (NET.seen[d.rid]) return;
  NET.seen[d.rid] = 1;
  const idx = mirrorCell(d.cell);
  const m = spawnRaider('ai', idx, d.type, d.level);
  if (m) m.queued = true;
  /* 迟到兜底：raid 在出兵口放行那一刻发出，若本端这波已经放行过
     （消息比 startWave 晚到几毫秒），这支兵会干等一整波 —— 直接放行拉平。 */
  if (m && G.qReleased) m.queued = false;
}
function screenButton(id){
  sfx('click');

  /* 首页 / 联机页 */
  if (id === 'solo'){ startSolo(); return; }
  if (id === 'online'){ showScreen('online'); return; }
  if (id === 'toHome'){ showScreen('home'); return; }
  if (id === 'records'){ REC_UI.page = 0; showScreen('records'); return; }
  if (id === 'recPrev'){ REC_UI.page--; return; }
  if (id === 'recNext'){ REC_UI.page++; return; }
  if (id.startsWith('rec:')){                 // 点一条记录 → 重新开局播这一局
    const rec = recLoad()[+id.slice(4)];

    return;
  }
  if (id === 'enterLobby'){
    if (NET.link !== 'online') { toast('先连上服务器'); return; }
    NET.listT = 0; showScreen('lobby'); return;
  }
  if (id === 'netRetry'){ NET.tries = 0; clearRetry(); NET.status = ''; netConnect(); return; }

  /* 大厅 */
  if (id === 'toOnline'){ showScreen('online'); return; }
  if (id === 'leaveLobby'){ netClose(); NET.link = 'idle'; NET.status = '已断开'; showScreen('online'); return; }
  if (id === 'refresh'){ netSend({ t:'list' }); return; }
  if (id === 'openCreate'){
    NET.panel = 'create'; NET.formPriv = false;
    NET.formRoom = ''; NET.formPwd = '';
    NET.panelMsg = ''; NET.panelBad = false; NET.waitT = 0;
    if (fRoomInput) fRoomInput.value = '';
    if (fPwdInput) fPwdInput.value = '';
    layoutKey = ''; layoutNetInputs(); return;
  }
  if (id === 'togglePriv'){ NET.formPriv = !NET.formPriv; return; }
  if (id === 'closePanel'){
    NET.panel = ''; NET.tmpPwd = ''; NET.panelMsg = ''; NET.panelBad = false; NET.waitT = 0;
    if (pwdInput) pwdInput.value = ''; return;
  }
  if (id === 'doCreate'){
    NET.formRoom = inputVal(fRoomInput, NET.formRoom);
    NET.formPwd  = inputVal(fPwdInput, NET.formPwd);
    /* 名字只填在大厅底部那个框里也算数，别让人白填一遍 */
    if (!NET.formRoom) NET.formRoom = inputVal(joinNoInput, NET.joinNo);
    const nm = NET.formRoom;
    if (!nm){ NET.panelMsg = '请先填房间号（面板上方的输入框）'; NET.panelBad = true; return; }
    if (!netReady()){ NET.panelMsg = '还没连上服务器 · 返回上一页重新连接'; NET.panelBad = true; return; }
    const sent = netSend({ t:'create', room:nm, pwd:(NET.formPwd || '').trim(), priv:NET.formPriv });
    if (!sent){ NET.panelMsg = '发送失败 · 连接已断开'; NET.panelBad = true; return; }
    NET.panelMsg = '创建中…'; NET.panelBad = false; NET.waitT = 4;
    return;
  }
  if (id === 'doJoinPwd'){
    NET.tmpPwd = inputVal(pwdInput, NET.tmpPwd);
    if (!netReady()){ NET.panelMsg = '连接已断开'; NET.panelBad = true; return; }
    netSend({ t:'join', room:NET.joinName, pwd:NET.tmpPwd });
    NET.panelMsg = '加入中…'; NET.panelBad = false; NET.waitT = 4;
    NET.panel = ''; NET.tmpPwd = ''; if (pwdInput) pwdInput.value = '';
    return;
  }
  if (id === 'joinByNo'){
    NET.joinNo = inputVal(joinNoInput, NET.joinNo);
    const nm = NET.joinNo;
    if (!nm){ toast('先填房间号'); return; }
    if (!netReady()){ toast('连接已断开'); return; }
    const rm = NET.rooms.find(r => r.name === nm);
    if (rm && rm.locked){ NET.joinName = nm; NET.panel = 'pwd'; NET.tmpPwd = '';
      NET.panelMsg = ''; NET.panelBad = false; NET.waitT = 0;
      if (pwdInput) pwdInput.value = ''; return; }
    netSend({ t:'join', room:nm, pwd:'' });
    NET.waitT = 4;
    return;
  }
  if (id.indexOf('join:') === 0){
    const nm = id.slice(5);
    const rm = NET.rooms.find(r => r.name === nm);
    if (rm && rm.locked){ NET.joinName = nm; NET.panel = 'pwd'; NET.tmpPwd = '';
      NET.panelMsg = ''; NET.panelBad = false; NET.waitT = 0;
      if (pwdInput) pwdInput.value = ''; return; }
    if (!netReady()){ toast('连接已断开'); return; }
    netSend({ t:'join', room:nm, pwd:'' });
    NET.waitT = 4;
    return;
  }

  /* 房间内 */
  if (id === 'startGame'){
    if (!NET.peer){ toast('对方还没进房间'); return; }
    if (!NET.peerReady){ toast('对方还没准备'); return; }
    pvpHostStart(); return;
  }
  if (id === 'dissolve'){ netSend({ t:'dissolve' }); return; }
  if (id === 'readyGo'){
    if (NET.ready) return;
    NET.ready = true; netSend({ k:'ready' }); toast('已准备 · 等房主开局'); return;
  }
  if (id === 'leaveRoom'){
    netSend({ t:'leave' });
    NET.room = ''; NET.role = ''; NET.peer = false; NET.peerReady = false; NET.ready = false;
    showScreen('lobby'); return;
  }
}

/* ============================================================
   输入
   ============================================================ */
function toLogical(ev){
  if (IN_HOOK) return { x:IN_HOOK.x, y:IN_HOOK.y };   // 回放：直接喂录好的逻辑坐标
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / SCALE, y: (ev.clientY - r.top) / SCALE };
}
/* 落在第几个兵营格上（不管这格现在有没有牌），没落上返回 -1 */
function handSlotAt(p){
  if (p.y < HAND_Y || p.y > HAND_Y + HAND_S) return -1;
  for (let i = 0; i < HAND_N; i++){
    const x = HAND_X0 + i*(HAND_S + HAND_GAP);
    if (p.x >= x && p.x <= x + HAND_S) return i;
  }
  return -1;
}
/* 只认有牌的那一格（要先有牌才拿得起来） */
function handIndexAt(p){
  const i = handSlotAt(p);
  return (i >= 0 && G.hand[i]) ? i : -1;
}
function boardCellAt(p, baseY){
  if (p.x < BX || p.x > BX + COLS*CELL) return -1;
  if (p.y < baseY || p.y > baseY + ROWS*CELL) return -1;
  const c = Math.floor((p.x - BX)/CELL), r = Math.floor((p.y - baseY)/CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return c + r*COLS;
}
/* 屏幕点 -> 某个视口里的第几格（缩略图 / 放大图 / 我方棋盘都走这一条） */
function boardCellAtV(p, v){
  return boardCellAt(viewWorld(v, p), v.wy0);
}
/* 点没点到路上那颗兵（按它所在视口的屏幕位置算，缩略图里给一点宽容度） */
function hitMarcher(e, p, v){
  const q = viewPt(v, e.x, e.y);
  return Math.hypot(q.x - p.x, q.y - p.y) <= Math.max(20, e.w * v.k * 0.8);
}
/* 这一颗兵现在画在哪个视口 */
function marcherView(e){
  return inFoeHalf(e.y) ? (G.enemyBig ? V_BIG : V_MINI) : V_PLAY;
}

function onDown(ev){
  ev.preventDefault();
  const p = toLogical(ev);
  uiTap = false;              // 默认当成「要记的操作」，只有纯查看/菜单分支才改成 true

  // 回放中：不接受真实操作，只认「退出回放」
  if (REPLAY.on && !REPLAY.dispatching){
    if (!REPLAY.exitBtn || inRect(p, REPLAY.exitBtn)){ sfx('click'); stopReplay(false); }
    return;
  }

  // 首页 / 联机页：只响应菜单按钮
  if (NET.screen !== 'game'){
    for (const b of UI_BTNS) if (inRect(p, b.r)){ screenButton(b.id); return; }
    return;
  }

  // 暂停中：只响应暂停面板（纯 UI，不入档）
  if (G.paused){
    uiTap = true;
    for (const b of (G._lvBtns || [])) if (inRect(p, b.r)){
      const nm = setAILevel(b.i); sfx('click'); toast('难度 · ' + nm); return;
    }
    for (const b of (G._pauseBtns || [])) if (inRect(p, b.r)){ pauseAction(b.id); return; }
    return;
  }

  G.dragger = null;

  // 暂停按钮
  if (canPause() && inRect(p, BTN_AUTO)){
    uiTap = true; sfx('click');
    const on = setAutopilot(!G.autopilot);
    toast(on ? '挂机 · 电脑接管我方（再点一下取消）' : '已取消挂机', GOLD);
    return;
  }
  if (canPause() && inRect(p, BTN_PAUSE)){ uiTap = true; setPaused(true); return; }

  if (G.phase === 'intro'){
    uiTap = true;                   // 备战前的难度/开始，属于开局前的 UI
    for (const b of (G._lvBtns || [])) if (inRect(p, b.r)){ sfx('click'); setAILevel(b.i); return; }
    if (G._startBtn && inRect(p, G._startBtn)){ sfx('click'); startBattle(); }
    return;
  }
  if (G.phase === 'over'){
    uiTap = true;
    if (G._replayBtn && inRect(p, G._replayBtn)){
      sfx('click');
      const rec = replayRecForOver();
      if (!rec){ toast(LS_OK ? '这一局没有录像 · 无法回放' : '浏览器禁用存储 · 这一局没录上', SEAL); return; }
      startReplay(rec, 'over');
      return;
    }
    if (G._againBtn && inRect(p, G._againBtn)){
      sfx('click');
      if (NET.pvp){
        if (!NET.peer){ toast('对手已经离开了'); return; }
        gotoRoom(true);                   // 同一间房里再来一局，不必重建房间
        return;
      }
      newGame(); startBattle();
      return;
    }
    if (G._backBtn && inRect(p, G._backBtn)){
      sfx('click');
      if (NET.pvp){ gotoLobby(); return; }
      showScreen('home');
      return;
    }
    if (G._exitBtn && inRect(p, G._exitBtn)){
      sfx('click');
      showScreen('home');                    // 带着结算态回首页，下次开打会重新 newGame
      return;
    }
    return;
  }
  if (G.phase === 'shop'){
    if (G._shopClose && inRect(p, G._shopClose)){ sfx('click'); closeShop(); return; }
    for (const b of (G._shopBtns || [])) if (inRect(p, b.r)){ buyItem(b.id); return; }
    return;
  }

  // 敌军放大视图（只读）：点单位看详情，点「收起」或空白处缩回去
  if (G.enemyBig){
    uiTap = true;                   // 放大视图只读：点点看、收起，都不算操作
    if (inRect(p, BTN_FOLD)){ G.enemyBig = false; closeInspect(); sfx('click'); return; }
    const ei = boardCellAtV(p, V_BIG);
    if (ei >= 0 && G.enBoard[ei]){ inspectAt('ai', G.enBoard[ei], ei); return; }
    for (const e of G.marchers){ if (inFoeHalf(e.y) && hitMarcher(e, p, V_BIG)){ inspectAt('foe', e); return; } }
    G.enemyBig = false; closeInspect(); sfx('click');
    return;
  }

  // 敌军缩略图：点一下放大；点左半的战况面板不做事（暂停按钮已在上面拦下）
  if (p.y < TOP_H){
    uiTap = true;                   // 点敌军缩略图 = 放大看，不入档
    if (p.x >= W/2){
      G.enemyBig = true; closeInspect(); sfx('click');
    }
    return;
  }

  // 征兵
  if (inRect(p, BTN_ENLIST)){ enlist(); return; }
  // 道具槽
  for (let i = 0; i < 2; i++){
    const s = SLOT[i];
    if (p.x >= s.x && p.x <= s.x+SLOT_S && p.y >= s.y && p.y <= s.y+SLOT_S){ useActive(i); return; }
  }

  // 曾经打开的详情面板：点到空白处即关闭
  const hadInspect = !!G.inspect;

  // 场上行进的兵：也能点开看（按它被画在哪个视口里算命中）
  for (const e of G.marchers){ if (hitMarcher(e, p, marcherView(e))){ uiTap = true; inspectAt('foe', e); return; } }

  // 挂机中：手牌/棋盘交给电脑，手动拖牌会和它的决策打架
  if (G.autopilot){
    uiTap = true;
    toast('挂机中 · 点「挂机」可以取消');
    return;
  }

  // 拿手牌
  const hi = handIndexAt(p);
  if (hi >= 0){
    closeInspect();
    G.dragger = { from:{ kind:'hand', i:hi }, tile:G.hand[hi], x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false };
    return;
  }
  // 拿我方的牌（名将会连带它占的另一格一起拿起）
  const mi = boardCellAtV(p, V_PLAY);
  if (mi >= 0 && G.board[mi]){
    const u = G.board[mi];
    closeInspect();
    if (u.kind === 'hero'){
      // 名将横占两格：抓到哪一格就拎起哪个字（左格 = 名字第一个字）
      const h = HEROES[u.type];
      const i0 = (u.cells && u.cells.length) ? u.cells[0] : mi;
      const ch = (mi === i0) ? h.a : h.b;
      G.dragger = {
        from:{ kind:'board', idx:mi, splitHero:true },
        tile:{ kind:'char', char:ch, level:0 },
        x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false
      };
      return;
    }
    G.dragger = {
      from:{ kind:'board', idx:u.cell !== undefined ? u.cell : mi },
      tile:{ kind: u.kind === 'char' ? 'char' : 'unit',
             type: u.type, char: u.char, level: u.level },
      x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false
    };
    return;
  }
  if (hadInspect){ uiTap = true; closeInspect(); }
}
function onMove(ev){
  if (REPLAY.on && !REPLAY.dispatching) return;
  if (G.paused || !G.dragger) return;
  ev.preventDefault();
  const p = toLogical(ev);
  G.dragger.x = p.x; G.dragger.y = p.y;
  if (Math.hypot(p.x - G.dragger.sx, p.y - G.dragger.sy) > 8) G.dragger.moved = true;
}
function onUp(ev){
  if (REPLAY.on && !REPLAY.dispatching) return;
  if (G.paused){ G.dragger = null; return; }
  const d = G.dragger;
  if (!d) return;
  G.dragger = null;
  if (G.phase !== 'battle' && G.phase !== 'prep') return;
  const p = toLogical(ev);

  // 只是点了一下（没有拖动）-> 打开兵种详情
  if (!d.moved){
    if (d.from.kind === 'hand'){
      const t = G.hand[d.from.i];
      if (t) inspectAt('hand', t);
    } else {
      const u = G.board[d.from.idx];
      if (u) inspectAt('my', u, d.from.idx);
    }
    return;
  }

  // 名将拆字：拖动即解除，先还原成两个单字，拖走的那个字继续按普通单字落地
  if (d.from.kind === 'board' && d.from.splitHero){
    const nm = splitHero(d.from.idx);
    if (nm) toast('拆字 · ' + nm + ' 解除，' + d.tile.char + ' 可以单独挪走');
    refreshBonds();
  }

  const mi = boardCellAtV(p, V_PLAY);
  const hslot = handSlotAt(p);

  if (mi >= 0){
    const src = { kind:d.tile.kind, type:d.tile.type, char:d.tile.char, level:d.tile.level };
    if (d.from.kind === 'board') src.__fromBoard = d.from.idx;
    // 手牌先腾出这一格再落子：换位时对方那张牌才有地方收。
    // 以前是落完再清格，兵营看着是满的，换出来的牌会被「遣散」白扔。
    const handBack = (d.from.kind === 'hand') ? G.hand[d.from.i] : null;
    if (d.from.kind === 'hand') G.hand[d.from.i] = null;
    const res = dropOnCell(src, mi);      // 来源格的清理已由 dropOnCell 负责
    if ((res === 'fail' || res === 'shovel-no') && handBack) G.hand[d.from.i] = handBack;
    // 拆字后没落成（点到了放不下的地方）：两个字还挨着，自动并回原来的名将
    if (res === 'fail' && d.from.splitHero) autoFormHeroes(G.board, true);
    // 手牌只要真落到了棋盘上就用掉这一张（落子前已清格；失败在上面原样放回）
    return;
  }

  // ---- 拖到兵营的五个格子上（空格也能放）----
  if (hslot >= 0){
    if (d.from.kind === 'hand'){
      if (hslot === d.from.i) return;                    // 原地放下，什么都不做
      const srcT = G.hand[d.from.i], dstT = G.hand[hslot];
      // 手牌之间也能合成／升阶：同种同阶升一阶、两张单字拼名将（异字合成已关）
      const comb = (srcT && dstT && srcT.kind !== 'shovel' && dstT.kind !== 'shovel')
        ? tryCombine(d.tile, dstT) : null;
      if (!comb && srcT && dstT && srcT.kind === 'unit' && dstT.kind === 'unit')
        toast('合不了 · 只能同种同阶相叠（1+1 → 2 阶）');
      if (comb){
        G.hand[hslot] = comb;                            // 合成结果留在这一格
        G.hand[d.from.i] = null;                         // 源格空出来
        const x = HAND_X0 + hslot*(HAND_S + HAND_GAP) + HAND_S/2;
        burst(x, HAND_Y + HAND_S/2, 16, comb.kind === 'hero' ? GOLD : SEAL);
        floater(x, HAND_Y - 2, comb.kind === 'hero' ? (comb.type + '！') : (comb.level + ' 阶'),
                comb.kind === 'hero' ? GOLD : TIER[comb.level].tc);
        toast(comb.kind === 'hero' ? ('兵营召将 · ' + comb.type + '「' + HEROES[comb.type].sk + '」')
                                   : ('兵营合成 · ' + tileLabel(comb) + ' ' + comb.level + ' 阶'));
        sfx(comb.kind === 'hero' ? 'hero' : 'merge');
        return;
      }
      const t = dstT;                                    // 合不了就对调
      G.hand[hslot] = G.hand[d.from.i];
      G.hand[d.from.i] = t;
      sfx('click');
      return;
    }
    // 棋盘 -> 兵营格：和这一格里的牌对调；空格则直接挪进来，原格腾空
    const back = G.hand[hslot];
    if (back && back.kind === 'hero'){
      const span = findHeroSpan(d.from.idx, G.board, true, [d.from.idx]);
      if (!span){ toast('名将横占两格 · 兵营这一格放不下'); sfx('hit'); return; }
      clearCells(G.board, d.from.idx);
      const nu = newUnit(back.type, back.level, span[0], span);
      nu.born = 0;
      for (const i of span) G.board[i] = nu;
      G.hand[hslot] = d.tile;
    } else {
      clearCells(G.board, d.from.idx);
      if (back){ const nu = toUnitObject(back, d.from.idx); if (nu) G.board[d.from.idx] = nu; }
      G.hand[hslot] = d.tile;
    }
    refreshBonds(); autoFormHeroes(G.board, true); ensureMyBuffs();
    sfx('click');
    return;
  }

  // 拖回兵营区域（没对准具体某一格）-> 从棋盘收回（名将整组收回）
  if (d.from.kind === 'board' && p.y > HAND_Y - 50 && p.y < HAND_Y + HAND_S + 50){
    if (handAdd(d.tile)){
      clearCells(G.board, d.from.idx);
      refreshBonds(); autoFormHeroes(G.board, true); ensureMyBuffs();
      sfx('click');
    } else {
      toast('兵营已满 · 收不回来');
    }
  }
}

function bindInput(){
  /* 输入录制：只记「一次操作」 = 按下的点 → 松手的点。
     中间那些 pointermove 全是过程噪声（一次拖拽几十条），既不进存档也不影响结果，
     回放时把这两点喂回去，起手 / 落点一致，结局就一致。 */
  let pressAt = null;
  cv.addEventListener('pointerdown', ev => {
    if (!REPLAY.on) pressAt = toLogical(ev);
    onDown(ev);
  }, { passive:false });
  cv.addEventListener('pointermove', ev => { onMove(ev); }, { passive:false });
  cv.addEventListener('pointerup', ev => {
    if (!REPLAY.on && pressAt && !uiTap) recAction(pressAt, toLogical(ev));
    pressAt = null; uiTap = false;
    onUp(ev);
  }, { passive:false });
  cv.addEventListener('pointercancel', () => { pressAt = null; G.dragger = null; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  // 键盘：空格 / P / Esc 暂停或继续，M 静音
  window.addEventListener('keydown', e => {
    const ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT') return;      // 正在填服务器地址/房间号
    const k = e.key;
    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P' || k === 'Escape'){
      e.preventDefault();
      if (G.paused) pauseAction('resume');
      else if (canPause()) setPaused(true);
      return;
    }
    if (k === 'm' || k === 'M'){ muted = !muted; }
  });
}

/* ============================================================
   对局录制 / 回放
   一局 = 种子 + 输入事件（按下 / 移动 / 抬起，按逻辑步编号记录）。
   逻辑是确定性的（固定 1/60 步长 + 种子随机），所以把这些输入重放一遍，
   整局就能原样重演 —— 不需要存画面，也不需要存每一步的盘面。
   ============================================================ */
const REC_KEY = 'wt_record_v1';
/* 自动清理：条数或总体积先到线，就从最旧的开始丢（判定见 recSave）。
   浏览器 localStorage 一般只有 5MB，留 2MB 给录像比较安全。 */
const REC_MAX = 20;
const REC_MAX_BYTES = 2 * 1024 * 1024;
/* 存储：localStorage 能用就落盘；被禁用（iframe 沙箱 / 隐私设置）时退到内存，
   当前这个页面里照样能录、能回放，只是刷新即失 —— 不能因为存储不可用就把录制整个关掉。 */
const HAS_LS = (() => { try { localStorage.getItem(REC_KEY); return true; } catch(e){ return false; } })();
let LS_OK = HAS_LS;
const REC_MEM = [];                        // 会话内存储（localStorage 不可用时的兜底）
const REC = { on:false, seed:0, aiLevel:0, events:[], auto:[], start:0 };   // auto = 挂机开关时间线 [[步, 0|1]]
let LAST_REC = null;                       // 刚结束的那一局（结算页「回放本局」用）
const REPLAY = { on:false, ev:[], i:0, speed:2, limit:0, rec:null, dispatching:false, exitBtn:null, back:'over', prevG:null, auto:[], ai:0 };
let IN_HOOK = null;                        // 回放时把录好的坐标直接喂进输入层

function recBegin(){
  if (NET.pvp || REPLAY.on){ REC.on = false; return; }
  REC.on = true; REC.seed = G.seed; REC.aiLevel = AI_LV; REC.events = []; REC.start = Date.now();
  REC.auto = [[0, G.autopilot ? 1 : 0]];      // 开局是不是挂机，回放要从第 0 步就摆正
  SIM.n = 0; SIM.acc = 0;                  // 事件按「开战后的第几步」编号
}
/* 这一下点击是不是纯「看」的动作（放大敌军、看详情、暂停/菜单）：
   只影响画面，不影响模拟，录进去除了让记录变胖、还可能让回放出岔子（比如回放里被自己按下暂停），
   所以在 onDown 里打标，pointerup 时直接不入档。 */
let uiTap = false;
/* 一条操作 = 按下的点 → 松手的点（逻辑坐标，整数，与窗口大小无关） */
function recAction(from, to){
  if (!REC.on) return;
  REC.events.push([SIM.n, Math.round(from.x), Math.round(from.y),
                   Math.round(to.x), Math.round(to.y)]);
}
/* 旧格式（逐帧指针轨迹 [tick, 'down'|'move'|'up', x, y]）→ 新格式（一次操作一条）。
   只取每对 down/up 的起点与终点，move 全部丢弃。 */
function recUpgrade(evs){
  if (!evs || !evs.length) return [];
  if (typeof evs[0][1] === 'number') return evs;      // 已是新格式
  const out = [];
  let press = null;
  for (const e of evs){
    if (e[1] === 'down') press = e;
    else if (e[1] === 'up' && press){
      out.push([e[0], press[2], press[3], e[2], e[3]]);
      press = null;
    }
  }
  return out;
}
function recLoad(){
  if (LS_OK){
    try {
      const s = localStorage.getItem(REC_KEY);
      return s ? (JSON.parse(s) || []) : [];
    } catch(e){ LS_OK = false; }             // 读不了 → 之后一律走内存
  }
  return REC_MEM.slice();
}
/* 落盘（或落内存）。返回 false 表示这次没写进去，调用方继续缩小 keep 重试。 */
function recStore(str, arr){
  REC_MEM.length = 0;
  for (const r of arr) REC_MEM.push(r);
  if (!LS_OK) return true;                  // 内存已收下，够用了
  try { localStorage.setItem(REC_KEY, str); return true; }
  catch(e){ return false; }                 // 配额满：不算禁用，只是这一份太大
}
/* 存一局，顺手做自动清理：
   1) 条数超过 REC_MAX、或总量超过 REC_MAX_BYTES → 从最旧的开始丢
   2) 写不进去（配额满）→ 再丢一局重试，直到能写或一局不剩
   旧录像优先被牺牲，最近的几局总会保住。 */
function recSave(rec){
  const arr = recLoad();
  arr.push(rec);
  let keep = Math.min(arr.length, REC_MAX);        // 先按条数砍
  while (keep > 0){
    const cand = arr.slice(arr.length - keep);
    const str = JSON.stringify(cand);
    if (str.length <= REC_MAX_BYTES && recStore(str, cand)) return;
    keep--;
  }
  recStore('[]', []);                              // 一局都不留也存不下：清空
}
/* 记录列表：新的在前 */
function recAll(){
  const arr = recLoad();
  return arr.map((r, i) => ({ r, i })).reverse();
}
function recBytes(list){
  let n = 0;
  for (const it of list) { try { n += JSON.stringify(it.r).length; } catch(e){} }
  return n;
}
/* 自动落盘：页面是服务器发的（http/https），打完就把录像 POST 回去，
   服务器写进项目 records/web/。浏览器存储清掉、换浏览器，档案都还在。
   file:// 打开时没有服务器可发，退回只在浏览器里存（不影响游戏）。 */
let SRV_SAVE = 'idle';                    // idle | ok | off | fail
function recUpload(rec){
  if (typeof fetch !== 'function' || typeof location === 'undefined' ||
      !/^https?:$/.test(location.protocol || '')){ SRV_SAVE = 'off'; return; }
  try {
    fetch('/api/record', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(rec), keepalive:true,
    }).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(() => { SRV_SAVE = 'ok'; })
      .catch(() => { SRV_SAVE = 'fail'; });
  } catch(e){ SRV_SAVE = 'fail'; }
}
function recFinish(){
  if (!REC.on) return;
  REC.on = false;
  // 一步没动过、也没挂过机 → 没内容，不留记录（挂机局只有 auto 时间线，同样要留）
  const hadAuto = REC.auto.some(a => a[1]);
  if (!REC.events.length && !hadAuto) return;
  LAST_REC = { v:2, ts:Date.now(), mode:'solo', seed:REC.seed, aiLevel:REC.aiLevel, result:G.result,
               time:+G.time.toFixed(1), wave:G.wave, events:REC.events, auto:REC.auto };
  recSave(LAST_REC);
  recUpload(LAST_REC);                     // 顺手往服务器存一份（能存才存）
}
/* 结算页要回放的那一局：优先「刚打完的」；
   万一进程内的 LAST_REC 丢了（刷新过页面 / 中途异常），就按种子从存档里找同一局。 */
function replayRecForOver(){
  const usable = r => !!(r && ((r.events && r.events.length) || (r.auto && r.auto.some(a => a[1]))));
  if (usable(LAST_REC)) return LAST_REC;
  const seed = G.seed >>> 0;
  const all = recLoad();
  for (let i = all.length - 1; i >= 0; i--){
    const r = all[i];
    if (r && (r.seed >>> 0) === seed && usable(r)) return r;
  }
  return null;
}
/* 回放：同种子重新开局，在录下来的那一步喂回同样的输入，2 倍速播完
   back：播完 / 退出后回到哪 —— 'over'（结算页，默认）| 'records'（对局记录页） */
function startReplay(rec, back){
  const hasAuto = !!(rec && rec.auto && rec.auto.some(a => a[1]));
  if (!rec || (!hasAuto && !(rec.events && rec.events.length))){ toast('这一局没有可回放的操作'); return; }
  if (!rec.events) rec.events = [];        // 纯挂机局：没有指针操作，只有开关时间线
  REPLAY.back = back || 'over';
  REPLAY.rec = rec; REPLAY.ev = recUpgrade(rec.events); REPLAY.i = 0;
  REPLAY.speed = 2; REPLAY.dispatching = false;
  REPLAY.auto = Array.isArray(rec.auto) ? rec.auto : []; REPLAY.ai = 0;   // 旧录像没有 auto：全程按手动播
  /* 从结算页点进来的：先把那一局的终局状态收好。
     回放会 newGame 覆盖 G，退出时得把结算画面原样还回去，而不是甩给玩家一个空的新局。 */
  REPLAY.prevG = (REPLAY.back === 'over' && G.phase === 'over') ? G : null;   // 只收「结算画面」
  const lastTick = REPLAY.ev.length ? REPLAY.ev[REPLAY.ev.length - 1][0] : 0;
  REPLAY.limit = lastTick + 60 * 120;      // 保险：最多再跑 2 分钟
  try {
    newGame(rec.seed >>> 0);
    setAILevel(rec.aiLevel | 0);
    G.autopilot = false;                     // 交给 REPLAY.auto 时间线摆正
    SIM.n = 0; SIM.acc = 0;
    startBattle();                         // 录制也是从「备战」这一秒开始
  } catch(e){                              // 启动失败必须说出口，不能停在原地像没点一样
    REPLAY.on = false; REPLAY.ev = []; REPLAY.i = 0;
    console.error(e);
    toast('回放启动失败 · ' + e.message, SEAL);
    return;
  }
  REPLAY.on = true;
  toast('回放本局 · ' + REPLAY.speed + ' 倍速', GOLD);
}
function replayDispatch(type, x, y){
  REPLAY.dispatching = true;
  IN_HOOK = { x, y };
  const ev = { preventDefault(){}, clientX:0, clientY:0, pointerId:1, button:0, target:cv };
  try {
    if (type === 'down') onDown(ev);
    else if (type === 'move') onMove(ev);
    else onUp(ev);
  } finally { IN_HOOK = null; REPLAY.dispatching = false; }
}
function replayAction(x0, y0, x1, y1){
  replayDispatch('down', x0, y0);
  if (x0 !== x1 || y0 !== y1) replayDispatch('move', x1, y1);   // 真的拖过才补这一下
  replayDispatch('up', x1, y1);
}
function replayPump(){
  if (!REPLAY.on) return;
  // 挂机开关按录制时的步号还原（挂机是内部决策，没有指针事件可录）
  while (REPLAY.ai < REPLAY.auto.length && REPLAY.auto[REPLAY.ai][0] <= SIM.n){
    G.autopilot = !!REPLAY.auto[REPLAY.ai++][1];
  }
  while (REPLAY.i < REPLAY.ev.length && REPLAY.ev[REPLAY.i][0] <= SIM.n){
    const a = REPLAY.ev[REPLAY.i++];
    replayAction(a[1], a[2], a[3], a[4]);
  }
  if (G.phase === 'over' || SIM.n > REPLAY.limit) stopReplay(true);
}
function stopReplay(finished){
  REPLAY.on = false; REPLAY.dispatching = false; IN_HOOK = null; REPLAY.exitBtn = null;
  G.paused = false;
  const back = REPLAY.back || 'over';
  REPLAY.back = 'over';
  const prevG = REPLAY.prevG;
  REPLAY.prevG = null;
  if (back === 'records'){                 // 从记录页点进来的，播完/退出都回记录页
    if (!G.result) G.result = 'lose';
    showScreen('records');
    return;
  }
  if (prevG){                              // 结算页点进来的：把那一局的结算画面还回去
    G = prevG;
    G.paused = false;
    if (!G.result) G.result = 'lose';
    G.phase = 'over';
    return;
  }
  if (finished){
    if (!G.result) G.result = 'lose';      // 录到一半的局：按当前局面收尾
    G.phase = 'over';
    return;
  }
  toast('已退出回放 · 开新的一局');
  newGame(); startBattle();
}

/* ============================================================
   主循环
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  SCALE = Math.min(ww / W, wh / H);
  cv.width = Math.round(W * SCALE * DPR);
  cv.height = Math.round(H * SCALE * DPR);
  cv.style.width = (W * SCALE) + 'px';
  cv.style.height = (H * SCALE) + 'px';
  layoutNetInputs();
  ctx.setTransform(SCALE*DPR, 0, 0, SCALE*DPR, 0, 0);
}

let last = 0;
/* 掉帧不能让游戏时间变慢：积攒真实经过的时间，按固定步长补齐（见 simAdvance）。
   联机是各跑各的模拟，两端帧率不一样，靠这个保证时间轴不漂。 */
/* 逻辑固定 1/60 秒一步：一帧可能走 0、1、2 步，但步长永远一样。
   这是「回放能一模一样」的前提 —— 同样的步数 + 同样的输入 = 同样的局面。
   渲染仍然是逐帧的，画面不受影响。 */
const SIM_STEP = 1/60;
const SIM = { n:0, acc:0 };
function simAdvance(dtReal){
  SIM.acc += dtReal;
  let guard = 0;
  replayPump();                          // 回放：先补「第 n 步结束后」发生的输入
  while (SIM.acc >= SIM_STEP - 1e-9 && guard++ < 240){
    step(SIM_STEP);
    SIM.n++;
    SIM.acc -= SIM_STEP;
    replayPump();                        // 记录按「第几步之后」编号，这里对齐
  }
  if (guard >= 240) SIM.acc = 0;      // 落后太多（切后台回来）：丢掉，不追
}
/* 页面切到后台时浏览器会把 requestAnimationFrame 掐掉（或压到 1fps）。
   联机对局不能因此停摆，所以不可见时改用 setTimeout 接着驱动。 */
let bgTimer = null, rafPending = false;
function nextFrame(){
  if (document.visibilityState === 'visible'){
    if (rafPending) return;                  // 已经排了一帧，别重复驱动
    rafPending = true;
    requestAnimationFrame(ts => { rafPending = false; loop(ts); });
  } else if (!bgTimer){
    bgTimer = setTimeout(() => { bgTimer = null; loop(performance.now()); }, 400);
  }
}
/* 回到前台：把驱动交回 rAF（后台那段是 setTimeout 顶着的，时间没丢） */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!bgTimer) return;                      // 一直是 rAF 在跑，不用管
  clearTimeout(bgTimer); bgTimer = null;
  last = performance.now();                  // 别拿旧时间戳算 dt
  nextFrame();
});
function loop(ts){
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 2) dt = 2;                      // 离开很久（切回来）：最多补 2 秒
  if (NET.screen !== 'game'){
    if (G.toastT > 0) G.toastT -= dt;                       // 菜单屏的提示也要淡出
    if (NET.waitT > 0){                                     // 建/加房间等回包，超时就明说
      NET.waitT -= dt;
      if (NET.waitT <= 0 && NET.screen === 'lobby' && NET.panel){
        NET.panelMsg = '服务器没有回应 · 请确认服务器是当前版本（重启 node server.js）';
        NET.panelBad = true;
      }
    }
    if (NET.screen === 'lobby' && NET.link === 'online'){   // 大厅：每 2 秒刷新一次房间列表
      NET.listT -= dt;
      if (NET.listT <= 0){ NET.listT = 2; netSend({ t:'list' }); }
    }
    layoutNetInputs();
    draw(); nextFrame(); return;
  }
  if (G.paused){ draw(); nextFrame(); return; }   // 暂停：全局冻结，只重绘
  G.t += dt;
  simAdvance(REPLAY.on ? dt * REPLAY.speed : dt);  // 回放按倍速喂同样的逻辑步
  if (NET.pvp){ NET.pushT -= dt; if (NET.pushT <= 0){ NET.pushT = 0.4; netPushSide(); } netCheckOver(); }
  if (G.toastT > 0) G.toastT -= dt;
  if (G.aduShield > 0) G.aduShield -= dt;
  if (G.aduHurtM > 0) G.aduHurtM -= dt;
  if (G.aduHurtE > 0) G.aduHurtE -= dt;
  draw();
  nextFrame();
}

function boot(){
  // 想复现某一张地图：在地址后面加 ?seed=12345
  const m = /[?&]seed=(\d+)/.exec(location.search || '');
  if (m) fixedSeed = (parseInt(m[1], 10) >>> 0);
  newGame();
  makeNetInputs();
  if (m){ NET.screen = 'game'; NET.started = true; }   // ?seed= 直接进对局（调地图用）
  // 一键联机（测试/分享用）：?net=host&room=abc&addr=ws://1.2.3.4:8787
  //                         ?net=guest&room=abc&addr=ws://1.2.3.4:8787
  const nr = /[?&]net=(host|guest)/.exec(location.search || '');
  if (nr){
    const rm = /[?&]room=([^&]+)/.exec(location.search || '');
    const ad = /[?&]addr=([^&]+)/.exec(location.search || '');
    if (ad) NET.addr = decodeURIComponent(ad[1]);
    NET.pendingRole = nr[1];
    NET.pendingRoom = rm ? decodeURIComponent(rm[1]) : 'default';
    NET.screen = 'online';
    NET.pvp = false;
    if (addrInput) addrInput.value = NET.addr;
    netConnect();
  }
  resize();
  window.addEventListener('resize', resize);
  bindInput();
  requestAnimationFrame(loop);
}

/* ============================================================
   Headless 数据快照：整个战局的结构化 JSON。
   画面只是这些数据的呈现 —— agent 读它 = 看画面，操作数据 = 操作游戏。
   每格三要素：坐标 (c,r,idx) / 状态 land|path|adu / 对象 unit。
   ============================================================ */
function tileOut(t){
  if (!t) return null;
  if (t.kind === 'shovel') return { kind:'shovel' };
  if (t.kind === 'char')   return { kind:'char', char:t.char };
  return { kind:t.kind, type:t.type, level:t.level };
}
function unitOut(u){
  if (!u) return null;
  const o = { kind:u.kind, type:u.type, char:u.char, level:u.level,
              hp:u.hp, maxHp:u.maxHp, atk:u.atk, rate:u.rate, range:u.range,
              cells:u.cells ? u.cells.slice() : undefined };
  if (u.kind === 'hero'){ o.rank = u.rank; o.xp = u.xp; o.skill = u.skill; }
  if (u.vs && u.vs.length) o.vs = u.vs;
  return o;
}
function boardOut(board, mine){
  const out = [];
  for (let i = 0; i < COLS*ROWS; i++){
    const st = isAduCell(i, mine) ? 'adu' : (isPathCell(i, mine) ? 'path' : 'land');
    const canPlace = st === 'land' && !board[i] && (mine ? !!G.unlocked[i] : aiLandOK(i));
    out.push({ c:colOf(i), r:rowOf(i), idx:i, state:st, canPlace, unit:unitOut(board[i]) });
  }
  return out;
}
function snapshotData(){
  /* 过一遍 JSON：把 undefined 抹成「没有这个键」。
     否则浏览器里是 null、Node 里是 undefined，同一局面互相比对会出现假差异。 */
  return JSON.parse(JSON.stringify({
    seed:G.seed, phase:G.phase, paused:!!G.paused, pvp:!!NET.pvp, autopilot:!!G.autopilot,
    time:+G.time.toFixed(2), wave:G.wave,
    nextWaveIn:+Math.max(0, WAVE_GAP - G.waveT).toFixed(2),
    prepT:(G.phase === 'prep') ? +G.prepT.toFixed(2) : undefined,
    me:{ mantou:G.mantou, enlistCost:G.enlistCost, life:G.myLife, maxLife:G.myMax,
         merit:G.merit, meritNeed:G.meritNeed, kills:G.kills, leaks:G.leaks,
         unlocked:Object.keys(G.unlocked).length,
         hand:G.hand.map(tileOut), actives:G.actives.slice(),
         passive:Object.assign({}, G.passive) },
    ai:{ mantou:G.ai.mantou, life:G.enLife, maxLife:G.enMax,
         merit:G.ai.merit, meritNeed:G.ai.meritNeed, kills:G.ai.kills, leaks:G.aiLeaks,
         hand:G.ai.hand.map(tileOut) },
    myBoard:boardOut(G.board, true),      // 我方半场：c/r 按我方视角（和画面一致）
    aiBoard:boardOut(G.enBoard, false),   // 敌方半场：c/r 按敌方视角（画面上是对面镜像）
    marchers:G.marchers.map(m => ({
      owner:m.owner, key:m.key, name:m.name, level:m.level, elite:m.elite,
      hp:m.hp, maxHp:m.maxHp, atk:+m.atk.toFixed(1),
      x:Math.round(m.x), y:Math.round(m.y),
      ri:m.ri, routeLen:m.route ? m.route.length : 0, queued:!!m.queued,
    })),
    shop:{ open:G.shopOpen || G.phase === 'shop', stock:G.shopStock.slice(), bought:G.shopBought },
    result:G.result,
  }));
}

  aiTick, aiEnlist, aiPlace, sendAttack, pickHeroChar, pickHeroCharAI, rollTile, aiRollTile, sendCharToRoad, sendTileToRoad, freeRoadSlots, enlistSide, moneyOf, addMoney,

         // 地图每局重掷，这里用 getter 保证读到的是当前这张
         get PATH_M(){ return PATH_M; }, get PATH_E(){ return PATH_E; },
