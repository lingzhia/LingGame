/* ============================================================
   输入
   ============================================================ */
function toLogical(ev){
  if (IN_HOOK) return { x:IN_HOOK.x, y:IN_HOOK.y };   // 回放：直接喂录好的逻辑坐标
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / SCALE, y: (ev.clientY - r.top) / SCALE };
}
/* 落在第几个兵营格上（不管这格现在有没有牌），没落上返回 -1 */
function handSlotAt(p){
  if (p.y < HAND_Y || p.y > HAND_Y + HAND_S) return -1;
  for (let i = 0; i < HAND_N; i++){
    const x = HAND_X0 + i*(HAND_S + HAND_GAP);
    if (p.x >= x && p.x <= x + HAND_S) return i;
  }
  return -1;
}
/* 只认有牌的那一格（要先有牌才拿得起来） */
function handIndexAt(p){
  const i = handSlotAt(p);
  return (i >= 0 && G.hand[i]) ? i : -1;
}
function boardCellAt(p, baseY){
  if (p.x < BX || p.x > BX + COLS*CELL) return -1;
  if (p.y < baseY || p.y > baseY + ROWS*CELL) return -1;
  const c = Math.floor((p.x - BX)/CELL), r = Math.floor((p.y - baseY)/CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return c + r*COLS;
}
/* 屏幕点 -> 某个视口里的第几格（缩略图 / 放大图 / 我方棋盘都走这一条） */
function boardCellAtV(p, v){
  return boardCellAt(viewWorld(v, p), v.wy0);
}
/* 点没点到路上那颗兵（按它所在视口的屏幕位置算，缩略图里给一点宽容度） */
function hitMarcher(e, p, v){
  const q = viewPt(v, e.x, e.y);
  return Math.hypot(q.x - p.x, q.y - p.y) <= Math.max(20, e.w * v.k * 0.8);
}
/* 这一颗兵现在画在哪个视口 */
function marcherView(e){
  return inFoeHalf(e.y) ? (G.enemyBig ? V_BIG : V_MINI) : V_PLAY;
}

function onDown(ev){
  ev.preventDefault();
  const p = toLogical(ev);

  // 回放中：不接受真实操作，只认「退出回放」
  if (REPLAY.on && !REPLAY.dispatching){
    if (REPLAY.exitBtn && inRect(p, REPLAY.exitBtn)){ sfx('click'); stopReplay(false); }
    return;
  }

  // 首页 / 联机页：只响应菜单按钮
  if (NET.screen !== 'game'){
    for (const b of UI_BTNS) if (inRect(p, b.r)){ screenButton(b.id); return; }
    return;
  }

  // 暂停中：只响应暂停面板
  if (G.paused){
    for (const b of (G._lvBtns || [])) if (inRect(p, b.r)){
      const nm = setAILevel(b.i); sfx('click'); toast('难度 · ' + nm); return;
    }
    for (const b of (G._pauseBtns || [])) if (inRect(p, b.r)){ pauseAction(b.id); return; }
    return;
  }

  G.dragger = null;

  // 暂停按钮
  if (canPause() && inRect(p, BTN_PAUSE)){ setPaused(true); return; }

  if (G.phase === 'intro'){
    for (const b of (G._lvBtns || [])) if (inRect(p, b.r)){ sfx('click'); setAILevel(b.i); return; }
    if (G._startBtn && inRect(p, G._startBtn)){ sfx('click'); startBattle(); }
    return;
  }
  if (G.phase === 'over'){
    if (G._replayBtn && inRect(p, G._replayBtn)){
      sfx('click');
      startReplay(LAST_REC);
      return;
    }
    if (G._againBtn && inRect(p, G._againBtn)){
      sfx('click');
      if (NET.pvp){
        if (!NET.peer){ toast('对手已经离开了'); return; }
        gotoRoom(true);                   // 同一间房里再来一局，不必重建房间
        return;
      }
      newGame(); startBattle();
      return;
    }
    if (G._backBtn && inRect(p, G._backBtn)){
      sfx('click');
      if (NET.pvp){ gotoLobby(); return; }
      newGame(); startBattle();
    }
    return;
  }
  if (G.phase === 'shop'){
    if (G._shopClose && inRect(p, G._shopClose)){ sfx('click'); closeShop(); return; }
    for (const b of (G._shopBtns || [])) if (inRect(p, b.r)){ buyItem(b.id); return; }
    return;
  }

  // 敌军放大视图（只读）：点单位看详情，点「收起」或空白处缩回去
  if (G.enemyBig){
    if (inRect(p, BTN_FOLD)){ G.enemyBig = false; closeInspect(); sfx('click'); return; }
    const ei = boardCellAtV(p, V_BIG);
    if (ei >= 0 && G.enBoard[ei]){ inspectAt('ai', G.enBoard[ei], ei); return; }
    for (const e of G.marchers){ if (inFoeHalf(e.y) && hitMarcher(e, p, V_BIG)){ inspectAt('foe', e); return; } }
    G.enemyBig = false; closeInspect(); sfx('click');
    return;
  }

  // 敌军缩略图：点一下放大；点左半的战况面板不做事（暂停按钮已在上面拦下）
  if (p.y < TOP_H){
    if (p.x >= W/2){
      G.enemyBig = true; closeInspect(); sfx('click');
    }
    return;
  }

  // 征兵
  if (inRect(p, BTN_ENLIST)){ enlist(); return; }
  // 道具槽
  for (let i = 0; i < 2; i++){
    const s = SLOT[i];
    if (p.x >= s.x && p.x <= s.x+SLOT_S && p.y >= s.y && p.y <= s.y+SLOT_S){ useActive(i); return; }
  }

  // 曾经打开的详情面板：点到空白处即关闭
  const hadInspect = !!G.inspect;

  // 场上行进的兵：也能点开看（按它被画在哪个视口里算命中）
  for (const e of G.marchers){ if (hitMarcher(e, p, marcherView(e))){ inspectAt('foe', e); return; } }

  // 拿手牌
  const hi = handIndexAt(p);
  if (hi >= 0){
    closeInspect();
    G.dragger = { from:{ kind:'hand', i:hi }, tile:G.hand[hi], x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false };
    return;
  }
  // 拿我方的牌（名将会连带它占的另一格一起拿起）
  const mi = boardCellAtV(p, V_PLAY);
  if (mi >= 0 && G.board[mi]){
    const u = G.board[mi];
    closeInspect();
    if (u.kind === 'hero'){
      // 名将横占两格：抓到哪一格就拎起哪个字（左格 = 名字第一个字）
      const h = HEROES[u.type];
      const i0 = (u.cells && u.cells.length) ? u.cells[0] : mi;
      const ch = (mi === i0) ? h.a : h.b;
      G.dragger = {
        from:{ kind:'board', idx:mi, splitHero:true },
        tile:{ kind:'char', char:ch, level:0 },
        x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false
      };
      return;
    }
    G.dragger = {
      from:{ kind:'board', idx:u.cell !== undefined ? u.cell : mi },
      tile:{ kind: u.kind === 'char' ? 'char' : 'unit',
             type: u.type, char: u.char, level: u.level },
      x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false
    };
    return;
  }
  if (hadInspect) closeInspect();
}
function onMove(ev){
  if (REPLAY.on && !REPLAY.dispatching) return;
  if (G.paused || !G.dragger) return;
  ev.preventDefault();
  const p = toLogical(ev);
  G.dragger.x = p.x; G.dragger.y = p.y;
  if (Math.hypot(p.x - G.dragger.sx, p.y - G.dragger.sy) > 8) G.dragger.moved = true;
}
function onUp(ev){
  if (REPLAY.on && !REPLAY.dispatching) return;
  if (G.paused){ G.dragger = null; return; }
  const d = G.dragger;
  if (!d) return;
  G.dragger = null;
  if (G.phase !== 'battle' && G.phase !== 'prep') return;
  const p = toLogical(ev);

  // 只是点了一下（没有拖动）-> 打开兵种详情
  if (!d.moved){
    if (d.from.kind === 'hand'){
      const t = G.hand[d.from.i];
      if (t) inspectAt('hand', t);
    } else {
      const u = G.board[d.from.idx];
      if (u) inspectAt('my', u, d.from.idx);
    }
    return;
  }

  // 名将拆字：拖动即解除，先还原成两个单字，拖走的那个字继续按普通单字落地
  if (d.from.kind === 'board' && d.from.splitHero){
    const nm = splitHero(d.from.idx);
    if (nm) toast('拆字 · ' + nm + ' 解除，' + d.tile.char + ' 可以单独挪走');
    refreshBonds();
  }

  const mi = boardCellAtV(p, V_PLAY);
  const hslot = handSlotAt(p);

  if (mi >= 0){
    const src = { kind:d.tile.kind, type:d.tile.type, char:d.tile.char, level:d.tile.level };
    if (d.from.kind === 'board') src.__fromBoard = d.from.idx;
    // 手牌先腾出这一格再落子：换位时对方那张牌才有地方收。
    // 以前是落完再清格，兵营看着是满的，换出来的牌会被「遣散」白扔。
    const handBack = (d.from.kind === 'hand') ? G.hand[d.from.i] : null;
    if (d.from.kind === 'hand') G.hand[d.from.i] = null;
    const res = dropOnCell(src, mi);      // 来源格的清理已由 dropOnCell 负责
    if ((res === 'fail' || res === 'shovel-no') && handBack) G.hand[d.from.i] = handBack;
    // 拆字后没落成（点到了放不下的地方）：两个字还挨着，自动并回原来的名将
    if (res === 'fail' && d.from.splitHero) autoFormHeroes(G.board, true);
    // 手牌只要真落到了棋盘上就用掉这一张（落子前已清格；失败在上面原样放回）
    return;
  }

  // ---- 拖到兵营的五个格子上（空格也能放）----
  if (hslot >= 0){
    if (d.from.kind === 'hand'){
      if (hslot === d.from.i) return;                    // 原地放下，什么都不做
      const srcT = G.hand[d.from.i], dstT = G.hand[hslot];
      // 手牌之间也能合成／升阶：同种同阶升一阶、两张单字拼名将（异字合成已关）
      const comb = (srcT && dstT && srcT.kind !== 'shovel' && dstT.kind !== 'shovel')
        ? tryCombine(d.tile, dstT) : null;
      if (!comb && srcT && dstT && srcT.kind === 'unit' && dstT.kind === 'unit')
        toast('合不了 · 只能同种同阶相叠（1+1 → 2 阶）');
      if (comb){
        G.hand[hslot] = comb;                            // 合成结果留在这一格
        G.hand[d.from.i] = null;                         // 源格空出来
        const x = HAND_X0 + hslot*(HAND_S + HAND_GAP) + HAND_S/2;
        burst(x, HAND_Y + HAND_S/2, 16, comb.kind === 'hero' ? GOLD : SEAL);
        floater(x, HAND_Y - 2, comb.kind === 'hero' ? (comb.type + '！') : (comb.level + ' 阶'),
                comb.kind === 'hero' ? GOLD : TIER[comb.level].tc);
        toast(comb.kind === 'hero' ? ('兵营召将 · ' + comb.type + '「' + HEROES[comb.type].sk + '」')
                                   : ('兵营合成 · ' + tileLabel(comb) + ' ' + comb.level + ' 阶'));
        sfx(comb.kind === 'hero' ? 'hero' : 'merge');
        return;
      }
      const t = dstT;                                    // 合不了就对调
      G.hand[hslot] = G.hand[d.from.i];
      G.hand[d.from.i] = t;
      sfx('click');
      return;
    }
    // 棋盘 -> 兵营格：和这一格里的牌对调；空格则直接挪进来，原格腾空
    const back = G.hand[hslot];
    if (back && back.kind === 'hero'){
      const span = findHeroSpan(d.from.idx, G.board, true, [d.from.idx]);
      if (!span){ toast('名将横占两格 · 兵营这一格放不下'); sfx('hit'); return; }
      clearCells(G.board, d.from.idx);
      const nu = newUnit(back.type, back.level, span[0], span);
      nu.born = 0;
      for (const i of span) G.board[i] = nu;
      G.hand[hslot] = d.tile;
    } else {
      clearCells(G.board, d.from.idx);
      if (back){ const nu = toUnitObject(back, d.from.idx); if (nu) G.board[d.from.idx] = nu; }
      G.hand[hslot] = d.tile;
    }
    refreshBonds(); autoFormHeroes(G.board, true); ensureMyBuffs();
    sfx('click');
    return;
  }

  // 拖回兵营区域（没对准具体某一格）-> 从棋盘收回（名将整组收回）
  if (d.from.kind === 'board' && p.y > HAND_Y - 50 && p.y < HAND_Y + HAND_S + 50){
    if (handAdd(d.tile)){
      clearCells(G.board, d.from.idx);
      refreshBonds(); autoFormHeroes(G.board, true); ensureMyBuffs();
      sfx('click');
    } else {
      toast('兵营已满 · 收不回来');
    }
  }
}

function bindInput(){
  /* 输入先过一层录制：把落点记到当前逻辑步上（回放就靠这些点重演整局） */
  const wrap = (type, fn) => (ev) => {
    if (!REPLAY.on && HAS_LS) recEvent(type, toLogical(ev));
    fn(ev);
  };
  cv.addEventListener('pointerdown', wrap('down', onDown), { passive:false });
  cv.addEventListener('pointermove', wrap('move', onMove), { passive:false });
  cv.addEventListener('pointerup', wrap('up', onUp), { passive:false });
  cv.addEventListener('pointercancel', () => { G.dragger = null; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  // 键盘：空格 / P / Esc 暂停或继续，M 静音
  window.addEventListener('keydown', e => {
    const ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT') return;      // 正在填服务器地址/房间号
    const k = e.key;
    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P' || k === 'Escape'){
      e.preventDefault();
      if (G.paused) pauseAction('resume');
      else if (canPause()) setPaused(true);
      return;
    }
    if (k === 'm' || k === 'M'){ muted = !muted; }
  });
}

/* ============================================================
   对局录制 / 回放
   一局 = 种子 + 输入事件（按下 / 移动 / 抬起，按逻辑步编号记录）。
   逻辑是确定性的（固定 1/60 步长 + 种子随机），所以把这些输入重放一遍，
   整局就能原样重演 —— 不需要存画面，也不需要存每一步的盘面。
   ============================================================ */
const REC_KEY = 'wt_record_v1';
/* 自动清理：条数或总体积先到线，就从最旧的开始丢（判定见 recSave）。
   浏览器 localStorage 一般只有 5MB，留 2MB 给录像比较安全。 */
const REC_MAX = 20;
const REC_MAX_BYTES = 2 * 1024 * 1024;
const HAS_LS = (() => { try { return !!window.localStorage; } catch(e){ return false; } })();
const REC = { on:false, seed:0, aiLevel:0, events:[], start:0 };
let LAST_REC = null;                       // 刚结束的那一局（结算页「回放本局」用）
const REPLAY = { on:false, ev:[], i:0, speed:2, limit:0, rec:null, dispatching:false, exitBtn:null, back:'over' };
let IN_HOOK = null;                        // 回放时把录好的坐标直接喂进输入层

function recBegin(){
  if (!HAS_LS || NET.pvp || REPLAY.on){ REC.on = false; return; }
  REC.on = true; REC.seed = G.seed; REC.aiLevel = AI_LV; REC.events = []; REC.start = Date.now();
  SIM.n = 0; SIM.acc = 0;                  // 事件按「开战后的第几步」编号
}
function recEvent(type, p){
  if (!REC.on) return;
  REC.events.push([SIM.n, type, Math.round(p.x), Math.round(p.y)]);
}
function recLoad(){
  try { const s = localStorage.getItem(REC_KEY); return s ? (JSON.parse(s) || []) : []; } catch(e){ return []; }
}
/* 存一局，顺手做自动清理：
   1) 条数超过 REC_MAX、或总量超过 REC_MAX_BYTES → 从最旧的开始丢
   2) localStorage 真的写不进去（配额满）→ 再丢一局重试，直到能写或一局不剩
   旧录像优先被牺牲，最近的几局总会保住。 */
function recSave(rec){
  let arr;
  try { arr = recLoad(); } catch(e){ return; }
  arr.push(rec);
  let keep = Math.min(arr.length, REC_MAX);        // 先按条数砍
  while (keep > 0){
    const s = JSON.stringify(arr.slice(arr.length - keep));
    if (s.length <= REC_MAX_BYTES){
      try { localStorage.setItem(REC_KEY, s); return; } catch(e){ /* 配额不够，继续丢 */ }
    }
    keep--;
  }
  try { localStorage.removeItem(REC_KEY); } catch(e){}
}
/* 记录列表：新的在前 */
function recAll(){
  const arr = recLoad();
  return arr.map((r, i) => ({ r, i })).reverse();
}
function recBytes(list){
  let n = 0;
  for (const it of list) { try { n += JSON.stringify(it.r).length; } catch(e){} }
  return n;
}
function recFinish(){
  if (!REC.on) return;
  REC.on = false;
  if (!REC.events.length) return;          // 一步没动过，不留记录
  LAST_REC = { ts:Date.now(), mode:'solo', seed:REC.seed, aiLevel:REC.aiLevel, result:G.result,
               time:+G.time.toFixed(1), wave:G.wave, events:REC.events };
  recSave(LAST_REC);
}
/* 回放：同种子重新开局，在录下来的那一步喂回同样的输入，2 倍速播完
   back：播完 / 退出后回到哪 —— 'over'（结算页，默认）| 'records'（对局记录页） */
function startReplay(rec, back){
  if (!rec || !rec.events || !rec.events.length){ toast('这一局没有可回放的操作'); return; }
  REPLAY.back = back || 'over';
  REPLAY.on = true; REPLAY.rec = rec; REPLAY.ev = rec.events; REPLAY.i = 0;
  REPLAY.speed = 2; REPLAY.dispatching = false;
  const lastTick = rec.events[rec.events.length - 1][0];
  REPLAY.limit = lastTick + 60 * 120;      // 保险：最多再跑 2 分钟
  newGame(rec.seed >>> 0);
  setAILevel(rec.aiLevel | 0);
  SIM.n = 0; SIM.acc = 0;
  startBattle();                           // 录制也是从「备战」这一秒开始
  REPLAY.on = true;
  REPLAY.rec = rec; REPLAY.ev = rec.events; REPLAY.i = 0;
  toast('回放本局 · ' + REPLAY.speed + ' 倍速', GOLD);
}
function replayDispatch(type, x, y){
  REPLAY.dispatching = true;
  IN_HOOK = { x, y };
  const ev = { preventDefault(){}, clientX:0, clientY:0, pointerId:1, button:0, target:cv };
  try {
    if (type === 'down') onDown(ev);
    else if (type === 'move') onMove(ev);
    else onUp(ev);
  } finally { IN_HOOK = null; REPLAY.dispatching = false; }
}
function replayPump(){
  if (!REPLAY.on) return;
  while (REPLAY.i < REPLAY.ev.length && REPLAY.ev[REPLAY.i][0] <= SIM.n){
    const e = REPLAY.ev[REPLAY.i++];
    replayDispatch(e[1], e[2], e[3]);
  }
  if (G.phase === 'over' || SIM.n > REPLAY.limit) stopReplay(true);
}
function stopReplay(finished){
  REPLAY.on = false; REPLAY.dispatching = false; IN_HOOK = null; REPLAY.exitBtn = null;
  G.paused = false;
  const back = REPLAY.back || 'over';
  REPLAY.back = 'over';
  if (back === 'records'){                 // 从记录页点进来的，播完/退出都回记录页
    if (!G.result) G.result = 'lose';
    showScreen('records');
    return;
  }
  if (finished){
    if (!G.result) G.result = 'lose';      // 录到一半的局：按当前局面收尾
    G.phase = 'over';
    return;
  }
  toast('已退出回放 · 开新的一局');
  newGame(); startBattle();
}

/* ============================================================
   主循环
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  SCALE = Math.min(ww / W, wh / H);
  cv.width = Math.round(W * SCALE * DPR);
  cv.height = Math.round(H * SCALE * DPR);
  cv.style.width = (W * SCALE) + 'px';
  cv.style.height = (H * SCALE) + 'px';
  layoutNetInputs();
  ctx.setTransform(SCALE*DPR, 0, 0, SCALE*DPR, 0, 0);
}

let last = 0;
/* 掉帧不能让游戏时间变慢：积攒真实经过的时间，按固定步长补齐（见 simAdvance）。
   联机是各跑各的模拟，两端帧率不一样，靠这个保证时间轴不漂。 */
/* 逻辑固定 1/60 秒一步：一帧可能走 0、1、2 步，但步长永远一样。
   这是「回放能一模一样」的前提 —— 同样的步数 + 同样的输入 = 同样的局面。
   渲染仍然是逐帧的，画面不受影响。 */
const SIM_STEP = 1/60;
const SIM = { n:0, acc:0 };
function simAdvance(dtReal){
  SIM.acc += dtReal;
  let guard = 0;
  replayPump();                          // 回放：先补「第 n 步结束后」发生的输入
  while (SIM.acc >= SIM_STEP - 1e-9 && guard++ < 240){
    step(SIM_STEP);
    SIM.n++;
    SIM.acc -= SIM_STEP;
    replayPump();                        // 记录按「第几步之后」编号，这里对齐
  }
  if (guard >= 240) SIM.acc = 0;      // 落后太多（切后台回来）：丢掉，不追
}
/* 页面切到后台时浏览器会把 requestAnimationFrame 掐掉（或压到 1fps）。
   联机对局不能因此停摆，所以不可见时改用 setTimeout 接着驱动。 */
let bgTimer = null, rafPending = false;
function nextFrame(){
  if (document.visibilityState === 'visible'){
    if (rafPending) return;                  // 已经排了一帧，别重复驱动
    rafPending = true;
    requestAnimationFrame(ts => { rafPending = false; loop(ts); });
  } else if (!bgTimer){
    bgTimer = setTimeout(() => { bgTimer = null; loop(performance.now()); }, 400);
  }
}
/* 回到前台：把驱动交回 rAF（后台那段是 setTimeout 顶着的，时间没丢） */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!bgTimer) return;                      // 一直是 rAF 在跑，不用管
  clearTimeout(bgTimer); bgTimer = null;
  last = performance.now();                  // 别拿旧时间戳算 dt
  nextFrame();
});
function loop(ts){
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 2) dt = 2;                      // 离开很久（切回来）：最多补 2 秒
  if (NET.screen !== 'game'){
    if (G.toastT > 0) G.toastT -= dt;                       // 菜单屏的提示也要淡出
    if (NET.waitT > 0){                                     // 建/加房间等回包，超时就明说
      NET.waitT -= dt;
      if (NET.waitT <= 0 && NET.screen === 'lobby' && NET.panel){
        NET.panelMsg = '服务器没有回应 · 请确认服务器是当前版本（重启 node server.js）';
        NET.panelBad = true;
      }
    }
    if (NET.screen === 'lobby' && NET.link === 'online'){   // 大厅：每 2 秒刷新一次房间列表
      NET.listT -= dt;
      if (NET.listT <= 0){ NET.listT = 2; netSend({ t:'list' }); }
    }
    layoutNetInputs();
    draw(); nextFrame(); return;
  }
  if (G.paused){ draw(); nextFrame(); return; }   // 暂停：全局冻结，只重绘
  G.t += dt;
  simAdvance(REPLAY.on ? dt * REPLAY.speed : dt);  // 回放按倍速喂同样的逻辑步
  if (NET.pvp){ NET.pushT -= dt; if (NET.pushT <= 0){ NET.pushT = 0.4; netPushSide(); } netCheckOver(); }
  if (G.toastT > 0) G.toastT -= dt;
  if (G.aduShield > 0) G.aduShield -= dt;
  if (G.aduHurtM > 0) G.aduHurtM -= dt;
  if (G.aduHurtE > 0) G.aduHurtE -= dt;
  draw();
  nextFrame();
}

function boot(){
  // 想复现某一张地图：在地址后面加 ?seed=12345
  const m = /[?&]seed=(\d+)/.exec(location.search || '');
  if (m) fixedSeed = (parseInt(m[1], 10) >>> 0);
  newGame();
  makeNetInputs();
  if (m){ NET.screen = 'game'; NET.started = true; }   // ?seed= 直接进对局（调地图用）
  // 一键联机（测试/分享用）：?net=host&room=abc&addr=ws://1.2.3.4:8787
  //                         ?net=guest&room=abc&addr=ws://1.2.3.4:8787
  const nr = /[?&]net=(host|guest)/.exec(location.search || '');
  if (nr){
    const rm = /[?&]room=([^&]+)/.exec(location.search || '');
    const ad = /[?&]addr=([^&]+)/.exec(location.search || '');
    if (ad) NET.addr = decodeURIComponent(ad[1]);
    NET.pendingRole = nr[1];
    NET.pendingRoom = rm ? decodeURIComponent(rm[1]) : 'default';
    NET.screen = 'online';
    NET.pvp = false;
    if (addrInput) addrInput.value = NET.addr;
    netConnect();
  }
  resize();
  window.addEventListener('resize', resize);
  bindInput();
  requestAnimationFrame(loop);
}

/* ============================================================
   Headless 数据快照：整个战局的结构化 JSON。
   画面只是这些数据的呈现 —— agent 读它 = 看画面，操作数据 = 操作游戏。
   每格三要素：坐标 (c,r,idx) / 状态 land|path|adu / 对象 unit。
   ============================================================ */
function tileOut(t){
  if (!t) return null;
  if (t.kind === 'shovel') return { kind:'shovel' };
  if (t.kind === 'char')   return { kind:'char', char:t.char };
  return { kind:t.kind, type:t.type, level:t.level };
}
function unitOut(u){
  if (!u) return null;
  const o = { kind:u.kind, type:u.type, char:u.char, level:u.level,
              hp:u.hp, maxHp:u.maxHp, atk:u.atk, rate:u.rate, range:u.range,
              cells:u.cells ? u.cells.slice() : undefined };
  if (u.kind === 'hero'){ o.rank = u.rank; o.xp = u.xp; o.skill = u.skill; }
  if (u.vs && u.vs.length) o.vs = u.vs;
  return o;
}
function boardOut(board, mine){
  const out = [];
  for (let i = 0; i < COLS*ROWS; i++){
    const st = isAduCell(i, mine) ? 'adu' : (isPathCell(i, mine) ? 'path' : 'land');
    const canPlace = st === 'land' && !board[i] && (mine ? !!G.unlocked[i] : aiLandOK(i));
    out.push({ c:colOf(i), r:rowOf(i), idx:i, state:st, canPlace, unit:unitOut(board[i]) });
  }
  return out;
}
function snapshotData(){
  return {
    seed:G.seed, phase:G.phase, paused:!!G.paused, pvp:!!NET.pvp,
    time:+G.time.toFixed(2), wave:G.wave,
    nextWaveIn:+Math.max(0, WAVE_GAP - G.waveT).toFixed(2),
    prepT:(G.phase === 'prep') ? +G.prepT.toFixed(2) : undefined,
    me:{ mantou:G.mantou, enlistCost:G.enlistCost, life:G.myLife, maxLife:G.myMax,
         merit:G.merit, meritNeed:G.meritNeed, kills:G.kills, leaks:G.leaks,
         unlocked:Object.keys(G.unlocked).length,
         hand:G.hand.map(tileOut), actives:G.actives.slice(),
         passive:Object.assign({}, G.passive) },
    ai:{ mantou:G.ai.mantou, life:G.enLife, maxLife:G.enMax,
         merit:G.ai.merit, meritNeed:G.ai.meritNeed, kills:G.ai.kills, leaks:G.aiLeaks,
         hand:G.ai.hand.map(tileOut) },
    myBoard:boardOut(G.board, true),      // 我方半场：c/r 按我方视角（和画面一致）
    aiBoard:boardOut(G.enBoard, false),   // 敌方半场：c/r 按敌方视角（画面上是对面镜像）
    marchers:G.marchers.map(m => ({
      owner:m.owner, key:m.key, name:m.name, level:m.level, elite:m.elite,
      hp:m.hp, maxHp:m.maxHp, atk:+m.atk.toFixed(1),
      x:Math.round(m.x), y:Math.round(m.y),
      ri:m.ri, routeLen:m.route ? m.route.length : 0, queued:!!m.queued,
    })),
    shop:{ open:G.shopOpen || G.phase === 'shop', stock:G.shopStock.slice(), bought:G.shopBought },
    result:G.result,
  };
}
