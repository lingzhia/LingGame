<script>
(function(){
'use strict';

/* ============================================================
   WordTower · 文字塔防（复刻）
   核心：1V1 上下分屏双线对攻 / 主公 3 命 / 8×8 棋盘 ·
        出兵点一格、主公一格、中间一条蛇形路占若干格 /
        蛇形路每局随机重掷（不许占满任何 2×2 田字格） /
        征兵一次刷新 5 格（旧牌自动回收） / 馒头只来自杀敌 /
        同字升阶 / 12 名将拼名召唤 / 羁绊 /
        神秘商人道具 / 白绿蓝紫金五品
   版式：竖屏 720×1446，分上中下三段 ——
        上 1/3 左半是战况面板（馒头/波次/主公/羁绊），右半是敌军缩略图（点一下放大到上 2/3，再点收起）；
        下 2/3 是玩家操作区：我方棋盘按 1.16 倍渲染 + 兵营 + 按键。
        世界坐标（两块 8×8 棋盘、格距 72、上下镜像）一个字没动，
        缩放只是「怎么画」，射程/行军/命中全在世界坐标里算，上下依旧完全对称。
   ============================================================ */

/* ---------------- 画布 ---------------- */
const W = 720, H = 1446;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1;

/* 棋盘：8 列 × 8 行的一张方阵。
   出兵点与主公各自就是棋盘上的一个格子，两点之间用一条蛇形「路」连起来 ——
   路格与主公格不可布防，其余格子才是能摆兵、摆将的地方。
   竖版比例：两块棋盘上下叠放，纵向一共 16 行格子 —— 画面天生偏瘦长。
   所以格子从 78 收到 72，上下留白（HUD / 中缝 / 手牌 / 按钮）一并压紧，
   整幅画布从 720×1620 收到 720×1446，左右留白用阵营标签填上。 */
const COLS = 8, ROWS = 8, CELL = 72;
const BX = (W - COLS * CELL) / 2;        // 72
const Y_ENEMY = 80;                       // 电脑方棋盘 y0 -> 80..656
const Y_MINE  = 676;                      // 我方棋盘 y0 -> 676..1252
const MID1 = 656, MID2 = 676;             // 中缝（双方的出兵点都贴着它）
const ADU_R = 24;

const cellAt = (c, r) => c + r*COLS;

/* 熟地（开局直接能布阵的格子）与荒地：
   一局开始时只发 START_OPEN 格熟地 —— 从「离路近、贴着主公、靠前线」的次序里挑最好的几格，
   其余可布防的格子全是荒地，得一格一格用铲子挖开。
   电脑半场拿的是同一张名单的上下镜像（FREE_E），两边地界完全对等。 */
const START_OPEN = 7;
/* 开局熟地数直接决定「守军上限」，所以它和铲子掉率是一对：7 格起手 + 铲子 16%，
   一局大约能开到 10-12 格。原来 5 格 + 10% 时整局只有 6-8 格，第 3 波起就摆不满防线了。 */
const SHOVEL_RATE = 0.16;
let FREE_M = {}, FREE_E = {};        // 熟地名单：我方 / 电脑半场（上下镜像）
function computeFreeLand(){
  const cand = [];
  for (let i = 0; i < COLS*ROWS; i++){
    if (isRoad(i, true)) continue;
    cand.push(i);
  }
  // 分数高的先给：离路近、挨着主公、越靠前线越好
  cand.sort((a, b) => (cellScore(b, true) - cellScore(a, true)) || (a - b));
  FREE_M = {}; FREE_E = {};
  for (const i of cand.slice(0, START_OPEN)){
    FREE_M[i] = true;
    FREE_E[cellAt(colOf(i), ROWS - 1 - rowOf(i))] = true;
  }
}

/* ---------------- 随机地图 ----------------
   一条「路」= 从出兵点（紧贴中缝那一行的一格）出发、一路往下蛇行到主公身前的一串格子。
   本地坐标 [列, 行]：行 0 贴着中缝，行 ROWS-1 是最里侧（主公坐的那一行）。
   两条硬规矩：
     1) 路是一串首尾相连、互不重叠的格子，最后停在与主公正交相邻的那一格；
     2) 任何 2×2 田字格都不允许被路块（含主公那一格）占满 ——
        占满了就会出现一块实心死角，既糊成一团，也挡住布防视野。
   每次开局重掷一张；电脑半场用同一张图上下镜像，两边完全对等。 */

let PATH_M = [];                     // 我方半场的路
let ADU_M_C = [0, ROWS-1];           // 我方主公：路的尽头再往里一格
let PATH_E = [];                     // 电脑半场（上下镜像）
let ADU_E_C = [0, 0];
let PATH_CELLS_M = [], PATH_CELLS_E = [];
let ADU_M_CELL = 0, ADU_E_CELL = 0;
let ADU_M = { x: 0, y: 0, r: ADU_R }, ADU_E = { x: 0, y: 0, r: ADU_R };

let mapRnd = Math.random;            // 地图专用的随机源（可换种子复现）
let fixedSeed = null;
let gRnd = Math.random;              // 对局随机源：征兵/商店/AI 抽牌/来兵等玩法随机都走它，有种子即可整局复现
function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const mapInt = n => (mapRnd() * n) | 0;

/* 掷一条候选路：从 (startC,0) 随机往下走，最后必须停在主公正上方那一格 */
function rollPath(){
  const startC = mapInt(COLS), aduC = mapInt(COLS);
  const path = [], seen = {};
  const push = (c, r) => { path.push([c, r]); seen[r*COLS + c] = 1; };
  let c = startC, r = 0, run = 0, guard = 0;
  push(c, r);
  while (guard++ < 160){
    if (r === ROWS-2 && c === aduC) break;        // 停到主公跟前，收工
    if (r === ROWS-2){                            // 倒数第二行：只朝主公那一列靠
      c += (c < aduC ? 1 : -1);
      push(c, r);
      continue;
    }
    const canL = c > 0 && !seen[r*COLS + c-1];
    const canR = c < COLS-1 && !seen[r*COLS + c+1];
    // 横着跑太长就往下拐：横带短一点，路才铺得开
    const mustDown = run >= 5 + mapInt(4) || !(canL || canR);
    if (mustDown || mapRnd() < 0.27){
      r++; run = 0; push(c, r);
    } else if (canL && canR){
      c += (mapRnd() < 0.5 ? -1 : 1); run++; push(c, r);
    } else if (canL){
      c--; run++; push(c, r);
    } else {
      c++; run++; push(c, r);
    }
  }
  const cols = {};
  for (const p of path) cols[p[0]] = 1;
  return { path, aduC, cols: Object.keys(cols).length };
}

/* 2×2 校验：任何一个田字格都不许被路块占满 */
function quadOK(path, aduC){
  const road = {};
  for (const p of path) road[p[1]*COLS + p[0]] = 1;
  road[(ROWS-1)*COLS + aduC] = 1;                 // 主公那一格也是路
  for (let r = 0; r < ROWS-1; r++)
    for (let c = 0; c < COLS-1; c++)
      if (road[r*COLS+c] && road[r*COLS+c+1] &&
          road[(r+1)*COLS+c] && road[(r+1)*COLS+c+1]) return false;
  return true;
}

/* 兜底地图：万一脸黑掷不出合格的，就用这张手写的（同样满足 2×2 约束） */
const FALLBACK = { aduC: 3, path: [
  [3,0],
  [3,1],[2,1],[1,1],[0,1],
  [0,2],[0,3],[0,4],
  [1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],
  [7,5],[7,6],
  [6,6],[5,6],[4,6],[3,6],
] };

/* 把一条路写进全局：我方用原样，电脑半场上下镜像 */
function applyMap(path, aduC){
  PATH_M = path.map(p => [p[0], p[1]]);
  ADU_M_C = [aduC, ROWS-1];
  PATH_E = PATH_M.map(p => [p[0], ROWS - 1 - p[1]]);
  ADU_E_C = [ADU_M_C[0], ROWS - 1 - ADU_M_C[1]];
  PATH_CELLS_M = PATH_M.map(p => cellAt(p[0], p[1]));
  PATH_CELLS_E = PATH_E.map(p => cellAt(p[0], p[1]));
  ADU_M_CELL = cellAt(ADU_M_C[0], ADU_M_C[1]);
  ADU_E_CELL = cellAt(ADU_E_C[0], ADU_E_C[1]);
  ADU_M = { x: cellCX(ADU_M_C[0]), y: cellCY(ADU_M_C[0], ADU_M_C[1], Y_MINE), r: ADU_R };
  ADU_E = { x: cellCX(ADU_E_C[0]), y: cellCY(ADU_E_C[0], ADU_E_C[1], Y_ENEMY), r: ADU_R };
}

/* 掷一张新地图。seed 给了就按种子复现（方便调试／写测试） */
function genMap(seed){
  if (seed === undefined) seed = fixedSeed;
  mapRnd = (seed === null || seed === undefined) ? Math.random : mulberry32(seed >>> 0);
  for (let attempt = 0; attempt < 900; attempt++){
    const m = rollPath();
    if (m.path.length < 20) continue;       // 太短：一路直下，既没布防纵深，敌军也跑得太快
    if (m.cols < 5) continue;               // 太窄：整条路挤在两三列里
    if (!quadOK(m.path, m.aduC)) continue;  // 占满了某个田字格
    applyMap(m.path, m.aduC);
    return { path: PATH_M.slice(), aduC: ADU_M_C[0] };
  }
  applyMap(FALLBACK.path, FALLBACK.aduC);
  return { path: PATH_M.slice(), aduC: ADU_M_C[0] };
}
genMap();

function pathList(mine){ return (mine === false) ? PATH_E : PATH_M; }
function pathCells(mine){ return (mine === false) ? PATH_CELLS_E : PATH_CELLS_M; }
function isPathCell(cell, mine){ return pathCells(mine).indexOf(cell) >= 0; }
function isAduCell(cell, mine){ return cell === (mine === false ? ADU_E_CELL : ADU_M_CELL); }
/* 路格 + 主公格：整条通道都不能布防 */
function isRoad(cell, mine){ return isPathCell(cell, mine) || isAduCell(cell, mine); }
/* 路的折线点（格心）：敌兵沿着它一个点一个点地走，
   走完最后一个点再往前一步就是主公 */
function pathPoints(mine){
  const base = (mine === false) ? Y_ENEMY : Y_MINE;
  return pathList(mine).map(p => ({ x: cellCX(p[0]), y: cellCY(p[0], p[1], base) }));
}
function spawnPos(mine){
  const base = (mine === false) ? Y_ENEMY : Y_MINE;
  const p = pathList(mine)[0];
  return { x: cellCX(p[0]), y: cellCY(p[0], p[1], base) };
}
/* 某个格子离「路」最近还隔着几格（切比雪夫距离）：1 = 紧贴路边，越大越荒 */
function pathAway(cell, mine){
  const c = colOf(cell), r = rowOf(cell);
  let best = 99;
  for (const p of pathList(mine))
    best = Math.min(best, Math.max(Math.abs(p[0] - c), Math.abs(p[1] - r)));
  return best;
}
/* 电脑能不能在这一格布阵：熟地名单（FREE_E）里的，或它自己用铲子挖开的 */
function aiLandOK(cell){
  if (FREE_E[cell]) return true;
  return !!(G && G.aiUnlocked && G.aiUnlocked[cell]);
}
const AI_TICK = 0.55;        // 电脑对手的决策间隔（秒），真值取 AI_LEVELS[lv].tick
/* ---------------- 电脑难度 ----------------
   强度只调「决策质量」，不调兵种数值 —— 调数值会变成"AI 在作弊"，玩家一眼看得出来。
   四个旋钮：
     tick      多久想一次棋（越短越像个手快的人）
     raiderCap 同时在路上的主动出击兵上限（人类可以随时把整手牌倒上路）
     maxChars  盘上肯留几个"还没配成对"的单字（决定它拼不拼得出名将）
     holdFree  至少留几格空地才肯拿单字去占坑
     shieldAt  掉到几命就舍得开神兵符
     rush      会不会在开波前把落不下的兵集中推上路
   改难度只动这张表。 */
const AI_LEVELS = [
  { name:'新兵', desc:'想得慢，忘了往路上推兵', tick:0.80, raiderCap:3, maxChars:3, holdFree:5, shieldAt:1, rush:false },
  { name:'老将', desc:'会留格拼将，开波前集中推兵', tick:0.55, raiderCap:6, maxChars:5, holdFree:2, shieldAt:2, rush:true  },
  { name:'枭雄', desc:'想得快，路上常年压着 9 个兵', tick:0.40, raiderCap:9, maxChars:7, holdFree:1, shieldAt:2, rush:true  },
];
let AI_LV = 1;                       // 默认「老将」；0 新兵 / 1 老将 / 2 枭雄
const AIC = () => AI_LEVELS[clamp(AI_LV | 0, 0, AI_LEVELS.length - 1)];
function setAILevel(n){ AI_LV = clamp(n | 0, 0, AI_LEVELS.length - 1); return AI_LEVELS[AI_LV].name; }
/* 电脑盘上最多留几个「还没配成对」的单字（它们只是等伙伴的种子）。
   单字落地只是个占位道具（血 1、不会攻击），堆多了就是把熟地变成死地。 */
const AI_MAX_CHARS = 3;
/* 电脑盘上剩下的空熟地少于这个数时，就不再拿「配不成对的单字」去占坑了 ——
   坑位留给真兵更划算。 */
const AI_HOLD_FREE = 4;
/* 电脑要不要做异字合成（弩/骁/钺/铁/戟/骧这六个合成兵种）。
   关掉的理由：玩家看到对面凭空冒出没见过的兵种，第一反应是「AI 在作弊」——
   这是可读性问题，不是强度问题。打开 = true 即恢复对称规则。 */
const AI_FUSE = false;
/* 异字合成（弩/骁/钺/铁/戟/骧）整体关掉：两个不同兵种叠在一起不再变出新兵种。
   兵种就只留刀/枪/弓/骑四种 + 同种升阶 + 拼名召将，规则一眼能算清。
   想恢复只需把 FUSE_ON 改 true。 */
const FUSE_ON = false;
/* 电脑的合成结果是否允许落地：异字合成关着的时候，弓1+骑1 不再变骁骑 */
function aiCombOK(comb){
  return !!AI_FUSE || !(comb && comb.kind === 'unit' && !!FUSE[comb.type]);
}

/* ---------------- 版式：上中下三段 ----------------
   上 1/3 再横着切一半：
     左半 = 战况面板（馒头 / 波次 / 主公 / 羁绊，能读的都放这儿）
     右半 = 敌军缩略图（只读，点一下放大到上 2/3，再点收起）
   下 2/3 = 玩家操作区：我方棋盘（放大 1.16 倍渲染）+ 兵营 + 按键。
   世界坐标一个字没动 —— 两块棋盘还是同样大小、同样格距，
   变的是「怎么把世界画到屏幕上」：每个视口一套 ox/oy/k，
   逻辑（射程、行军、命中）全在世界坐标里算，所以上下依旧完全对称。 */
const TOP_H = Math.round(H / 3);          // 482
const BOT_Y = TOP_H;                      // 482
const BIG_H = Math.round(H * 2 / 3);      // 964（敌军放大后盖住上 2/3）
const TOP_L = { x: 0, y: 0, w: W/2, h: TOP_H };
const TOP_R = { x: W/2, y: 0, w: W/2, h: TOP_H };
const PLAY_S = 1.16;                      // 我方棋盘的渲染倍率（世界 576 → 668）
const MINI_K = 0.58;                      // 敌军缩略图倍率（世界 576 → 334）
const BIG_K  = 1.10;                      // 敌军放大后的倍率

const HAND_N = 5, HAND_S = 86, HAND_GAP = 8, HAND_Y = 1188;
const HAND_X0 = (W - (HAND_N * HAND_S + (HAND_N - 1) * HAND_GAP)) / 2; // 129
const BTN_ENLIST = { x: 24, y: 1296, w: 236, h: 58 };
const SLOT = [{ x: 276, y: 1297 }, { x: 344, y: 1297 }];
const SLOT_S = 56;
const BTN_PAUSE = { x: TOP_L.w - 68, y: 16, w: 50, h: 50 };   // 战况面板右上角
const BTN_FOLD = { x: W - 96, y: 26, w: 74, h: 44 };           // 放大视图里的「收起」

/* 视口：矩形（屏幕裁剪区）+ 缩放 k + 世界原点 wy0 落在屏幕的哪个 y。
   横向一律居中，所以只给 oy。 */
function mkView(rect, k, wy0, oy){
  const bw = COLS * CELL * k;
  return { k, wy0, ox: rect.x + (rect.w - bw)/2, oy,
           clip: { x: rect.x, y: rect.y, w: rect.w, h: rect.h } };
}
const V_MINI = mkView(TOP_R,          MINI_K, Y_ENEMY, 56);    // 敌军缩略图
const V_BIG  = mkView({ x:0, y:0, w:W, h:BIG_H }, BIG_K, Y_ENEMY, 168);  // 敌军放大
const V_PLAY = mkView({ x:0, y:BOT_Y, w:W, h:H-BOT_Y }, PLAY_S, Y_MINE, 496); // 我方棋盘

/* 屏幕点 -> 世界坐标（视口内） */
function viewPt(v, wx, wy){
  return { x: v.ox + (wx - BX) * v.k, y: v.oy + (wy - v.wy0) * v.k };
}
/* 世界坐标 -> 屏幕坐标（视口内） */
function viewWorld(v, p){
  return { x: BX + (p.x - v.ox) / v.k, y: v.wy0 + (p.y - v.oy) / v.k };
}
/* 某一格在屏幕上的矩形（拖拽高亮 / 落点提示用） */
function cellRectV(v, idx){
  const p = viewPt(v, BX + colOf(idx)*CELL, v.wy0 + rowOf(idx)*CELL);
  const s = CELL * v.k;
  return { x: p.x, y: p.y, s };
}
const bigOpen = () => !!G.enemyBig;

/* ---------------- 配色 ---------------- */
const PAPER   = '#f2ebdd';
const PAPER_D = '#e5dbca';
const PAPER_L = '#faf6ee';
const INK     = '#2b2620';
const INK2    = '#5b5347';
const INK3    = '#968c7a';
const LINE    = 'rgba(90,80,65,0.20)';
const SEAL    = '#b03a2e';
const GOLD    = '#b8860b';
const GRASS   = '#7d9c5a';   // 未开垦格子
const FONT    = '"Songti SC","STSong","SimSun","Noto Serif SC",serif';

/* ---------------- 品阶：白 绿 蓝 紫 金 ----------------
   同种兵相叠即升阶（等级相差 ≤1 也能合，结果 = 较高阶 +1）：等级越高，攻击力与攻速同步提升。
   五阶用五套颜色区分（底色 / 边框 / 字色 / 角标），牌面离远看也能认出等级；
   角标上直接写数字 1–5，不再用「卒/士/校/尉/将」这套文字（n 字段保留作内部名，不上屏）。

/* ---------------- 名将成长 ----------------
   合成不是唯一的升阶路：名将在场上杀敌会自己攒经验，攒够就自动升一阶。
   两条路共用 heroHpMul / heroAtkMul / heroRateMul，最后长成同一个东西。
   经验只按「谁补的最后一刀」算 —— 谁杀的谁长，不吃队友的战功。 */
const HERO_XP = [0, 40, 110, 220, 380];        // 升到下一级所需经验，按当前等级索引
function heroXpGain(foe){                       // 击杀一个敌兵给多少经验：看它的品阶
  return 6 + 5 * ((foe && foe.level ? foe.level : 1) - 1);
}
function heroMaxLv(u){ return (HEROES[u.type] && HERO_MAXLV[HEROES[u.type].r]) || 5; }
function heroXpNeed(u){ return HERO_XP[u.level] || 0; }
/* 记一次经验，返回这次升了几阶（0 = 没升） */
function addHeroXp(u, foe, mine){
  if (!u || u.kind !== 'hero' || !HEROES[u.type]) return 0;
  const cap = heroMaxLv(u);
  if (u.level >= cap) return 0;
  u.xp = (u.xp || 0) + heroXpGain(foe);
  let up = 0;
  while (u.level < cap && u.xp >= heroXpNeed(u)){ u.xp -= heroXpNeed(u); u.level++; up++; }
  if (!up) return 0;
  // 升阶：按新等级重算三维，顺手回满血
  const h = HEROES[u.type];
  u.maxHp = Math.round(h.hp * heroHpMul(u.level));
  u.hp = u.maxHp;
  u.atk = Math.round(h.atk * heroAtkMul(u.level));
  u.rate = h.rate * heroRateMul(u.level);
  const p = unitPos(u, mine ? Y_MINE : Y_ENEMY);
  burst(p.x, p.y, 22, GOLD);
  floater(p.x, p.y - 44, 'Lv.' + u.level, mine ? GOLD : SEAL);
  toast((mine ? '' : '敌方 ') + u.type + ' 升到 ' + u.level + ' 阶！');
  sfx('hero');
  return up;
}

  if (!e || e.hp <= 0) return;
  damageMarcher(e, d, mine ? 'me' : 'ai');
  if (e.hp <= 0) addHeroXp(u, e, mine);
}

/* ---------------- 武将文字池 ----------------
   一局只发一次：把 12 个名将的名字全部拆成单字，洗成一池（24 张），
   发一张就少一张，本局不再回池。
   同一个字在池里有几张，取决于有几个名将的名字用到它 ——
   「关」×3（关羽/关兴/关平）、「张」×3（张飞/张苞/张翼）、「黄」×3（黄忠/黄祖/黄盖），
   其余各 ×1。
   所以「羽」在一池里只有一张：一轮里最多只能召出一个关羽。
   一轮摸空（24 张发完）后自动重洗，恢复成完整的 24 张重新开始 ——
   双方共用同一个池，谁摸到算谁的。 */
const HERO_CHAR_POOL0 = [];
for (const n in HEROES) HERO_CHAR_POOL0.push(HEROES[n].a, HEROES[n].b);
function shuffleInPlace(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (gRnd() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 从池子里摸走一张指定的字（摸不到返回 false） */
function takePoolChar(c){
  const i = G.charPool ? G.charPool.indexOf(c) : -1;
  if (i < 0) return false;
  G.charPool.splice(i, 1);
  return true;
}
/* 从池子里随机摸一张：preferGold = 优先摸金将的字（招贤被动） */
const GOLD_CHARS = [];
for (const n of GOLD_HEROES) GOLD_CHARS.push(HEROES[n].a, HEROES[n].b);
/* 一轮 24 张摸空 -> 重新洗满。返回 true 表示这次是重洗后才发的牌 */
function refillPool(){
  G.charPool = shuffleInPlace(HERO_CHAR_POOL0.slice());
  G.poolRound = (G.poolRound || 1) + 1;
  return true;
}
function drawPoolChar(preferGold){
  let pool = G.charPool || (G.charPool = []);
  if (!pool.length){ refillPool(); pool = G.charPool; }
  if (!pool.length) return null;
  let idx = -1;
  if (preferGold){
    const g = [];
    for (let i = 0; i < pool.length; i++) if (GOLD_CHARS.indexOf(pool[i]) >= 0) g.push(i);
    if (g.length) idx = g[(gRnd() * g.length) | 0];
  }
  if (idx < 0) idx = (gRnd() * pool.length) | 0;
  return pool.splice(idx, 1)[0];
}

function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

let AC = null, muted = false;
function sfx(kind){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    let f0 = 440, f1 = 440, dur = .08, type = 'sine', vol = .05;
    if (kind==='click'){ f0=620; f1=760; dur=.06; type='triangle'; }
    else if (kind==='enlist'){ f0=520; f1=880; dur=.12; type='triangle'; }
    else if (kind==='merge'){ f0=380; f1=900; dur=.16; type='sine'; }
    else if (kind==='hero'){ f0=300; f1=1200; dur=.42; type='sawtooth'; vol=.07; }
    else if (kind==='hit'){ f0=180; f1=90;  dur=.05; type='square'; vol=.03; }
    else if (kind==='lost'){ f0=300; f1=120; dur=.30; type='sawtooth'; vol=.07; }
    else if (kind==='buy'){ f0=700; f1=1100; dur=.14; type='triangle'; }
    else if (kind==='win'){ f0=520; f1=1320; dur=.5; type='triangle'; vol=.07; }
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}

/* ============================================================
   状态
   ============================================================ */
let G = null;

/* ------------------------------------------------------------
   格子占用：名将横占两个相邻格（左格第一个字、右格第二个字）
   普通兵 / 单字 只占一格。u.cell 是锚点格，u.cells 是全部占用格。
   ------------------------------------------------------------ */
function unitCells(u){ return u && u.cells ? u.cells : [u ? u.cell : 0]; }
function isAnchor(u, i){ return !u.cells || u.cells[0] === i; }
/* 单位的中心坐标（名将取两格中间） */
function unitPos(u, baseY){
  const cs = unitCells(u);
  let sx = 0;
  for (const i of cs) sx += cellCX(colOf(i));
  const i0 = cs[0];
  return { x: sx / cs.length, y: cellCY(colOf(i0), rowOf(i0), baseY) };
}
/* 单位占据的像素宽度 */
function unitW(u){ return unitCells(u).length * CELL - 12; }
/* 遍历棋盘上的「单位」（名将只算一次） */
function eachUnit(board, fn){
  for (let i = 0; i < board.length; i++){
    const u = board[i];
    if (!u || u.hp <= 0) continue;
    if (!isAnchor(u, i)) continue;
    fn(u, i);
  }
}
function boardCount(board){
  let n = 0; eachUnit(board, () => n++); return n;
}
/* 面板上的「守 N」只数真能打的兵：单字（1 血、只作拼将材料）不算守军，
   否则盘面看着有 6 个守军，其实两个是一碰就碎的字。 */
function guardCount(board){
  let n = 0; eachUnit(board, u => { if (u.kind === 'unit') n++; }); return n;
}
/* 清掉某个格的单位（名将连同另一格一起清） */
function clearCells(board, idx){
  const u = board[idx];
  if (!u){ board[idx] = null; return; }
  for (const i of unitCells(u)) board[i] = null;
}

/* 名将拆字：一张名将牌其实是两个单字横拼在一起的。
   抓走中间的一个字，另一个字留在原地，武将当场解除 ——
   于是名将既能挪位置，也能把字拆出来去凑别的名将。 */
function splitHero(idx){
  const u = G.board[idx];
  if (!u || u.kind !== 'hero' || !u.cells || u.cells.length < 2) return null;
  const h = HEROES[u.type];
  const c0 = u.cells[0], c1 = u.cells[1];
  const p = unitPos(u, Y_MINE);
  G.board[c0] = { kind:'char', char:h.a, hp:1, maxHp:1, level:0, cell:c0, cells:[c0], born:0 };
  G.board[c1] = { kind:'char', char:h.b, hp:1, maxHp:1, level:0, cell:c1, cells:[c1], born:0 };
  burst(p.x, p.y, 14, GOLD);
  floater(p.x, p.y - 30, '名将解除 · 拆成两个字', INK2);
  return u.type;
}

function newUnit(type, lv, cell, cells){
  const isHero = !!HEROES[type];
  if (isHero){
    const h = HEROES[type];
    const hp = Math.round(h.hp * heroHpMul(lv)), atk = Math.round(h.atk * heroAtkMul(lv));
    const cs = cells || [cell, cell + 1];
    return { kind:'hero', type, hero:type, char:type[0], level:lv, rank:h.r,
             hp, maxHp:hp, atk, rate:h.rate * heroRateMul(lv), range:h.range,
             cells:cs, cell:cs[0], span:cs.length, xp:0,
             cd:0, skCd:3, flash:0, swing:0, born:0,
             skill:h.skill, sk:h.sk, skDesc:h.skDesc };
  }
  const u = UNITS[type] || FUSE[type];
  const st = TIER[lv] || TIER[1];
  const hp = Math.round(u.hp*st.hpMul), atk = Math.round(u.atk*st.atkMul);
  return { kind:'unit', type, char:u.char, name:u.name, level:lv,
           fused: !UNITS[type], desc:u.desc, kindOf:u.kind,
           hp, maxHp:hp, atk, rate:u.rate * st.rateMul, range:u.range,
           cd:0, flash:0, swing:0, born:0, cell, cells:[cell],
           mantou:u.mantou ? u.mantou*(1 + (lv-1)*0.6) : 0, vs:u.vs || [] };
}
function fuseUnit(key, lv, cell){
  const u = FUSE[key];
  const st = TIER[lv] || TIER[1];
  const hp = Math.round(u.hp*st.hpMul), atk = Math.round(u.atk*st.atkMul);
  return { kind:'unit', type:key, char:u.char, name:u.name, level:lv, fused:true,
           desc:u.desc, kindOf:u.kind,
           hp, maxHp:hp, atk, rate:u.rate * st.rateMul, range:u.range,
           cd:0, flash:0, swing:0, born:0, cell, cells:[cell], mantou:0, vs:u.vs || [] };
}

/* 名将落位：找一个能横放两格的锚点
   allow：允许被占用的格（合成时目标格 / 来源格本身） */
function findHeroSpan(idx, board, mine, allow){
  const c = colOf(idx), r = rowOf(idx);
  const opts = [[idx, idx + 1], [idx - 1, idx]];
  for (const pair of opts){
    const a = pair[0], b = pair[1];
    if (rowOf(a) !== r || rowOf(b) !== r) continue;
    if (colOf(b) !== colOf(a) + 1) continue;
    if (colOf(a) < 0 || colOf(b) >= COLS) continue;
    let ok = true;
    for (const i of pair){
      if (i < 0 || i >= board.length){ ok = false; break; }
      if (isPathCell(i, mine)){ ok = false; break; }
      if (isAduCell(i, mine)){ ok = false; break; }
      if (!mine && !aiLandOK(i)){ ok = false; break; }
      if (mine && !G.unlocked[i]){ ok = false; break; }
      if (board[i] && !(allow && allow.indexOf(i) >= 0)){ ok = false; break; }
    }
    if (ok) return pair;
  }
  return null;
}

/* 相邻两字自动成将：同一排左右紧挨着的两张单字牌，只要拼得出名将，就地合成。
   不用把第二个字拖到第一个字上 —— 摆到旁边就自动归位。
   每次落子 / 换位之后扫一遍（连扫几次，一次落子可能牵动好几对）。 */
function autoFormHeroes(board, mine){
  let formed = 0;
  for (let guard = 0; guard < 10; guard++){
    let hit = false;
    for (let r = 0; r < ROWS && !hit; r++){
      for (let c = 0; c < COLS - 1; c++){
        const a = c + r*COLS, b = a + 1;
        const ua = board[a], ub = board[b];
        if (!ua || !ub) continue;
        if (ua.kind !== 'char' || ub.kind !== 'char') continue;
        if (!isAnchor(ua, a) || !isAnchor(ub, b)) continue;
        const comb = tryCombine(ua, ub);          // 单字 + 单字 -> 名将
        if (!comb || comb.kind !== 'hero') continue;
        // 这两格正好就是名将的横跨位
        clearCells(board, a);
        const nb = newUnit(comb.type, comb.level, a, [a, b]);
        nb.born = 0;
        for (const i of [a, b]) board[i] = nb;
        const baseY = mine ? Y_MINE : Y_ENEMY;
        const cx = (cellCX(c) + cellCX(c + 1)) / 2;
        const cy = cellCY(c, r, baseY);
        burst(cx, cy, 26, GOLD);
        floater(cx, cy - 34, comb.type + '！', GOLD);
        sfx('hero');
        if (mine){
          toast('两字相邻 · ' + comb.type + '「' + HEROES[comb.type].sk + '」自动归位');
          refreshBonds();
        } else {
          refreshAiBonds();
        }
        hit = true; formed++;
        break;
      }
    }
    if (!hit) break;
  }
  if (mine && formed) ensureMyBuffs();   // 刚落位的名将也要吃到我方加成
  return formed;
}

function newGame(seed){
  /* 种子优先级：本次显式传入（headless / 回放）> 强制种子（?seed= / 联机同图）> 现掷一个。
     每局都有种子，一局 = 种子 + 操作，所以每局都能完整记录、原样回放（见 REC / REPLAY）。 */
  const gs = (seed !== undefined && seed !== null) ? ((seed | 0) >>> 0)
           : (fixedSeed !== null && fixedSeed !== undefined) ? (fixedSeed >>> 0)
           : ((Math.random() * 1e9) | 0);
  gRnd = mulberry32((gs ^ 0x5f3759df) >>> 0);
  G = {
    phase:'intro',          // intro | prep | battle | shop | over
    paused:false,           // 手动暂停：全场冻结
    vsAI:true,              // 人机对战（可暂停）／将来真人对战置 false 即禁用暂停
    seed:gs,
    t:0, time:0,
    mantou:8,               // 开局军费：刚好够征一次兵
    enlistCost:5,           // 征兵费：5 起，每征一次 +1，只涨不降
    hand:[],
    board:new Array(COLS*ROWS).fill(null),
    unlocked:{},            // cell -> true
    marchers:[],            // 路上所有行军的兵（双方共用，用 owner 区分）
    fx:[],
    parts:[],
    floaters:[],
    myLife:3, myMax:3,
    enLife:3, enMax:3,
    wave:0, waveT:0, spawnLeft:0, spawnGap:0, spawnQueue:[],
    aiSpawnLeft:0, aiSpawnGap:0, aiSpawnQueue:[],   // 电脑派下来的进攻部队（上半场）
    kills:0, merit:0, meritNeed:21, leaks:0, aiLeaks:0,
    aduShield:0,            // 无敌计时
    aduHurtM:0, aduHurtE:0, // 主公挨打的红色闪烁计时（只是表现，不影响规则）
    passive:{},             // 被动道具
    actives:[],             // 主动道具槽
    shovelBonus:0,
    shopBought:false, shopOpen:false, shopStock:[],
    dragger:null,
    inspect:null,           // 点击查看的兵种详情
    enemyBig:false,         // 敌军缩略图是否放大（只影响渲染与点击，不影响任何结算）
    toast:'', toastT:0,
    result:null,
    bondOn:{},
    enBoard:new Array(COLS*ROWS).fill(null),   // 电脑对手的布阵（上半场）
    enOut:[],               // 联机：对面派上路的兵（格索引 + 是否排队），只用来画
    // 电脑对手按玩家同一套规则运行：馒头只来自杀敌、一次刷新 5 格手牌、同种升阶（等级可差 1 阶，异字合成默认关闭）
    ai:{ mantou:8, cost:5, merit:0, meritNeed:21, hand:[], t:0, kills:0, passive:{}, actives:[] },
    aiBondOn:{}, aiShield:0,
    aiUnlocked:{},          // 电脑自己开垦出来的格子
    prepT:0, aiT:0,
    poolRound:1,            // 字池第几轮（摸空一次 +1）
  };
  // 每局重掷一张地图（两边共用一张，上下镜像），再按这张图发熟地
  genMap(gs);
  // 开局只发 START_OPEN 格熟地，其余都要用铲子挖（电脑半场用同一张名单的镜像）
  computeFreeLand();
  for (const k in FREE_M) G.unlocked[k] = true;

  // 武将文字池：每局洗一次，发完就没有了
  G.charPool = shuffleInPlace(HERO_CHAR_POOL0.slice());

  // 开局手牌全空：5 格留着虚框，玩家点一次「征兵」才有牌。
  // 第一手固定 5 馒头（开局 8 馒头够付），之后每征一次 +1。
  // 电脑同一套规则：空手牌 -> 第一个 aiTick 就自己征一次，不会白站着。
  G.hand = new Array(HAND_N).fill(null);
  G.ai.hand = new Array(HAND_N).fill(null);
  refreshBonds();
  return G;
}

/* ---------------- 羁绊结算 ---------------- */
function activeHeroNames(){
  const s = {};
  for (const u of G.board) if (u && u.kind==='hero') s[u.type] = true;
  return s;
}
/* ---------------- 羁绊与被动：一份公式，两种归属 ----------------
   以前 bondAtk/bondDef/bondRegen/globalAtk/mantouMul 各有一套 ai 版本，
   10 个函数抄两遍，改一边忘一边就会出现「电脑羁绊不生效」这种暗坑。
   现在全部收成 bondMul(kind, mine) 与 atkMulOf/mantouMulOf(who)。 */
function refreshBondsOf(mine){
  const have = mine ? activeHeroNames() : {};
  if (!mine) for (const u of G.enBoard) if (u && u.kind === 'hero') have[u.type] = true;
  const on = {};
  for (const b of BONDS) if (b.need.every(n => have[n])) on[b.id] = true;
  if (mine) G.bondOn = on; else G.aiBondOn = on;
}
function refreshBonds(){ refreshBondsOf(true); }
function refreshAiBonds(){ refreshBondsOf(false); }
function bondMul(kind, mine){
  const on = (mine ? G.bondOn : G.aiBondOn) || {};
  let m = (kind === 'regen') ? 0 : 1;
  for (const b of BONDS) if (on[b.id] && b[kind]) m += b[kind];
  return m;
}
function bondAtk(){ return bondMul('atk', true); }
function bondDef(){ return bondMul('def', true); }
function bondRegen(){ return bondMul('regen', true); }
function aiBondAtk(){ return bondMul('atk', false); }
function aiBondDef(){ return bondMul('def', false); }
function aiBondRegen(){ return bondMul('regen', false); }
function globalAtk(){
  let m = bondMul('atk', true);
  if (G.passive.bingshu) m += 0.20;
  return m;
}
function mantouMul(){
  const p = G.passive;
  let m = 1;
  if (p.nongmin) m += 0.35;
  if (p.liangcao) m += 0.20;
  return m;
}
/* 电脑版：与上面两个函数一字不差，只换了归属 */
function aiAtkMul(){ return bondMul('atk', false) + (G.ai.passive.bingshu ? 0.20 : 0); }
function aiMantouMul(){
  const p = G.ai.passive;
  let m = 1;
  if (p.nongmin) m += 0.35;
  if (p.liangcao) m += 0.20;
  return m;
}

/* ============================================================
   提示 / 飘字
   ============================================================ */
function toast(msg){ G.toast = msg; G.toastT = 1.7; }
function floater(x, y, text, color){
  G.floaters.push({ x, y, text, color: color || INK, t:0, dur:0.95 });
}
function burst(x, y, n, color){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = rnd(30,140);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 40, t:0, dur:rnd(.35,.7),
                   r:rnd(2,5), color: color || INK });
  }
}

/* ============================================================
   征兵 / 手牌
   ============================================================ */
/* 征兵发牌：铲子 / 单字 / 1 级兵 三种。
   一律只发 1 级兵 —— 升阶是玩家自己叠出来的，不是抽出来的：
   手里凭空冒出一张 2、3 级牌，会让「合成」这条主线变得没意义，
   也会让脸黑的玩家整局 1 级打 3 级。双方同一条发牌表。 */
function rollTile(){
  const r = gRnd();
  if (r < SHOVEL_RATE) return { kind:'shovel' };
  if (gRnd() < 0.30){
    const ch = pickHeroChar();
    if (ch) return { kind:'char', char: ch };     // 池子空了就改发兵
  }
  return { kind:'unit', type: pick(BASE_KEYS), level: 1 };
}

/* 摸一张武将单字：从本局的字池里拿，拿走就没了。
   手里已经攥着半个名字时，优先补它的另一半（手感上「快凑齐了」），
   但另一半如果早被别人摸走了，就只能摸别的 —— 池子是硬约束。 */
function pickHeroChar(){
  if (!G.charPool || !G.charPool.length){
    refillPool();
    toast('字池摸空 · 重新洗入 24 张');
  }
  const held = [];
  for (const t of G.hand) if (t && t.kind==='char') held.push(t.char);
  for (const u of G.board) if (u && u.kind==='char') held.push(u.char);

  if (held.length && gRnd() < 0.66){
    const cand = [];
    for (const c of held){
      for (const n of GOLD_HEROES){
        const h = HEROES[n];
        if (h.a === c && G.charPool.indexOf(h.b) >= 0) cand.push(h.b);
        if (h.b === c && G.charPool.indexOf(h.a) >= 0) cand.push(h.a);
      }
    }
    if (cand.length){
      const c = pick(cand);
      if (takePoolChar(c)) return c;
    }
  }
  return drawPoolChar(gRnd() < (G.passive.zhaoxian ? 0.88 : 0.74));
}

/* 旧字牌回收价值：等级越高回收越多（原版：点征兵会自动回收旧兵） */
function recycleValue(t){
  if (!t) return 0;
  if (t.kind === 'unit')  return 1 + (t.level - 1) * 2;   // 卒1 士3 校5 尉7 将9
  if (t.kind === 'hero')  return 2 + (t.level - 1) * 2;   // 名将 2/4/6
  if (t.kind === 'char')  return 1;
  return 1;                                               // 铲子
}

/* 遣散棋盘上的守军，按回收价折成馒头（headless 数据模式的 recycle 命令走这里，
   价目与征兵折算同一张表 recycleValue） */
function recycleCell(idx){
  const u = G.board[idx];
  if (!u) return 0;
  const v = recycleValue(u);
  clearCells(G.board, idx);
  refreshBonds();
  G.mantou += v;
  return v;
}

/* 兵营是「固定 5 个格子」，不是队列：用掉一格就留个空洞，
   后面的牌不会左移（以前用 splice 删，右边整排会滑过来，玩家以为牌被吃了）。
   往兵营里放牌一律走这里：先补空洞，满了才算放不下。 */
function handAdd(t){
  if (!t) return false;
  for (let i = 0; i < HAND_N; i++){
    if (!G.hand[i]){ G.hand[i] = t; return true; }
  }
  return false;
}
function handHasRoom(){
  for (let i = 0; i < HAND_N; i++) if (!G.hand[i]) return true;
  return false;
}

/* 征兵：一次性把兵营 5 个格子全部刷新（旧牌自动回收成馒头） */
/* 自家路上某一格的中心；这一格是不是还空着（一格只站一个待命兵） */
function roadCellPos(cell, mine){
  const baseY = mine ? Y_MINE : Y_ENEMY;
  return { x: cellCX(colOf(cell)), y: cellCY(colOf(cell), rowOf(cell), baseY) };
}
function roadCellFree(cx, cy){
  for (const m of G.marchers){
    if (Math.hypot(m.x - cx, m.y - cy) < CELL * 0.62) return false;
  }
  return true;
}
/* 自家路上还能站几个待命兵（出兵格不算，它必须空着） */
function freeRoadSlots(owner){
  const mine = owner !== 'ai';
  const cells = mine ? PATH_CELLS_M : PATH_CELLS_E;
  let n = 0;
  for (let k = 1; k < cells.length; k++){
    const p = roadCellPos(cells[k], mine);
    if (roadCellFree(p.x, p.y)) n++;
  }
  return n;
}
/* 把兵营里的一张牌送上路（从路尾往前找空位，一格一个）：
   兵 —— 原兵种、原阶直接排进队列，不打折；
   字 —— 字本身 1 血不能打，换成一个随机 1 级兵再上路；
   名将 / 铲子 —— 上不了路（名将占两格），返回 null，由调用方折馒头。 */
function sendTileToRoad(owner, tile){
  if (!tile) return null;
  let key = null, lv = 1;
  if (tile.kind === 'unit'){ key = tile.type; lv = tile.level || 1; }
  else if (tile.kind === 'char'){ key = pick(BASE_KEYS); lv = 1; }
  else return null;
  const mine = owner !== 'ai';
  const cells = mine ? PATH_CELLS_M : PATH_CELLS_E;
  for (let k = cells.length - 1; k >= 1; k--){
    const cell = cells[k];
    const p = roadCellPos(cell, mine);
    if (!roadCellFree(p.x, p.y)) continue;
    const m = spawnRaider(mine ? 'me' : 'ai', cell, key, lv);
    if (m){ burst(m.x, m.y, 12, mine ? GOLD : SEAL); return m; }
  }
  return null;
}
/* 旧名字：只送一个「字」上路（别的调用点还在用） */
function sendCharToRoad(owner){ return sendTileToRoad(owner, { kind:'char' }); }

/* 征兵的核心：把某一侧兵营的 5 格一次性刷新。
   规则（两侧一字不差）：
     1) 兵营里的牌先全部「上路」—— 兵保留兵种与阶，字换成随机 1 级兵；
     2) 上不了路的（名将占两格、铲子不是兵）或者路挤满放不下的，折成馒头；
     3) 判定看净支出：馒头 + 折价 >= 标价才动手，动手才涨价。 */
function enlistSide(mine){
  const S = sideInfo(mine);
  const hand = S.hand;
  const cost = mine ? G.enlistCost : G.ai.cost;
  const roll = mine ? rollTile : aiRollTile;

  // 先规划：按手牌顺序分配「上路」名额，剩下的折馒头
  let free = freeRoadSlots(mine ? 'me' : 'ai');
  const plan = [];
  let refund = 0;
  for (const t of hand){
    if (!t){ plan.push(0); continue; }
    const canRoad = (t.kind === 'unit' || t.kind === 'char') && free > 0;
    if (canRoad){ free--; plan.push(1); }      // 1 = 上路
    else { plan.push(2); refund += recycleValue(t); }   // 2 = 折馒头
  }
  if (moneyOf(mine) + refund < cost) return { ok:false, sent:0, refund:0 };

  let sent = 0, folded = 0;
  for (let i = 0; i < hand.length; i++){
    const t = hand[i];
    if (!t) continue;
    hand[i] = null;
    if (plan[i] === 1 && sendTileToRoad(mine ? 'me' : 'ai', t)) sent++;
    else folded += recycleValue(t);          // 路挤满了 / 本来上不了路
  }

  addMoney(mine, -cost + folded);
  hand.length = 0;
  for (let i = 0; i < HAND_N; i++) hand.push(roll());
  if (mine) G.enlistCost += 1; else G.ai.cost += 1;
  return { ok:true, sent, refund: folded };
}
function moneyOf(mine){ return mine ? G.mantou : G.ai.mantou; }
function addMoney(mine, v){ if (mine) G.mantou += v; else G.ai.mantou += v; }

function enlist(){
  if (G.phase !== 'battle' && G.phase !== 'prep') return;
  const r = enlistSide(true);
  if (!r.ok){ toast('馒头不够 · 杀敌才有军费'); sfx('hit'); return; }
  sfx('enlist');
  if (NET.pvp) netPushSide();
  const bits = [];
  if (r.sent) bits.push(r.sent + ' 张上路人列队');
  if (r.refund > 0) bits.push('折 +' + r.refund + ' 馒头');
  toast('征兵 · 刷新 5 格' + (bits.length ? '（' + bits.join(' · ') + '）' : ''));
}

/* ============================================================
   棋盘操作：放置 / 合成 / 开垦
   ============================================================ */
function tileChar(t){
  if (t.kind === 'shovel') return '铲';
  if (t.kind === 'char') return t.char;
  if (t.kind === 'hero') return t.type;
  const u = UNITS[t.type] || FUSE[t.type];
  return u ? u.char : '?';
}
function tileLabel(t){
  if (t.kind === 'unit'){ const u = UNITS[t.type] || FUSE[t.type]; return u.name; }
  if (t.kind === 'char')  return '武将单字';
  if (t.kind === 'hero')  return t.type;
  return '铲子';
}

// 两个物件能否合成，返回合成结果或 null
function tryCombine(a, b){
  // 武将单字 + 武将单字 -> 名将
  if (a.kind === 'char' && b.kind === 'char'){
    let found = null;
    for (const n in HEROES){
      const h = HEROES[n];
      if ((h.a === a.char && h.b === b.char) || (h.a === b.char && h.b === a.char)){ found = n; break; }
    }
    if (found) return { kind:'hero', type:found, level:1 };
    return null;
  }
  // 名将 + 同名名将 -> 升阶
  if (a.kind === 'hero' && b.kind === 'hero' && a.type === b.type && a.level === b.level){
    if (a.level >= HERO_MAXLV[HEROES[a.type].r]) return null;
    return { kind:'hero', type:a.type, level: a.level + 1 };
  }
  // 普通兵：同种 + 同阶才能合，结果 +1 阶（1+1=2、2+2=3 …）。
  // 曾经允许「阶差 ≤1」也能合，结果是 1级+2级 直接变 3 级 ——
  // 玩家看到的是「同一手牌有时能合、有时不能」，而 2+3 又只给 4 级，
  // 跟自己数出来的账对不上。规则只留一条：两个一模一样的东西叠起来升一阶。
  if (a.kind === 'unit' && b.kind === 'unit'){
    if (a.type === b.type && a.level === b.level){
      const lv = a.level + 1;
      if (lv > MAX_TIER) return null;
      return { kind:'unit', type:a.type, level: lv };
    }
    // 异字合成（默认关闭，见 FUSE_ON）
    if (FUSE_ON && a.level === b.level && a.level === 1){
      const k = fuseKey(a.type, b.type);
      if (k) return { kind:'unit', type:k, level:1 };
    }
  }
  return null;
}

function toUnitObject(t, cell, cells){
  if (t.kind === 'char') return { kind:'char', char:t.char, hp:1, maxHp:1, level:0, cell, cells:[cell], born:0 };
  if (t.kind === 'hero') return newUnit(t.type, t.level, cell, cells);
  if (t.kind === 'unit') return newUnit(t.type, t.level, cell, cells);
  return null;
}

/* 把来源物件放到目标格（idx）
   成功时由本函数负责清掉来源格（棋盘来源），onUp 不再处理棋盘清除
   返回：shovel-used | shovel-no | place | merge | swap | fail */
function dropOnCellRaw(src, idx){
  const c = colOf(idx), r = rowOf(idx);
  const dst = G.board[idx];
  const from = src.__fromBoard;

  if (isAduCell(idx, true)){ toast('这是主公的位置 · 不能布防'); sfx('hit'); return 'fail'; }

  // 铲子开垦（放在最前面：路格本来就不能开垦，但也别回一句「只有普通兵能上路出击」）
  if (src.kind === 'shovel'){
    if (isRoad(idx, true)){ toast('路和出兵点不能开垦'); sfx('hit'); return 'shovel-no'; }
    if (!dst && !G.unlocked[idx]){ G.unlocked[idx] = true; sfx('merge'); burst(cellCX(c), cellCY(c,r,Y_MINE), 12, GRASS); toast('开垦一格 · 已开 ' + Object.keys(G.unlocked).length + ' 格'); return 'shovel-used'; }
    if (G.unlocked[idx]) toast('这块地已经开垦过了'); else toast('这格已经占着了');
    sfx('hit');
    return 'shovel-no';
  }

  // 路格：普通兵可以上路。上路的兵不再算守军，而是先在路上列队，等下一波随军出击。
  // 名将占两格、单字只有 1 血，都不适合上路，挡在门口说明白。
  // 来源既可以是手牌，也可以是已经摆在格子上的兵 —— 把后排的兵挪到路上参战。
  if (isPathCell(idx, true)){
    if (src.kind !== 'unit'){ toast('只有普通兵能上路 · 名将与单字留在后半场'); sfx('hit'); return 'fail'; }
    if (idx === PATH_CELLS_M[0]){ toast('出兵格要空着 · 兵排它后面一格起'); sfx('hit'); return 'fail'; }
    const m = spawnRaider('me', idx, src.type, src.level);
    if (!m){ toast('这一格不适合出击'); sfx('hit'); return 'fail'; }
    if (from !== undefined){ clearCells(G.board, from); refreshBonds(); }
    const u = UNITS[src.type];
    burst(m.x, m.y, 14, GOLD);
    floater(m.x, m.y - 26, '上路 · 向出兵格排队', GOLD);
    sfx('enlist');
    toast(from !== undefined
      ? ('调兵 · ' + (u ? u.name : '兵') + ' 上路，正赶去出兵格后面排队，下一波随军出击')
      : ('上路 · ' + (u ? u.name : '兵') + ' 沿路赶去出兵格后面排队，下一波随军出击'));
    return 'place';
  }

  if (!G.unlocked[idx]){ toast('先用铲子开垦这块地'); sfx('hit'); return 'fail'; }

  // 拖回自己身上 -> 什么都不做（否则会白升一阶）
  if (from !== undefined && dst && G.board[from] === dst) return 'fail';

  // ---------- 合成 ----------
  const comb = dst ? tryCombine(src, dst) : null;

  if (comb && comb.kind === 'hero'){
    // 名将横占两个相邻格
    const allow = [idx];
    if (dst && dst.cells) for (const i of dst.cells) allow.push(i);
    if (from !== undefined) allow.push(from);
    const span = findHeroSpan(idx, G.board, true, allow);
    if (!span){ toast('名将横占两格 · 请留出一个相邻空格'); sfx('hit'); return 'fail'; }
    // 清掉不在 span 里的旧格（来源 / 被合成的名将另一半）
    if (from !== undefined && span.indexOf(from) < 0) clearCells(G.board, from);
    if (dst && dst.cells) for (const i of dst.cells) if (span.indexOf(i) < 0) G.board[i] = null;
    const nb = newUnit(comb.type, comb.level, span[0], span);
    nb.born = 0;
    for (const i of span) G.board[i] = nb;
    const cx = (cellCX(colOf(span[0])) + cellCX(colOf(span[1]))) / 2;
    const row = rowOf(span[0]);
    const cy = cellCY(colOf(span[0]), row, Y_MINE);
    burst(cx, cy, 30, GOLD);
    floater(cx, cy - 34, comb.type + '！', GOLD);
    sfx('hero');
    toast('名将归位 · ' + comb.type + '「' + HEROES[comb.type].sk + '」横占两格');
    refreshBonds();
    return 'merge';
  }

  if (comb){
    if (from !== undefined) clearCells(G.board, from);
    const nb = toUnitObject(comb, idx);
    nb.born = 0;
    G.board[idx] = nb;
    const cx = cellCX(c), cy = cellCY(c, r, Y_MINE);
    const isHero = comb.kind === 'hero';
    burst(cx, cy, isHero ? 26 : 14, isHero ? GOLD : SEAL);
    floater(cx, cy - 28, isHero ? (comb.type + '！') : (comb.level + ' 阶 · 攻↑ 速↑'),
            isHero ? GOLD : TIER[comb.level].tc);
    sfx(isHero ? 'hero' : 'merge');
    if (isHero) toast('名将归位 · ' + comb.type + '「' + HEROES[comb.type].sk + '」');
    refreshBonds();
    return 'merge';
  }

  // ---------- 空位放下 ----------
  if (!dst){
    const isHero = src.kind === 'hero';
    if (isHero){
      const span = findHeroSpan(idx, G.board, true, from !== undefined ? [from] : []);
      if (!span){ toast('名将横占两格 · 请留出一个相邻空格'); sfx('hit'); return 'fail'; }
      if (from !== undefined && span.indexOf(from) < 0) clearCells(G.board, from);
      const nb = newUnit(src.type, src.level, span[0], span);
      nb.born = 0;
      for (const i of span) G.board[i] = nb;
      refreshBonds(); sfx('click');
      return 'place';
    }
    if (from !== undefined) clearCells(G.board, from);
    G.board[idx] = toUnitObject(src, idx);
    refreshBonds(); sfx('click');
    return 'place';
  }

  // ---------- 换位：合并不成立时，拖过来的牌和格子上的守军对调 ----------
  if (dst){
    if (src.kind === 'unit' && dst.kind === 'unit')
      toast('合不了 · 只能同种同阶相叠（1+1 → 2 阶）');
    if (src.kind === 'hero'){ toast('名将占两格 · 不能和别人换位置'); sfx('hit'); return 'fail'; }
    // 名将也能被「换字」：手里的字落到名将的半格上，那半格的字收回兵营，带来的字顶上。
    // 关兴的「兴」格上落一个「羽」→ 兴进兵营，关+羽 相邻，落子后的 autoFormHeroes 立刻拼回关羽。
    if (dst.kind === 'hero'){
      if (from !== undefined){ toast('要换名将的字 · 从兵营里拖字过来'); sfx('hit'); return 'fail'; }
      const h = HEROES[dst.type];
      const i0 = dst.cells ? dst.cells[0] : idx, i1 = dst.cells ? dst.cells[1] : idx;
      if (!h || (idx !== i0 && idx !== i1)){ toast('名将占两格 · 不能和别人换位置'); sfx('hit'); return 'fail'; }
      const outChar = (idx === i0) ? h.a : h.b;          // 被顶掉的那半
      const keepCell = (idx === i0) ? i1 : i0;           // 另一半留在原格，退回单字
      const keepChar = (idx === i0) ? h.b : h.a;
      G.board[i0] = null; G.board[i1] = null;
      G.board[keepCell] = { kind:'char', char:keepChar, hp:1, maxHp:1, level:0,
                            cell:keepCell, cells:[keepCell], born:0 };
      G.board[idx] = toUnitObject(src, idx);
      if (handAdd({ kind:'char', char: outChar })) toast('换字 ·「' + outChar + '」收进兵营');
      else { G.mantou += 1; toast('兵营满了 ·「' + outChar + '」折成 1 馒头'); }
      refreshBonds(); sfx('click');
      return 'swap';
    }
    const moving = toUnitObject(src, idx);
    if (!moving){ toast('这两个字合不到一起'); sfx('hit'); return 'fail'; }
    if (from !== undefined){
      // 棋盘上的两件对调
      clearCells(G.board, from);
      G.board[from] = dst; dst.cell = from; dst.cells = [from];
      G.board[idx] = moving;
    } else {
      // 手牌落到已有守军的格子上：那位守军收回兵营
      G.board[idx] = moving;
      if (handAdd(dst)) toast('换位 · ' + tileLabel(dst) + ' 收进兵营');
      else toast('换位 · 兵营满了，' + tileLabel(dst) + ' 直接遣散');
    }
    refreshBonds();
    sfx('click');
    return 'swap';
  }

  toast('这两个字合不到一起');
  sfx('hit');
  return 'fail';
}

/* 落子统一入口：只要真的动了棋盘（放下 / 合成 / 换位），落完再扫一遍
   「同一排挨着的两张单字自动拼成名将」，玩家不用把第二个字拖到第一个字上 */
function dropOnCell(src, idx){
  const res = dropOnCellRaw(src, idx);
  if (res === 'place' || res === 'merge' || res === 'swap'){
    autoFormHeroes(G.board, true);
    ensureMyBuffs();          // 新落地的守军立刻吃到我方加成（不必等下一帧）
  }
  if (NET.pvp && res !== 'fail' && res !== 'shovel-no') netPushSide();
  return res;
}

/* ============================================================
   波次 / 敌兵
   ============================================================ */
/* 敌方来兵的品阶：每 4 波 +1，封顶 5 阶。
   品阶就是唯一的强度曲线 —— 删掉 ENEMY 表以后，不再有单独的「敌兵血量成长公式」。 */
function waveTier(n){ return clamp(1 + Math.floor((n-1)/4), 1, MAX_TIER); }

/* 出征兵的系数：同一套兵种，两边都吃这个数。
   想整体调难度就动这一个旋钮 —— 但一旦不等于 1，两边就不再对称了。
   只压血与攻，不压出手速度（攻速是兵种属性，出征不打折）。 */
const MARCH_SCALE = 1;
/* 行军兵的血量补偿：兵在路上只顾赶路，攻击力基本没机会打出来，
   作为补偿给一点肉 —— 原来是 ×2（等于凭空多一整个品阶，波次直接打不动），
   现在只 +10%：够表达「路上更耐打」，又不至于让守军打不动兵。 */
const MARCH_HP_MUL = 1.1;
/* 17 波之后单兵品阶封顶 5 阶，若只加数量两边会无限对峙。
   改为「精锐化」：17 波起每波血 +30%、移速 +20%（按超出 16 的波数叠乘），
   一波比一波快且硬，必然分出胜负。 */
const ELITE_FROM = 17, ELITE_HP = 1.3, ELITE_SPD = 1.2;

/* 行军速度的全局倍率：兵种表里的 spd 就是「格/秒」，这里给一个全局系数。
   以前是 0.5（刀兵实际只走 0.5 格/秒），一条 20 格的路要 40 秒，
   兵几乎是站在弓箭射程里被慢慢磨死的 —— 也是「漏头就秒」的一半原因。
   现在放回 1.0：刀兵 1 格/秒、骑兵 1.55 格/秒，与面板显示的数字一致，
   穿场时间 20 秒上下，玩家照样有时间补防。 */
const MOVE_MUL = 0.8;                       // 全场移速 -20%：过场 25 秒上下，守军有更多输出时间

/* 自动进攻兵的路：从 pts[k] 之后一路走到对面主公 */
function forwardRoute(pts, k, adu){
  const r = [];
  for (let i = k + 1; i < pts.length; i++) r.push(pts[i]);
  r.push({ x: adu.x, y: adu.y });
  return r;
}
/* 出击兵的路：先沿自己半场的路往回走到中缝，过缝后沿对面半场的路打到对面主公。
   两张图是上下镜像的，所以「过缝」是同列垂直跨过去，不会横跳。 */
function raiderRoute(halfMine, k){
  const own = pathPoints(halfMine);
  const oth = pathPoints(!halfMine);
  const adu = halfMine ? ADU_E : ADU_M;
  const r = [];
  for (let i = k - 1; i >= 0; i--) r.push(own[i]);
  r.push(oth[0]);
  for (let i = 1; i < oth.length; i++) r.push(oth[i]);
  r.push({ x: adu.x, y: adu.y });
  return r;
}

/* 每波：上下两块战场各收到一支同强度的进攻部队（一轮对攻） */
/* 批内出兵间隔：一批里几个兵隔多久出一个（铺得均匀一点，别挤成一坨）。
   间距跟着 MOVE_MUL 走 —— 兵走得慢了，出兵也得拉长，
   不然同一点上会摞四五个兵，看着像一坨。 */
function spawnGapOf(n){ return clamp((0.72 - n*0.028) / MOVE_MUL, 0.5, 1.6); }
/* 某一侧这一波的敌兵清干净了吗：先要「这一波已经出完」，再要「场上没有还没打完的敌兵」。
   排队待命的兵（queued）还没出击，不算在对面这一波里。
   两边用同一个函数 —— 谁清得快谁就能把全场的节奏往前拽。 */
function waveClearedFor(mine){
  const S = sideInfo(mine);
  const left = mine ? G.spawnLeft : G.aiSpawnLeft;
  if (left > 0) return false;                 // 这一波还没出完
  for (const m of G.marchers){
    if (m.owner !== S.foe || m.queued) continue;
    return false;                             // 还有敌兵在场上
  }
  return true;
}
function startWave(early){
  G.wave++;
  G.waveT = 0;
  // 开战的同时放行上一波之间攒下的待命兵：它们跟着这一波一起压上去
  G.qReleased = false;                 // 联机：raid 迟到兜底的判定标记
  const freed = releaseQueue();
  // 注意：这里**不能**把征兵费重置回 5 —— 原来就是这一行让成本涨不上去的。
  // 现在征兵费只升不降：开局 5，每征一次 +1，越到后期越贵。
  if (G.passive.luoyang) handAdd({ kind:'shovel' });
  if (G.ai.passive.luoyang) G.ai.hand.push({ kind:'shovel' });
  const n = G.wave;
  const lv = waveTier(n);
  // 每批的兵力：3 + 2×波次 → 第 1 波 5 个、第 2 波 7 个、第 3 波 9 个……
  // （原来是 7+n：第 1 波就是 8 个，开局 5 个 1 阶守军怎么摆都守不住）
  const count = 3 + 2*n;
  // 批内出兵间隔：上下半场用同一条曲线，铺得均匀一点
  const gap = spawnGapOf(n);

  // 两条线同时开：我的半场收敌方来兵，电脑半场收我方自动进攻兵（同一支队伍、同一套兵）
  G.spawnQueue = []; G.spawnLeft = count; G.spawnGap = gap;
  G.aiSpawnQueue = []; G.aiSpawnLeft = count; G.aiSpawnGap = gap;
  for (let i=0;i<count;i++){
    G.spawnQueue.push(enemySpec(n, i, 0));
    G.aiSpawnQueue.push(enemySpec(n, i, 1));
  }
  toast('第 ' + n + ' 波 · 双方同时开战（' + lv + ' 阶兵）'
        + (early ? ' · 速清提前' : '')
        + (freed ? ' · 待命 ' + freed + ' 兵随军出击' : ''));
  /* 速清提前开波：单机是「任一方清干净了两边一起开」。联机里两边各自判断，
     会各开各的 —— 波号一分叉，第 N 波的兵强度就对不上了。所以谁提前开就告诉对面。 */
  if (early && NET.pvp) netSend({ k:'wave', n });
  /* 联机唯一不开的是商店：开店会让本端时间整个冻住，对面却还在跑，
     两边波次就错开了（兵种由种子决定，波号一错两边来的兵就不一样强）。 */
  if (NET.pvp) return;
  // 商人随奇数波而至：第 3、5、7… 波开波前出现（第 1、2 波不来）。
  // 开店时 step 会整帧冻结，所以这一波实际上是从「买完之后」才开始出兵。
  if (n >= 3 && n % 2 === 1) openShop();
}

/* 一波里出什么兵：四个基础兵，权重从「刀枪为主」慢慢过渡到「四兵混编」。
   强度不在这里调 —— 那是 waveTier / MARCH_SCALE 的事。
   随机源：单机没种子 → 真随机（跟以前一样）；联机有种子 → 由 (波次, 序号, 线)
   直接算出来。这样两端各跑各的，同一波第 i 个兵一定是同一个兵，不靠时序。 */
function waveRnd(n, i, salt){
  const s = (G && G.seed !== null && G.seed !== undefined) ? (G.seed >>> 0) : 0;
  let x = s ^ Math.imul(n + 1, 0x9e3779b1)
        ^ Math.imul(i + 1, 0x85ebca6b) ^ Math.imul(salt + 1, 0xc2b2ae35);
  x = Math.imul(x ^ (x >>> 15), 0x2545f491);
  x ^= x >>> 13;
  return ((x >>> 0) % 100003) / 100003;
}
function enemySpec(n, i, salt){
  const lv = waveTier(n);
  // 每局都有种子 → 来兵序列与两端时序无关（联机同种子必然同兵，回放也一致）
  const seeded = !!(G && G.seed !== null && G.seed !== undefined);
  const r = seeded ? waveRnd(n, i | 0, salt | 0) : gRnd();
  let key;
  if (n <= 2)      key = r < 0.55 ? 'dao' : (r < 0.85 ? 'qiang' : (r < 0.95 ? 'gong' : 'qi'));
  else if (n <= 5) key = r < 0.34 ? 'dao' : (r < 0.62 ? 'qiang' : (r < 0.84 ? 'gong' : 'qi'));
  else             key = r < 0.28 ? 'dao' : (r < 0.52 ? 'qiang' : (r < 0.76 ? 'gong' : 'qi'));
  // 17 波起每波 +1 层精锐（血 ×1.3、移速 ×1.2 叠乘）
  return { key, lv, elite: Math.max(0, n - (ELITE_FROM - 1)) };
}

/* ---------------- 行军兵（双方共用一套） ----------------
   owner:'ai' = 电脑的兵，从我的半场路头下来，打我的主公
   owner:'me' = 我方的出击兵，从路上朝对面走，打电脑的主公
   兵种、品阶、克制、血量、攻击全走 UNITS / TIER 同一张表 —— 两边没有任何数值差。 */
function newMarcher(owner, key, level, elite){
  const u = UNITS[key];
  if (!u) return null;
  const lv = clamp(level || 1, 1, MAX_TIER);
  const st = TIER[lv];
  const k = MARCH_SCALE;                     // 两边同一个系数，不按 owner 分叉
  const el = Math.max(0, elite | 0);         // 17 波后的精锐层数
  const hp = Math.round(u.hp * st.hpMul * k * MARCH_HP_MUL * Math.pow(ELITE_HP, el));
  return {
    owner, key, level: lv, elite: el, char: u.char,
    name: u.name + (el ? '+' + el : ''), vs: u.vs || [], hitMode: u.hitMode || 'single',
    hp, maxHp: hp,
    atk: u.atk * st.atkMul * k,
    rate: u.rate * st.rateMul,
    range: u.range, spd: u.spd * CELL * MOVE_MUL * Math.pow(ELITE_SPD, el), w: u.w, mantou: u.mantou,
    x: 0, y: 0, route: [], ri: 0,
    cd: 0, stun: 0, slowT: 0, hurt: 0, flash: 0, born: 0,
    jit: (Math.random() - 0.5) * 9,
  };
}
/* 自动进攻兵：owner 的兵从自己这一侧的路头出生，沿路走向对面的主公 */
function spawnWave(owner, spec){
  const m = newMarcher(owner, spec.key, spec.lv, spec.elite);
  if (!m) return null;
  const halfMine = owner === 'ai';            // 敌兵走我的半场；我的进攻兵走对面半场
  const pts = pathPoints(halfMine);
  const adu = halfMine ? ADU_M : ADU_E;
  m.x = pts[0].x; m.y = pts[0].y;
  m.route = forwardRoute(pts, 0, adu);
  G.marchers.push(m);
  return m;
}
/* 放在路格上的兵 -> 待命兵：沿自家这条路往「出兵格」方向走，一格一个往后排，
   排头站出兵格的**下一格**（出兵格永远留空，给下一波出兵让位）；
   下一波开战时（startWave）统一放行，跟着这一波一起越过中缝打过去。
   排队中的兵照样会跟迎面上来的敌兵互殴 —— 站在路上就是一道人墙。
   在我方路上越往后越熟门熟路：每前进一格，行军速度翻一倍（封顶 8 倍）。 */
let RAIDER_SEQ = 0;                    // 入队顺序：同距离时先来的排前面
function spawnRaider(owner, cell, key, level){
  const halfMine = owner === 'me';
  const cells = halfMine ? PATH_CELLS_M : PATH_CELLS_E;
  const k = cells.indexOf(cell);
  if (k < 0) return null;
  if (k === 0) return null;              // 出兵格是出兵专用的，不许站兵
  const m = newMarcher(owner, key, level);
  if (!m) return null;
  const baseY = halfMine ? Y_MINE : Y_ENEMY;
  m.x = cellCX(colOf(cell));
  m.y = cellCY(colOf(cell), rowOf(cell), baseY);
  m.route = raiderRoute(halfMine, k);
  m.raider = true;
  m.originCell = cell;                   // 联机：真正出击时把这格报给对面派兵
  m.queued = true;                       // 待命：等下一波
  m.headRi = k - 1;                      // 出兵格在 route 里的下标（route[k-1] === 出兵格）
  m.seq = ++RAIDER_SEQ;                  // 入队顺序，只用于同距离时的先后
  G.marchers.push(m);
  return m;
}
/* 沿路到「出兵格」还剩多少距离（rank 用它排序，谁靠前谁占前面的格） */
function headRemain(m){
  let d = 0, x = m.x, y = m.y;
  for (let i = m.ri; i <= m.headRi; i++){
    const p = m.route[i];
    if (!p) break;
    d += Math.hypot(p.x - x, p.y - y);
    x = p.x; y = p.y;
  }
  return d;
}
/* 我在队列里排第几：离出兵格越近越靠前，同距离按上路先后 */
function queueRank(m){
  const dm = headRemain(m);
  let r = 0;
  for (const o of G.marchers){
    if (o === m || !o.queued || o.owner !== m.owner) continue;
    const d = headRemain(o);
    if (d < dm - 1e-6 || (Math.abs(d - dm) <= 1e-6 && o.seq < m.seq)) r++;
  }
  return r;
}
/* 沿路到 route[idx] 那一格的距离（防止一帧冲过头） */
function routeRemainTo(m, idx){
  let d = 0, x = m.x, y = m.y;
  for (let i = m.ri; i <= idx; i++){
    const p = m.route[i];
    if (!p) break;
    d += Math.hypot(p.x - x, p.y - y);
    x = p.x; y = p.y;
  }
  return d;
}
/* 我方路上：每前进一格速度翻一倍。
   起步就给 4 倍（本来 0.5 格/秒太磨人，走一格要 2.25 秒），封顶 32 倍 = 16 格/秒，
   一条 20 格的路从最末一格跑回出兵口也就 2 秒左右。 */
const OWN_PATH_SPD_BASE = 4;
const OWN_PATH_SPD_CAP = 32;
function ownPathSpeedMul(m){
  return Math.min(OWN_PATH_SPD_CAP, OWN_PATH_SPD_BASE * Math.pow(2, Math.max(0, m.ri)));
}
/* 开战：所有待命兵一起放行 */
function releaseQueue(){
  G.qReleased = true;
  let n = 0;
  for (const m of G.marchers){
    if (!m.queued) continue;
    m.queued = false; n++;
    burst(m.x, m.y, 6, m.owner === 'me' ? GOLD : SEAL);
    /* 联机：排队期间对面看不到这支兵，真正随军出击才报过去 ——
       对面收到后在镜像格生成同款兵，那才是这场遭遇战的「权威副本」。 */
    if (NET.pvp && m.owner === 'me' && m.raider)
      netSend({ k:'raid', cell:m.originCell, type:m.key, level:m.level, rid:++NET.seq });
  }
  return n;
}

/* 沿路推进：把 e 沿折线点往前走 dist 距离。
   capped=true 时永远走不完最后一段 —— 被守军拦住就绝对摸不到主公。
   返回 true 表示已经走到路的尽头（= 摸到主公）。 */
/* 敌兵当前所在的那一格（用来算「有没有守军贴在路边」） */

/* 守军是不是踩在「路」上（含主公格）。
   规则：只有路上的守军会被行军兵够到、被拦住；路外的守军＝后方火力，谁也打不到它。 */
function defenderOnRoad(u, idx, mine){
  for (const k of unitCells(u)) if (isRoad(k, mine)) return true;
  return isRoad(idx, mine);
}
/* 距离检索：找出离 (x,y) 最近、落在 range 内「某一侧」的守军。
   roadOnly = true 时只认踩在路上的守军 —— 行军兵够不到路外（后方阵地）的兵。
   两块棋盘共用这一个函数，唯一的参数是「查哪一侧」。 */
function nearestDefender(mine, x, y, range, roadOnly){
  const S = sideInfo(mine);
  let best = null, bd = 1e9;
  for (let i = 0; i < S.board.length; i++){
    const u = S.board[i];
    if (!u || u.kind === 'char' || u.hp <= 0) continue;
    if (!isAnchor(u, i)) continue;
    if (roadOnly && !defenderOnRoad(u, i, mine)) continue;
    const p = unitPos(u, S.baseY);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d <= range && d < bd){ bd = d; best = { u, x: p.x, y: p.y, idx: i, d }; }
  }
  return best;
}
function nearestMyUnit(x, y, range, roadOnly){ return nearestDefender(true,  x, y, range, roadOnly); }
function nearestAiUnit(x, y, range, roadOnly){ return nearestDefender(false, x, y, range, roadOnly); }
/* 某一边的所有行军兵 */
function marchersOf(owner){ return G.marchers.filter(m => m.owner === owner); }
/* 距离检索：某个 owner 的行军兵（owner 省略 = 两边都算） */
function nearestMarcher(x, y, range, owner, half){
  let best = null, bd = 1e9;
  for (const m of G.marchers){
    if (m.hp <= 0) continue;
    if (owner && m.owner !== owner) continue;
    if (half === 'M' && m.y < MID1) continue;    // 只算我的半场
    if (half === 'E' && m.y > MID1) continue;    // 只算对面半场
    const d = Math.hypot(m.x - x, m.y - y);
    if (d <= range && d < bd){ bd = d; best = { u:m, x:m.x, y:m.y, d }; }
  }
  return best;
}

/* 贴脸拦停距离：只要守军贴着路边站着，敌军就会被拦下来原地厮杀。
   CELL=72，正交相邻两格心距 72、斜角 102 ——
   取 81 表示「紧贴路边的正交四格」拦得停，斜角拦不住（但斜角的兵照样打得到）。 */
const BLOCK_R = 81;
/* 被拦住时的推挤（GRIND）已经删掉：现在是硬规则 ——
   迎面有兵、或者贴脸有守军，走不动就是走不动，打死才能前进。 */
/* 正在交战的敌兵推进倍率：只要射程内还有我军守军，行军速度掉到这个比例。
   避免远程兵种（曹弓射程 250px ≈ 3.5 格）一边走一边射、还能满速滑过去 ——
   现在它必须停下来打，打完才继续走。被我军贴脸拦住时另有 GRIND 那套。 */
const ATK_MOVE_MUL = 0.18;

/* ---------------- 守军的加减成 ----------------
   原则：同一个兵种、同一个身份，两边必须一模一样。
   这三个系数全部 = 1 —— 以前是玩家单方面 血×2、受伤÷2、电脑出征兵×0.6，
   等于玩家几乎自带 4 倍有效血量，AI 只能靠波次曲线硬撑，属于用数值掩盖 AI 弱。
   要让电脑弱一点，去动 AI 的决策（aiTick 频率、布阵打分、征兵节奏），别再动这里。 */
const MY_HP_MUL     = 1;
const MY_DEF_MUL    = 1;
const MY_REGEN_IDLE = 5;      // 脱战回血：双方同一条规则
const MY_REGEN_PCT  = 0.30;
const MY_DEF_FLOOR  = 0.35;   // 与羁绊减伤共用的下限，别让减伤叠爆

/* 给新落地的守军补上加成。幂等：一个单位只会加一次（打 buff 标记）。
   两侧共用：mine 只是用来选棋盘，系数本身两边一模一样。
   放在 updateSideUnits 里每帧兜底，所以不管从哪条路径摆上棋盘都吃得到。 */
function ensureBuffs(mine){
  const S = sideInfo(mine);
  for (let i = 0; i < S.board.length; i++){
    const u = S.board[i];
    if (!u || u.kind === 'char' || u.buff) continue;
    u.buff = true;
    const ratio = u.maxHp > 0 ? u.hp / u.maxHp : 1;   // 换算而不是直接拉满
    u.maxHp = Math.round(u.maxHp * MY_HP_MUL);
    u.hp = Math.round(u.maxHp * ratio);
    u.idleT = 0;
    u.regenT = 0;
  }
}
function ensureMyBuffs(){ ensureBuffs(true); }


/* 沿路线往前走，返回 true 表示走到终点（= 摸到对面主公） */
function marchForward(m, dist){
  let guard = 0;
  while (dist > 1e-6 && m.ri < m.route.length && guard++ < 12){
    const t = m.route[m.ri];
    const dx = t.x - m.x, dy = t.y - m.y, d = Math.hypot(dx, dy);
    if (d <= dist){ m.x = t.x; m.y = t.y; m.ri++; dist -= d; }
    else { m.x += dx/d*dist; m.y += dy/d*dist; dist = 0; }
  }
  return m.ri >= m.route.length;
}
/* 一个行军兵被打死：击杀方拿馒头与战功（玩家杀进玩家的账，电脑杀进电脑的账） */
function killMarcher(m, killer){
  const i = G.marchers.indexOf(m);
  if (i >= 0) G.marchers.splice(i,1);
  if (killer === 'me'){
    // 基础 1 个馒头。这里**不取整**：农民/粮草这类被动给的是 +35%/+20%，
    // 一取整就永远是 1，被动等于白买。馒头可以是小数，HUD 与商店判定都按 floor 显示/比较。
    const gain = m.mantou * mantouMul();
    G.mantou += gain; G.kills++; G.merit++;
    floater(m.x, m.y - 18, '+' + (Math.round(gain*10)/10) + ' 馒头', GOLD);
    burst(m.x, m.y, 8, SEAL);
  } else {
    aiGain(m.mantou * aiMantouMul(), m.x, m.y);
    G.ai.kills++; G.ai.merit++;
  }
}
function damageMarcher(m, d, killer){
  if (!m || m.hp <= 0) return;
  /* 联机：我派出去的兵在本机只是「演出」，真正的伤害由对面算好推回来。
     本地一旦也扣血，两边就各有一套血量，画面上必然对不上。 */
  if (NET.pvp && m.owner === 'me') return;
  m.hp -= d; m.hurt = 1; m.flash = 0.25;
  if (m.hp <= 0) killMarcher(m, killer);
}
/* 两个行军兵迎面撞上：谁也不能过去，各打各的，死一个才放行。
   平局裁决用坐标而不是数组顺序 —— 两端 marchers 的先后可能不同（raid 到达顺序），
   目标选择必须只依赖两端一致的量（位置），否则多兵混战会各打各的目标。 */
function nearestFoeMarcher(m, r){
  let best = null, bd = r;
  for (const o of G.marchers){
    if (o === m || o.hp <= 0 || o.owner === m.owner) continue;
    const d = Math.hypot(o.x - m.x, o.y - m.y);
    if (d > bd + 1e-6) continue;
    if (best && d > bd - 1e-6){
      // 距离打平：按 y 再按 x 定序，两端得到同一个目标
      if (o.y > best.y + 1e-6 || (Math.abs(o.y-best.y) <= 1e-6 && o.x >= best.x)) continue;
    }
    bd = d; best = o;
  }
  return best;
}
/* 对撞专用扣血：不看到 owner。对撞由两端用同一套输入各自结算一遍，
   两边必然得到同一个结果（同时出手 → 同归于尽就是同归于尽），
   所以打在 ghost 身上的这份伤害是安全的 —— 它和对面的权威副本数值一致。 */
function damageMarcherDuel(m, d, killer){
  if (!m || m.hp <= 0) return;
  m.hp -= d; m.hurt = 1; m.flash = 0.25;
  if (m.hp <= 0) killMarcher(m, killer);
}
/* 行军兵打对面棋盘上的守军 */
function strikeDefender(m, tgt){
  if (m.cd > 0) return;
  m.cd = 1 / Math.max(0.3, m.rate);
  // 伤害 = 攻方攻击 × 攻方加成 ÷ 守方减伤（下限 MY_DEF_FLOOR），两边同一条公式
  const hitDef = (t) => {
    let d = m.atk * atkMulOf(m.owner) / Math.max(MY_DEF_FLOOR, defMulOf(foeOf(m.owner)));
    if (m.vs && t.u.type && m.vs.indexOf(t.u.type) >= 0) d *= 1.6;   // 克制对守军同样生效
    t.u.hp -= d; t.u.flash = 0.25; t.u.hurt = 1; t.u.idleT = 0;      // 挨打了就重置脱战计时（两边同规则）
    burst(t.x, t.y, 3, colorOf(m.owner));
    if (t.u.hp <= 0) killDefender(m.owner === 'ai', t.idx);
  };
  hitDef(tgt);
  // 穿刺沿「我 → 主目标」的方向捅穿一条线；范围把圈内守军全扫一遍
  const mode = hitModeOf(m);
  if (mode !== 'single'){
    const extra = splashByMarcher(m, tgt);
    for (const t of extra) if (t.u.hp > 0) hitDef(t);
    fxHit(mode, m.x, m.y, tgt.x, tgt.y, m.range + RANGE_PAD, colorOf(m.owner));
  }
  if (Math.random() < 0.24) sfx('hit');
}
/* 迎面撞上的判定距离：两格心距 72，取 46 表示「贴上了」就算顶住 */
const DUEL_R = 46;

/* 行军兵的统一主循环：两边的兵走同一套逻辑，只有方向与结算系数不同。
   推进优先级：迎面有敌兵 > 贴脸守军 > 射程内守军（边打边走）> 全速推进 */
function updateMarchers(dt){
  /* ---- 迎面对撞：先全员选目标，再同时出手，最后统一扣血 ----
     「同时出手」是对撞成立的关键：同一帧里双方互相打出的伤害一起生效，
     同归于尽就是同归于尽 —— 结果和遍历顺序无关，单机联机、两端各自模拟都一致。
     联机下我派出去的兵照样参与对撞：这份伤害两端各算一遍、输入完全相同
     （位置确定、被动已同步、无随机数），必然分毫不差。 */
  for (const m of G.marchers){
    m._duel = null;
    if (m.hp <= 0 || m.stun > 0) continue;
    m._duel = nearestFoeMarcher(m, DUEL_R);
  }
  const strikes = [];
  for (const m of G.marchers){
    const foe = m._duel;
    if (!foe || m.cd > 0) continue;
    m.cd = 1 / Math.max(0.3, m.rate);
    let d = m.atk * atkMulOf(m.owner);
    if (m.vs && m.vs.indexOf(foe.key) >= 0) d *= 1.6;
    strikes.push({ m, foe, d, extra: splashByMarcherDuel(m, foe), mode: hitModeOf(m) });
  }
  for (const s of strikes){
    burst(s.foe.x, s.foe.y, 2, colorOf(s.m.owner));
    damageMarcherDuel(s.foe, s.d, s.m.owner);
    for (const o of s.extra){          // 穿刺 / 范围：顺带把圈里线上的其它敌兵一起打
      let de = s.m.atk * atkMulOf(s.m.owner);
      if (s.m.vs && s.m.vs.indexOf(o.key) >= 0) de *= 1.6;
      damageMarcherDuel(o, de, s.m.owner);
    }
    if (s.mode !== 'single')
      fxHit(s.mode, s.m.x, s.m.y, s.foe.x, s.foe.y, s.m.range + RANGE_PAD, colorOf(s.m.owner));
  }

  for (let i = G.marchers.length-1; i >= 0; i--){
    const m = G.marchers[i];
    m.born += dt;
    m.hurt = Math.max(0, m.hurt - dt*3);
    m.flash = Math.max(0, (m.flash || 0) - dt);
    if (m.hp <= 0){ G.marchers.splice(i,1); continue; }
    if (m.stun > 0){ m.stun -= dt; continue; }
    let sp = m.spd;
    if (m.slowT > 0){ m.slowT -= dt; sp *= 0.4; }
    m.cd -= dt;
    if (m.cd < -0.4) m.cd = -0.4;

    // 1) 对面也有兵在同一条路上 -> 迎面顶住，必须打死对方才能继续前进
    //    （伤害在上面「同时出手」那一步已经结算过了；这里只负责站住不动）
    if (m._duel) continue;

    // 联机：我派出去的兵只在本机「走给人看」—— 打守军、掉血、扣命都由对面
    // 当作「我这半场的来兵」算完再呈现；本地只保留对撞（两端同输入同结果）。
    // 所以 ghost 兵不索敌守军、不出手打守军、到终点也不扣命。
    const ghost = NET.pvp && m.owner === 'me';

    // 2) 路上有守军顶着脸 -> 原地厮杀（拦停靠的是「路上的兵」，路外的兵不挡路）
    const defMine = m.owner === 'ai';        // 我要打的是对面那块棋盘上的守军
    const held = ghost ? null : nearestDefender(defMine, m.x, m.y, BLOCK_R, true);
    if (held){ strikeDefender(m, held); continue; }

    // 3) 射程内路上的守军 -> 边打边挪，打得起来就走得慢
    const far = ghost ? null : nearestDefender(defMine, m.x, m.y, m.range + RANGE_PAD, true);
    if (far) strikeDefender(m, far);

    // 4) 待命兵：按格子排队。排头站出兵格的下一格，第二人站再后一格 …… 一格一个人；
    //    出兵格永远留空。走到自己的格子就停，绝不越过中缝。
    //    我方路上每前进一格速度翻倍（ownPathSpeedMul），所以越排越快地归位。
    if (m.queued){
      const slot = m.headRi - 1 - queueRank(m);     // 该站的那一格（route 下标；-1 = 顶到出兵格前）
      if (slot >= 0 && m.ri <= slot){
        const rem = routeRemainTo(m, slot);
        if (rem > 0.5) marchForward(m, Math.min(sp * ownPathSpeedMul(m) * dt, rem));
        else { const p = m.route[slot]; m.x = p.x; m.y = p.y; m.ri = slot + 1; }
      }
      continue;
    }

    const adv = far ? sp * ATK_MOVE_MUL : sp;

    if (marchForward(m, adv * dt)){
      G.marchers.splice(i,1);
      if (!ghost) hitAdu(m.owner === 'ai' ? 'my' : 'en');
    }
  }
}
/* 守军阵亡：两块棋盘同一个出口。mine 只决定「清哪块盘、刷哪边的羁绊」。 */
function killDefender(mine, idx){
  const S = sideInfo(mine);
  const u = S.board[idx];
  if (!u) return;
  const p = unitPos(u, S.baseY);
  clearCells(S.board, idx);
  burst(p.x, p.y, 16, S.color);
  if (mine){ G.lostUnits = (G.lostUnits || 0) + 1; refreshBonds(); }
  else refreshAiBonds();
}
function killMyUnit(idx){ killDefender(true, idx); }

/* 主公挨打：一个兵换一滴血 —— 兵走到主公那一格就当场阵亡（updateMarchers 里先移除），
   主公这边固定掉 1 命，不补钱。没有无敌帧：3 个兵同时到就是掉 3 命。
   神兵符期间兵照样死，只是主公不掉血。 */
function hitAdu(side){
  const mine = side === 'my';
  if (mine ? G.aduShield > 0 : G.aiShield > 0) return;
  if (mine){
    G.myLife--; G.leaks++; G.aduHurtM = 0.45; sfx('lost');
    burst(ADU_M.x, ADU_M.y, 30, SEAL);
    floater(ADU_M.x, ADU_M.y - 58, '主公 −1 命', SEAL);
    if (G.myLife <= 0 && !NET.pvp) endGame(false);   // 联机：等房主统一裁决，不自己判
  } else {
    if (NET.pvp){                                    // 联机：对面的血由对面自己算并推过来
      G.aduHurtE = 0.45; sfx('hero');
      burst(ADU_E.x, ADU_E.y, 30, GOLD);
      floater(ADU_E.x, ADU_E.y - 58, '敌军触城', GOLD);
      return;
    }
    G.enLife--; G.aiLeaks++; G.aduHurtE = 0.45; sfx('hero');
    burst(ADU_E.x, ADU_E.y, 30, GOLD);
    if (G.enLife <= 0) endGame(true);
  }
}

/* ============================================================
   战斗：守军与守军索敌
   上下半场是同一套规则，唯一的输入是「这一侧是谁」。
   所有以前散在 updateMyUnits / updateAiUnits 两处的分叉都收进 sideInfo()，
   以后改一处就是改两边，不会再长出不对称。
   ============================================================ */
function sideInfo(mine){
  return mine ? {
    mine:true, who:'me', foe:'ai',
    board:G.board, hand:G.hand, passive:G.passive, actives:G.actives,
    atkMul:globalAtk(), defMul:bondDef(), regen:bondRegen(),
    baseY:Y_MINE, adu:ADU_M, foeAdu:ADU_E, color:GOLD, foeColor:SEAL,
  } : {
    mine:false, who:'ai', foe:'me',
    board:G.enBoard, hand:G.ai.hand, passive:G.ai.passive, actives:G.ai.actives,
    atkMul:aiAtkMul(), defMul:aiBondDef(), regen:aiBondRegen(),
    baseY:Y_ENEMY, adu:ADU_E, foeAdu:ADU_M, color:SEAL, foeColor:GOLD,
  };
}
/* 归属 -> 标量。热循环里不想每帧 new 个 sideInfo 对象时用这三个。 */
function atkMulOf(who){ return who === 'me' ? globalAtk() : aiAtkMul(); }
function defMulOf(who){ return who === 'me' ? bondDef()  : aiBondDef(); }
function foeOf(who){ return who === 'me' ? 'ai' : 'me'; }
function colorOf(who){ return who === 'me' ? GOLD : SEAL; }
/* 守军索敌：只看对面阵营的行军兵，且只打自己这半场 */
function unitTarget(u, mine){
  const S = sideInfo(mine);
  const p = unitPos(u, S.baseY);
  let best = null, bd = 1e9;
  for (const e of G.marchers){
    if (e.hp <= 0 || e.owner !== S.foe) continue;
    if (mine ? (e.y < MID1) : (e.y > MID1)) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d <= u.range + RANGE_PAD && d < bd){ bd = d; best = e; }
  }
  return best;
}
/* 守军打行军兵的伤害：攻击方加成 × 克制 ×1.6 */
function unitDmg(u, e, mine){
  let d = u.atk * sideInfo(mine).atkMul;
  if (u.vs && u.vs.indexOf(e.key) >= 0) d *= 1.6;
  return d;
}

/* ---------------- 伤害形态：单体 / 穿刺 / 范围 ----------------
   射程补半格（RANGE_PAD）：判定按「格心距」，而守军永远站在路旁一格外面 ——
   刀兵 1 格射程正好等于格心距，兵只在正对的那一瞬进圈，打一下就出去了（实际表现为「只打一次」）。
   补半格后「N 格」= 覆盖到第 N 层的整格，与范围圈的画法一致。 */
const RANGE_PAD = CELL * 0.5;
const PIERCE_HALF_W = 34;
function inCircle(ax, ay, bx, by, r){
  return Math.hypot(bx - ax, by - ay) <= r;
}
function inLine(ax, ay, bx, by, tx, ty, halfW, maxL){
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
  if (L < 1e-6) return false;
  const ux = dx / L, uy = dy / L;
  const px = tx - ax, py = ty - ay;
  const proj = px * ux + py * uy;
  if (proj <= 0) return false;                           // 在主目标反方向：不算
  if (maxL !== undefined && proj > maxL) return false;   // 超出射程：不算
  return Math.abs(px * -uy + py * ux) <= halfW;          // 横向偏移
}
/* 守军这一击的额外目标（不含主目标） */
function splashByDefender(u, tgt, mine){
  const mode = hitModeOf(u);
  if (mode === 'single') return [];
  const S = sideInfo(mine), p = unitPos(u, S.baseY);
  const out = [];
  for (const e of G.marchers){
    if (e === tgt || e.hp <= 0 || e.owner !== S.foe) continue;
    if (mine ? (e.y < MID1) : (e.y > MID1)) continue;    // 和索敌同一条：只打自己半场
    const hit = mode === 'aoe'
      ? inCircle(p.x, p.y, e.x, e.y, u.range + RANGE_PAD)
      : inLine(p.x, p.y, tgt.x, tgt.y, e.x, e.y, PIERCE_HALF_W, u.range + RANGE_PAD);
    if (hit) out.push(e);
  }
  return out;
}
/* 行军兵这一击的额外守军目标（同样只算踩在路上的守军，和索敌规则一致） */
function splashByMarcher(m, tgt){
  const mode = hitModeOf(m);
  if (mode === 'single') return [];
  const defMine = m.owner === 'ai';
  const S = sideInfo(defMine);
  const out = [];
  for (let i = 0; i < S.board.length; i++){
    const u = S.board[i];
    if (!u || u.kind === 'char' || u.hp <= 0) continue;
    if (!isAnchor(u, i) || u === tgt.u) continue;
    if (!defenderOnRoad(u, i, defMine)) continue;
    const p = unitPos(u, S.baseY);
    const hit = mode === 'aoe'
      ? inCircle(m.x, m.y, p.x, p.y, m.range + RANGE_PAD)
      : inLine(m.x, m.y, tgt.x, tgt.y, p.x, p.y, PIERCE_HALF_W, m.range + RANGE_PAD);
    if (hit) out.push({ u, x: p.x, y: p.y, idx: i });
  }
  return out;
}
/* 行军兵对撞时的额外敌兵（穿刺沿对撞方向，范围圈内全中） */
function splashByMarcherDuel(m, foe){
  const mode = hitModeOf(m);
  if (mode === 'single') return [];
  const out = [];
  for (const o of G.marchers){
    if (o === m || o === foe || o.hp <= 0 || o.owner === m.owner) continue;
    const hit = mode === 'aoe'
      ? inCircle(m.x, m.y, o.x, o.y, m.range + RANGE_PAD)
      : inLine(m.x, m.y, foe.x, foe.y, o.x, o.y, PIERCE_HALF_W, m.range + RANGE_PAD);
    if (hit) out.push(o);
  }
  return out;
}
/* 一次出手的视觉反馈：穿刺画一条线、范围画一圈，玩家才看得懂伤害从哪来 */
function fxHit(mode, ax, ay, bx, by, r, color){
  if (mode === 'pierce') G.fx.push({ type:'beam', x1:ax, y1:ay, x2:bx, y2:by, t:0, dur:0.22, color:color });
  else if (mode === 'aoe') G.fx.push({ type:'ring', x:ax, y:ay, r0:16, r1:r, t:0, dur:0.28, color:color });
}


/* 一侧守军的主循环（回血 / 脱战回血 / 大招 / 出手）—— 两边共用这一个函数 */
function updateSideUnits(dt, mine){
  const S = sideInfo(mine);
  /* 联机：对面那半场只有「影子守军」，它的血量与存亡由对面本人算好推过来。
     这里只推进淡入/受击这些动画，绝不在这里掉血或阵亡 —— 本地算一套必然和对面分叉。 */
  if (NET.pvp && !mine){
    for (let i = 0; i < S.board.length; i++){
      const u = S.board[i];
      if (!u || !isAnchor(u, i)) continue;
      u.born += dt;
      u.flash = Math.max(0, u.flash - dt);
      u.swing = Math.max(0, u.swing - dt);
      u.hurt = Math.max(0, (u.hurt || 0) - dt*3);
    }
    return;
  }
  ensureBuffs(mine);                       // 新落地的守军在这里兜底补上加成（两侧同一条）
  const reg = S.regen;
  for (let i = 0; i < S.board.length; i++){
    const u = S.board[i];
    if (!u || u.kind === 'char') continue;
    if (!isAnchor(u, i)) continue;          // 名将横占两格，只结算一次
    u.born += dt; u.flash = Math.max(0, u.flash - dt); u.swing = Math.max(0, u.swing - dt);
    if (reg > 0 && u.hp < u.maxHp) u.hp = Math.min(u.maxHp, u.hp + u.maxHp*reg*dt);

    // 脱战回血：连着 MY_REGEN_IDLE 秒没挨打，就回 MY_REGEN_PCT 血
    u.idleT = (u.idleT || 0) + dt;
    if (u.idleT >= MY_REGEN_IDLE){
      u.idleT -= MY_REGEN_IDLE;
      if (u.hp < u.maxHp){
        u.hp = Math.min(u.maxHp, u.hp + u.maxHp * MY_REGEN_PCT);
        u.regenT = 0.55;                  // 绿框回血提示
      }
    }
    u.regenT = Math.max(0, (u.regenT || 0) - dt);

    // 名将大招
    if (u.kind === 'hero' && u.skill){
      u.skCd = (u.skCd === undefined ? HEROES[u.type].cd : u.skCd) - dt;
      if (u.skCd <= 0){ castHeroSkill(u, mine); u.skCd = HEROES[u.type].cd; }
    }

    if (u.atk <= 0 || !G.marchers.length) continue;
    u.cd -= dt;
    if (u.cd < -0.4) u.cd = -0.4;
    if (u.cd > 0) continue;
    const tgt = unitTarget(u, mine);
    if (!tgt) continue;
    const mode = hitModeOf(u);
    dealFrom(u, tgt, unitDmg(u, tgt, mine), mine);
    if (mode !== 'single'){
      for (const e of splashByDefender(u, tgt, mine)) dealFrom(u, e, unitDmg(u, e, mine), mine);
      const ap = unitPos(u, S.baseY);
      fxHit(mode, ap.x, ap.y, tgt.x, tgt.y, u.range + RANGE_PAD, S.color);
    }
    u.cd = 1 / Math.max(0.3, u.rate);
    u.swing = 0.26;
    if (Math.random() < 0.28) sfx('hit');
  }
}
function updateMyUnits(dt){ updateSideUnits(dt, true); }
function updateAiUnits(dt){ updateSideUnits(dt, false); }

/* ---------------- 名将大招 ----------------
   一份代码，两种归属：mine 只决定「打谁、给谁加血、飘字前缀」，
   倍率 / 范围 / 冷却 / 判定两边完全一致。
   （以前 castSkill 与 castAiSkill 两份抄来抄去，半径 520 对 420、
     fallback 落点一个在我方半场中心一个在脚下，就是从这儿开始歪的。） */
function castHeroSkill(u, mine){
  const S = sideInfo(mine);
  const h = HEROES[u.type];
  const sk = u.skill || (h && h.skill);
  const p0 = unitPos(u, S.baseY);
  const cx = p0.x, cy = p0.y;
  const A = u.atk * S.atkMul;
  const foes = marchersOf(S.foe);              // 大招永远砸对面阵营的行军兵
  const tag = mine ? '' : '敌方';
  /* 范围技的圆心 = 敌兵正在走的这半场的中心。
     敌方来兵在我方半场往下走、我方出击兵在敌方半场往上走，
     所以圈心永远在「自己守的这块」的正中 —— 以前算到对面半场中心，
     那儿根本没有敌兵，范围一收窄大招就完全打空了。 */
  const zoneX = BX + COLS*CELL/2;
  const zoneY = S.baseY + ROWS*CELL/2;
  const beamEnd = mine ? 20 : H - 20;          // 光束打到对面那侧的尽头
  /* 大招强度基准：只覆盖「敌军半场中路一圈」，倍率砍半，CD 全面上调 ——
     原版是全场无差别 + 8-11 秒一次，一个 5 阶名将自己就能清一整波，其他单位全成摆设。 */
  switch (sk){
    case 'longdan': {
      // 龙胆：光束仍是全场视觉，但只伤「贴着这条枪」一路的兵（横向 1.5 格内）
      G.fx.push({ type:'beam', x1:cx, y1:cy, x2:cx, y2:beamEnd, t:0, dur:0.55 });
      for (const e of [...foes]) if (Math.abs(e.x - cx) <= 108) dealFrom(u, e, A*1.2, mine);
      burst(cx, cy, 26, S.color); toast(tag + '赵云 · 龙胆！'); sfx('hero'); break;
    }
    case 'wusheng': {
      let best = null, bn = -1;
      for (const e of foes){
        let n = 0;
        for (const o of foes) if (Math.abs(o.x-e.x)<170 && Math.abs(o.y-e.y)<170) n++;
        if (n > bn){ bn = n; best = e; }
      }
      const tx = best ? best.x : zoneX, ty = best ? best.y : zoneY;
      G.fx.push({ type:'ring', x:tx, y:ty, r0:20, r1:200, t:0, dur:0.5, color:SEAL });
      for (const e of [...foes]) if (Math.abs(e.x-tx)<200 && Math.abs(e.y-ty)<200) dealFrom(u, e, A*1.4, mine);
      burst(tx, ty, 26, SEAL); toast(tag + '关羽 · 武圣！'); sfx('hero'); break;
    }
    case 'dangyang': {
      // 当阳桥：只震晕敌军中路 330 半径内的兵（原来全场 3 秒 = 敌方整波停摆）
      G.fx.push({ type:'ring', x:zoneX, y:zoneY, r0:20, r1:330, t:0, dur:0.6, color:INK });
      for (const e of foes) if (Math.hypot(e.x-zoneX, e.y-zoneY) <= 330)
        e.stun = Math.max(e.stun || 0, 2.2);
      toast(tag + '张飞 · 当阳桥断喝！'); sfx('hero'); break;
    }
    case 'rende': {
      for (const o of S.board) if (o && o.kind !== 'char') o.hp = Math.min(o.maxHp, o.hp + o.maxHp*0.25);
      for (const e of [...foes]) if (Math.hypot(e.x-zoneX, e.y-zoneY) <= 300) dealFrom(u, e, A*0.45, mine);
      G.fx.push({ type:'ring', x:cx, y:cy, r0:20, r1:300, t:0, dur:0.7, color:'#2f7d4f' });
      toast(tag + '刘备 · 仁德！'); sfx('hero'); break;
    }
    case 'liegong': {
      // 烈弓：箭雨只覆盖敌军中路一圈（打击判定与视觉同心），跳伤 0.34、时长 2.2 秒
      G.fx.push({ type:'ring', x:zoneX, y:zoneY, r0:20, r1:340, t:0, dur:0.6, color:'#8a5a06' });
      G.fx.push({ type:'rain', t:0, dur:2.2, tick:0, dmg: A*0.34, mine, src:u, cx:zoneX, cy:zoneY, r:340 });
      toast(tag + '黄忠 · 烈弓箭雨！'); sfx('hero'); break;
    }
    case 'tieqi': {
      G.fx.push({ type:'ring', x:zoneX, y:zoneY, r0:20, r1:330, t:0, dur:0.6, color:'#2a5fa8' });
      for (const e of [...foes]) if (Math.hypot(e.x-zoneX, e.y-zoneY) <= 330){
        e.slowT = 3.0; dealFrom(u, e, A*0.5, mine);
      }
      toast(tag + '马超 · 铁骑踏阵！'); sfx('hero'); break;
    }
  }
}
const castSkill = castHeroSkill;          // 旧名字保留，别处还在用

/* ============================================================
   我方冲阵兵（对攻）
   ============================================================ */
/* 追加 n 个兵到某一侧的进攻队列：'down' 是敌军打我，'up' 是我打对面。
   联机：'up' 本地照样生成（走给玩家看的那一份），真正算账的是对面，
   所以同时告诉对面「n 个兵过来了」，对面把它当成来兵生成并结算。 */
function sendAttack(side, n){
  if (side === 'down'){
    if (NET.pvp) return;        // 联机没有电脑，对面要来兵由对面自己攒战功
    G.spawnLeft += n;
    if (G.spawnGap <= 0) G.spawnGap = 0.30;
  } else {
    G.aiSpawnLeft += n;
    if (G.aiSpawnGap <= 0) G.aiSpawnGap = 0.30;
    if (NET.pvp) netSend({ k:'atk', n });
  }
}

/* ============================================================
   上半场的对手：电脑（同一个游戏的另一个玩家）
   规则与玩家几乎一致：馒头只来自杀敌、一次刷新 5 格手牌（旧牌上路）、
   同种升阶（等级可差 1 阶）、两个单字拼名字召将、战功满则派兵来打我方主公。
   异字合成（弩/骁/钺/铁/戟/骧）整体关闭（FUSE_ON=false），两边都不会再冒出这六种兵；
   玩家看到对面冒出没见过的兵种会当成作弊，可读性比对称性值钱。
   ============================================================ */
function aiGain(v, x, y){
  G.ai.mantou += v;
  if (x !== undefined) floater(x, y - 20, '敌方 +' + (Math.round(v*10)/10), SEAL);
}
/* 电脑击杀所得：与玩家的 mantouMul 同一个公式 */

/* 电脑抽牌：与玩家同一张掉落表 */
function aiRollTile(){
  if (gRnd() < SHOVEL_RATE) return { kind:'shovel' };
  if (gRnd() < 0.28){
    const ch = pickHeroCharAI();
    if (ch) return { kind:'char', char: ch };

/* 给一个单字，返回能跟它凑成姓名的那半个字 */
function partnerOf(c){
  const out = [];
  for (const n of GOLD_HEROES){
    const h = HEROES[n];
    if (h.a === c) out.push(h.b);
    if (h.b === c) out.push(h.a);
  }
  return out.length ? pick(out) : null;
}
function pickHeroCharAI(){
  if (!G.charPool || !G.charPool.length) refillPool();   // 电脑摸空也重洗（池子共用，不打扰玩家提示）
  const held = [];
  for (const t of G.ai.hand) if (t && t.kind === 'char') held.push(t.char);
  for (const u of G.enBoard) if (u && u.kind === 'char') held.push(u.char);
  if (held.length && gRnd() < 0.66){
    const cand = [];
    for (const c of held){
      const p = partnerOf(c);
      if (p && G.charPool.indexOf(p) >= 0) cand.push(p);
    }
    if (cand.length){
      const c = pick(cand);
      if (takePoolChar(c)) return c;
    }
  }
  return drawPoolChar(gRnd() < (G.ai.passive.zhaoxian ? 0.88 : 0.74));
}
/* 电脑征兵：直接调用与玩家同一个 enlistSide()，只有飘字/音效是各自的 */

/* 落子：优先把手牌叠到场上同种的守军上（合成升阶，等级可差 1 阶），其次铺到空位 */
/* 电脑也逛自己的商店：同一张道具表、同一套价格与上限（主动最多 2 件） */
function aiShop(){

  for (let i=0;i<3 && pool.length;i++) stock.push(pool.splice((gRnd()*pool.length)|0,1)[0]);

}
/* 电脑用主动道具：神兵符保命、大补丸回命、毛笔补单字 */
function aiUseActives(){
