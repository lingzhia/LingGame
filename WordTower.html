/* 这张手牌现在能不能落下去（能合成就合成，能占空格就占格） */
function aiTilePlaceable(t, allowEmpty){
  if (!t || t.kind === 'shovel') return false;
  for (let i = 0; i < G.enBoard.length; i++){
    const u = G.enBoard[i];
    if (!u) continue;
    if (!isAnchor(u, i)) continue;
    if (u.kind === 'char' && t.kind !== 'char') continue;
    const comb = tryCombine(t, u);
    if (!comb) continue;
    if (!aiCombOK(comb)) continue;
    if (comb.kind === 'hero'){
      const allow = [i].concat(u.cells || []);
      if (findHeroSpan(i, G.enBoard, false, allow)) return true;
    } else return true;
  }
  if (!allowEmpty) return false;
  // 单字：能挨着另一半放、或者盘上孤字没到上限且熟地还宽裕，才值得去占一个空坑。
  // 否则就当它落不下（留在手里，下次征兵会被回收），免得把熟地铺满死字。
  if (t.kind === 'char' && !aiCharWorth(t.char)) return false;
  for (let i = 0; i < G.enBoard.length; i++){
    if (G.enBoard[i] || isPathCell(i, false) || isAduCell(i, false) || !aiLandOK(i)) continue;
    if (t.kind === 'hero' && !findHeroSpan(i, G.enBoard, false, [])) continue;
    return true;
  }
  // 熟地占满时，普通兵还能顶掉盘上的「孤字」
  if (t.kind === 'unit' && aiJunkCharCell() >= 0) return true;
  return false;
}
/* 电脑盘上还空着的熟地格数 */
function aiEmptyLand(){
  let n = 0;
  for (let i = 0; i < G.enBoard.length; i++)
    if (!G.enBoard[i] && !isPathCell(i, false) && !isAduCell(i, false) && aiLandOK(i)) n++;
  return n;
}
/* 电脑盘上还有几个单字 */
function aiCharCount(){
  let n = 0;
  for (const u of G.enBoard) if (u && u.kind === 'char') n++;
  return n;
}
/* 电脑已经派出去几个出击兵（防止它把整手牌都倒到路上） */
function aiRaiderCount(){
  let n = 0;
  for (const m of G.marchers) if (m.owner === 'ai' && m.raider) n++;
  return n;
}
/* 这块单字牌值不值得落到盘上：
   能紧挨着另一半放（落下去立刻成将）→ 值得；
   否则只有在「盘上的孤字还没到上限」且「熟地还宽裕」时才铺，
   免得一路铺满死字、把熟地占干。 */
function aiCharWorth(ch){
  if (aiCharSpot(ch) >= 0) return true;
  return aiCharCount() < AIC().maxChars && aiEmptyLand() >= AIC().holdFree;
}
/* 落子：优先把手牌叠到场上同种的守军上（合成升阶，等级可差 1 阶），其次铺到空位 */
function aiPlace(){
  // 布阵上限 = 自己实际能用的地格数（有空地就继续铺）。
  // 原来写死成 18+波次×1.6，而整局地格只有 10-13 格，这个数永远达不到 ——
  // AI 一直以为「盘还没铺满」，于是几乎不往路上派兵，进攻能力等于没有。
  let cnt = boardCount(G.enBoard);
  let placed = 0;

  for (let hi = G.ai.hand.length - 1; hi >= 0; hi--){
    const t = G.ai.hand[hi];
    if (!t){ G.ai.hand.splice(hi, 1); continue; }
    // 铲子：电脑也开垦荒地（和玩家 dropOnCell 里的铲子逻辑对称）
    if (t.kind === 'shovel'){
      let best = -1, bs = -1e9;
      for (let i = 0; i < G.enBoard.length; i++){
        if (isRoad(i, false) || aiLandOK(i) || G.enBoard[i]) continue;
        const sc = cellScore(i, false);
        if (sc > bs){ bs = sc; best = i; }
      }
      if (best >= 0){ G.aiUnlocked[best] = true; G.ai.hand.splice(hi, 1); }
      continue;
    }
    // 1) 叠到同种的守军身上 -> 升阶（等级可差 1 阶）
    let merged = false;
    for (let i = 0; i < G.enBoard.length && !merged; i++){
      const u = G.enBoard[i];
      if (!u || !isAnchor(u, i)) continue;
      if (u.kind === 'char' && t.kind !== 'char') continue;
      const comb = tryCombine(t, u);
      if (!comb) continue;
      if (!aiCombOK(comb)) continue;
      if (comb.kind === 'hero'){
        // 名将横占两格
        const allow = [i].concat(u.cells || []);
        const span = findHeroSpan(i, G.enBoard, false, allow);
        if (!span) continue;
        if (u.cells) for (const k of u.cells) if (span.indexOf(k) < 0) G.enBoard[k] = null;
        const nu = newUnit(comb.type, comb.level, span[0], span);
        nu.born = 0;
        for (const k of span) G.enBoard[k] = nu;
        const cx = (cellCX(colOf(span[0])) + cellCX(colOf(span[1]))) / 2;
        burst(cx, cellCY(colOf(span[0]), rowOf(span[0]), Y_ENEMY), 24, GOLD);
        toast('敌方召出 · ' + comb.type + '！');
      } else {
        const nu = toUnitObject(comb, i);
        nu.born = 0;
        G.enBoard[i] = nu;
        burst(cellCX(colOf(i)), cellCY(colOf(i), rowOf(i), Y_ENEMY), 12, SEAL);
      }
      G.ai.hand.splice(hi, 1);
      merged = true; placed++;
    }
    if (merged) continue;
    // 2) 铺到空位（还有空地就铺）
    let done = false;
    if (aiEmptyLand() > 0){
      const empt = [];
      for (let i = 0; i < G.enBoard.length; i++)
        if (!G.enBoard[i] && !isPathCell(i, false) && !isAduCell(i, false) && aiLandOK(i)) empt.push(i);
      // 单字优先贴着它的「另一半」落 —— 一放下 autoFormHeroes 就会把两字拼成名将。
      // 没伙伴可配、熟地又吃紧的时候就别拿单字去占坑（留在手里，下次征兵一起回收）。
      // 原来不做区分，单字一路铺满前排却永远拼不起来，中后期电脑半张盘都是死字。
      let idx = -1;
      if (t.kind === 'char') idx = aiCharSpot(t.char);
      if (idx < 0 && t.kind === 'char' && !aiCharWorth(t.char)) continue;
      if (idx < 0 && empt.length) idx = aiPickCell(empt);
      if (idx >= 0){
        if (t.kind === 'hero'){
          const span = findHeroSpan(idx, G.enBoard, false, []);
          if (span){
            const nu = newUnit(t.type, t.level, span[0], span);
            nu.born = 0;
            for (const k of span) G.enBoard[k] = nu;
            G.ai.hand.splice(hi, 1); cnt++; placed++; done = true;
          }
        } else {
          const nu = toUnitObject(t, idx);
          if (nu){ nu.born = 0; G.enBoard[idx] = nu; G.ai.hand.splice(hi, 1); cnt++; placed++; done = true; }
        }
      }
    }
    // 2b) 盘上放不下了：多余的兵放上路 -> 变成出击兵，从它的半场朝我这边打过来。
    //     和玩家同一套规则（spawnRaider），只是起点用电脑自己半场的路头；上限按难度给。
    if (!done && t.kind === 'unit' && freeRoadSlots(false) > 0 && aiRaiderCount() < AIC().raiderCap){
      // 放不进棋盘的兵不干等：派上路，从路头往下走两格再过缝，别显得像瞬移
      const cell = PATH_CELLS_E[Math.min(2, PATH_CELLS_E.length - 1)];
      if (cell !== undefined && spawnRaider('ai', cell, t.type, t.level)){
        G.ai.hand.splice(hi, 1); placed++; done = true;
      }
    }
    // 2c) 熟地占满了：普通兵可以顶掉盘上一个「孤字」（另一半不在场，纯占坑的死字）。
    //     没有这条，单字一旦铺开就永远清不掉，电脑的战斗力会一路烂下去。
    if (!done && t.kind === 'unit'){
      const j = aiJunkCharCell();
      if (j >= 0){
        clearCells(G.enBoard, j);
        const nu = toUnitObject(t, j);
        if (nu){ nu.born = 0; G.enBoard[j] = nu; G.ai.hand.splice(hi, 1); placed++; done = true; }
      }
    }
  }
  if (placed) autoFormHeroes(G.enBoard, false);   // 电脑也享受「相邻两字自动成将」
  return placed;
}
/* 布阵打分：贴着路边（pathAway=1）的格子最能拦停敌军，隔一格的次之，越荒越差。
   frontAway = 离自己的出兵点近不近（1 = 紧挨出兵点），越靠前越早接敌。 */
function cellScore(i, mine){
  const c = colOf(i), r = rowOf(i);
  const d = pathAway(i, mine);
  let s = 0;
  if (d <= 1) s += 6;
  else if (d === 2) s += 1.5;
  else s -= (d - 2) * 1.2;
  // 贴着主公的格子是最后一道防线
  const aduC = mine ? ADU_M_C : ADU_E_C;
  const da = Math.max(Math.abs(c - aduC[0]), Math.abs(r - aduC[1]));
  if (da === 1) s += 3;
  // 往前压：玩家的出兵点在 r=0 一侧，电脑的在 r=ROWS-1 一侧
  const front = mine ? r : (ROWS - 1 - r);
  s -= front * 0.22;
  return s;
}
/* 选格子：优先能拦停敌军的路边格，其次贴着主公的格子，其余往前压 */
function aiPickCell(empt){
  let best = empt[0], bs = -1e9;
  for (const i of empt){
    const s = cellScore(i, false);
    if (s > bs){ bs = s; best = i; }
  }
  return best;
}
/* 单字 -> 能和它拼成名将的另一半字。
   关/张/黄 这类一字多义的会返回多个（关 → 羽/兴/平），所以不能像 partnerOf 那样随机挑一个。 */
function partnersOf(ch){
  const out = [];
  for (const n of (CHAR_HERO[ch] || [])){
    const h = HEROES[n];
    const p = (h.a === ch) ? h.b : h.a;
    if (out.indexOf(p) < 0) out.push(p);
  }
  return out;
}
/* 这块单字牌放在哪最值：紧挨着场上另一半字的空位（放下去 autoFormHeroes 立刻拼成名将）。
   找不到返回 -1。 */
function aiCharSpot(ch){
  const ps = partnersOf(ch);
  if (!ps.length) return -1;
  for (let i = 0; i < G.enBoard.length; i++){
    const u = G.enBoard[i];
    if (!u || u.kind !== 'char' || ps.indexOf(u.char) < 0) continue;
    const c = colOf(i), r = rowOf(i);
    for (const nc of [c - 1, c + 1]){
      if (nc < 0 || nc >= COLS) continue;
      const j = nc + r * COLS;
      if (G.enBoard[j] || !aiLandOK(j) || isPathCell(j, false) || isAduCell(j, false)) continue;
      return j;
    }
  }
  return -1;
}
/* 盘上的「孤字」：单字，且场上没有能跟它拼上的另一半 —— 纯占坑，普通兵可以把它顶掉 */
function aiJunkCharCell(){
  for (let i = 0; i < G.enBoard.length; i++){
    const u = G.enBoard[i];
    if (!u || u.kind !== 'char') continue;
    const ps = partnersOf(u.char);
    let has = false;
    for (let k = 0; k < G.enBoard.length && !has; k++){
      if (k === i) continue;
      const v = G.enBoard[k];
      if (v && v.kind === 'char' && ps.indexOf(v.char) >= 0) has = true;
    }
    if (!has) return i;
  }
  return -1;
}
function aiTick(dt){
  if (NET.pvp) return;          // 联机：对面是真人，电脑不插手
  G.ai.t += dt;
  if (G.ai.t < AIC().tick) return;
  G.ai.t = 0;
  aiUseActives();
  aiPlace();
  // 手牌全落不下去了才刷新征兵，免得把攒着的单字碎片回收掉
  let canPlace = false;
  for (const t of G.ai.hand){ if (aiTilePlaceable(t, true)){ canPlace = true; break; } }
  if (!canPlace){ aiEnlist(); aiPlace(); }
  refreshAiBonds();
  // 开波前 1.5 秒：把落不下的兵一股脑推上路。
  // 人类一直是这么打的（手牌随时能丢到路上当免费进攻兵），AI 以前从不这么做，
  // 所以它的进攻能力几乎为零 —— 这是它最大的短板。
  if (AIC().rush && G.phase === 'battle'){
    const left = WAVE_GAP - G.waveT;
    if (left > 0 && left <= 1.6) aiFlushHand();
  }
}
/* 把手牌里「上不了盘」的兵推上路：每个是一份免费进攻战力（玩家点一下就做到，AI 以前做不到） */
function aiFlushHand(){
  for (let i = G.ai.hand.length - 1; i >= 0; i--){
    const t = G.ai.hand[i];
    if (!t || t.kind !== 'unit') continue;
    if (freeRoadSlots(false) <= 0) return;
    const cell = PATH_CELLS_E[Math.min(2, PATH_CELLS_E.length - 1)];
    if (cell === undefined) return;
    if (spawnRaider('ai', cell, t.type, t.level)) G.ai.hand.splice(i, 1);
  }
}
/* ============================================================
   神秘商人 / 道具
   ============================================================ */
/* 神秘商人：随奇数波（3/5/7…）开场出现，一轮只准买 1 件。

function nextShopWave(w){

  return m;
}
function openShop(){

/* ============================================================
   特效更新
   ============================================================ */
function updateFx(dt){
  for (let i = G.fx.length-1; i >= 0; i--){
    const f = G.fx[i];
    f.t += dt;
    if (f.type === 'rain'){
      f.tick -= dt;
      if (f.tick <= 0){
        f.tick = 0.22;

        for (const e of foes)
          if (f.cx === undefined || Math.hypot(e.x-f.cx, e.y-f.cy) <= f.r) dealFrom(f.src, e, f.dmg, !!f.mine);
        const y0 = f.mine ? Y_ENEMY - 20 : Y_MINE - 20, y1 = y0 + ROWS*CELL;
        for (let k=0;k<3;k++) burst(rnd(BX, BX + COLS*CELL), rnd(y0, y1), 3, INK2);
      }
    }
    if (f.t >= f.dur) G.fx.splice(i,1);
  }
  for (let i = G.parts.length-1; i >= 0; i--){
    const p = G.parts[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 340*dt;
    if (p.t >= p.dur) G.parts.splice(i,1);
  }
  for (let i = G.floaters.length-1; i >= 0; i--){
    const f = G.floaters[i];
    f.t += dt; f.y -= 34*dt;
    if (f.t >= f.dur) G.floaters.splice(i,1);
  }
}

/* ============================================================
   主更新
   ============================================================ */
/* 不设时间上限：一局只有一种结束方式 —— 哪一方的主公先被打光。
   出兵节奏：每 WAVE_GAP 秒一批，不管上一批走没走完；
   但如果某一方把这一波**提前清干净**了，立刻开下一波（两边一起开，不等另一边）。
   一批的兵力 = 3 + 2×波次（第 1 批 5 个、第 2 批 7 个、第 3 批 9 个……）。 */
const WAVE_GAP = 26;
/* 速清提前开波的最短间隔：免得刚开波就「场上没人」→ 无限连刷 */
const WAVE_EARLY_MIN = 3;

function endGame(win){
  if (G.phase === 'over') return;
  G.phase = 'over';
  G.result = win ? 'win' : 'lose';
  sfx(win ? 'win' : 'lost');
  recFinish();                     // 每局结束都落一份存档（结算页可回放）
}

function step(dt){
  if (G.paused) return;                                            // 暂停：时间不推进
  if (G.phase === 'intro' || G.phase === 'over' || G.phase === 'shop'){ updateFx(dt); return; }
  if (G.phase === 'prep'){
    G.prepT -= dt;
    aiTick(dt);            // 备战时电脑也在同步经营，两边起点一样
    if (G.prepT <= 0){ G.phase = 'battle'; startWave(); }
    return;
  }

  G.time += dt;
  if (G.aiShield > 0) G.aiShield -= dt;

  // 下半场出兵：敌军从下半场的敌军出生点下来打我方主公
  // 联机里这批「敌军」就是对面玩家那边的进攻兵 —— 兵种由同一个种子决定，两端一模一样
  if (G.spawnLeft > 0){
    G.spawnGap -= dt;
    if (G.spawnGap <= 0){
      G.spawnGap = spawnGapOf(G.wave);
      G.spawnLeft--;
      spawnWave('ai', G.spawnQueue.pop() || enemySpec(G.wave, 90, 0));
    }
  }
  // 上半场出兵：我军从上半场的敌军出生点上去打电脑的主公
  if (G.aiSpawnLeft > 0){
    G.aiSpawnGap -= dt;
    if (G.aiSpawnGap <= 0){
      G.aiSpawnGap = spawnGapOf(G.wave);
      G.aiSpawnLeft--;
      spawnWave('me', G.aiSpawnQueue.pop() || enemySpec(G.wave, 91, 1));
    }
  }
  // 到点就开下一批，不看上批是否还在场上；
  // 另外任一方把这一波的兵清干净了，也立刻开下一波 —— 两边同时开。
  G.waveT += dt;
  if (G.waveT >= WAVE_GAP) startWave(false);
  else if (G.waveT >= WAVE_EARLY_MIN && (waveClearedFor(true) || waveClearedFor(false))) startWave(true);

  updateMarchers(dt);        // 两边所有的行军兵，一套逻辑
  updateMyUnits(dt);
  updateAiUnits(dt);

  // 战功满：双方各派一支突击队去打对面（同一套规则）
  if (G.merit >= G.meritNeed){
    G.merit -= G.meritNeed;
    sendAttack('up', 3);
    G.fx.push({ type:'ring', x: W/2, y: MID1 - 10, r0:40, r1:200, t:0, dur:0.5, color:GOLD });
    toast('战功满 · 我军突击队出动！');
    sfx('enlist');
  }
  if (G.ai.merit >= G.ai.meritNeed){
    G.ai.merit -= G.ai.meritNeed;
    sendAttack('down', 3);
    G.fx.push({ type:'ring', x: W/2, y: MID2 + 10, r0:40, r1:200, t:0, dur:0.5, color:SEAL });
    toast('敌方战功满 · 突击队压境！');
    sfx('lost');
  }

  aiTick(dt);                 // 电脑征兵/布阵（与玩家的节奏一致）

  updateFx(dt);
}
function startBattle(){
  if (NET.screen !== 'game') showScreen('game');   // 开打就一定在对局屏（首页/联机页点进来也走这里）
  G.phase = 'prep'; G.prepT = 15;
  recBegin();                                      // 单人对局：从备战这一秒开始录
  toast('备战 15 秒 · 快布阵');
}

/* ---------------- 暂停 ---------------- */
/* 只有人机对战才能暂停：将来真人对战把 G.vsAI 置 false，暂停按钮与快捷键一起失效 */
function canPause(){ return !!G && G.vsAI && (G.phase === 'prep' || G.phase === 'battle'); }
function setPaused(v){
  if (REPLAY.on) return;          // 回放中不暂停：录像里的暂停只冻结当时，不影响局面
  if (v && !canPause()) return;
  G.paused = !!v;
  G.dragger = null;              // 松开手里拖着的牌，避免冻结时卡住
  if (G.paused){ G._pauseBtns = null; sfx('click'); }
}
function togglePause(){ setPaused(!G.paused); }
function pauseAction(id){
  if (id === 'resume'){ sfx('click'); setPaused(false); return; }
  if (id === 'mute'){ muted = !muted; if (!muted) sfx('click'); return; }
  if (id === 'restart'){
    G.paused = false;
    newGame(); startBattle();
    toast('重开一局 · 备战 15 秒');
  }
}

/* ============================================================
   渲染
   ============================================================ */
function drawBg(plain){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#ece3d2');
  g.addColorStop(0.5, PAPER);
  g.addColorStop(1, '#e7dcc8');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 水墨晕染
  ctx.save();
  ctx.globalAlpha = 0.05;
  for (let i=0;i<6;i++){
    const x = (i*173 % W), y = (i*271 % H);
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 180);
    rg.addColorStop(0, '#6b5f4a'); rg.addColorStop(1, 'rgba(107,95,74,0)');
    ctx.fillStyle = rg; ctx.fillRect(x-180, y-180, 360, 360);
  }
  ctx.restore();

  if (plain) return;   // 首页 / 联机页：只要纸底，不要对局界面的分隔线

  // 上区（战况 + 敌军）压一层浅纸，与下半场的战场分开
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.fillRect(0, 0, W, TOP_H);
  // 上下分界：一道细线 + 中间一点留白
  ctx.strokeStyle = 'rgba(120,105,80,0.26)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, TOP_H - 0.5); ctx.lineTo(W, TOP_H - 0.5); ctx.stroke();
  // 左面板与敌军图之间也来一道
  ctx.strokeStyle = 'rgba(120,105,80,0.18)';
  ctx.beginPath(); ctx.moveTo(W/2 - 0.5, 14); ctx.lineTo(W/2 - 0.5, TOP_H - 14); ctx.stroke();

  // 我方战场的底：一块浅浅的暖色台面，棋盘坐上去
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  rr(ctx, 10, BOT_Y + 8, W - 20, (H - BOT_Y) - 16, 18); ctx.fill();
}

/* 路上的行进方向小箭头 */
function roadArrow(x, y, ang){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(8, 0); ctx.lineTo(-5, -7); ctx.lineTo(-2, 0); ctx.lineTo(-5, 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawGateMark(x, y, isEnemy){
  const c = isEnemy ? '176,58,46' : '176,58,46';
  const gw = CELL*0.30, gh = CELL*0.22;
  ctx.save();
  ctx.strokeStyle = 'rgba(' + c + ',0.72)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - gw, y + gh);      ctx.lineTo(x - gw, y - gh*0.55);
  ctx.moveTo(x + gw, y + gh);      ctx.lineTo(x + gw, y - gh*0.55);
  ctx.moveTo(x - gw - 6, y - gh*0.72); ctx.lineTo(x + gw + 6, y - gh*0.72);
  ctx.stroke();
  ctx.fillStyle = 'rgba(' + c + ',0.62)';
  ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('出兵', x, y + gh*0.30);
  ctx.restore();
}

/* 一块棋盘：先在底层铺出那条蛇形路，再逐格画可布防的地 */
function drawBoardBase(baseY, board, isEnemy){
  const mine = !isEnemy;
  const cells = pathList(mine);
  const pts = pathPoints(mine);
  const adu = mine ? ADU_M : ADU_E;
  const road = pts.concat([{ x: adu.x, y: adu.y }]);   // 路一直铺进主公那一格

  // ---- 路 ----
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(road[0].x, road[0].y);
  for (let i = 1; i < road.length; i++) ctx.lineTo(road[i].x, road[i].y);
  ctx.strokeStyle = 'rgba(176,58,46,0.075)'; ctx.lineWidth = CELL - 10; ctx.stroke();
  ctx.strokeStyle = 'rgba(176,58,46,0.16)';  ctx.lineWidth = CELL - 22; ctx.stroke();
  ctx.setLineDash([12, 10]); ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(176,58,46,0.30)';  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(176,58,46,0.26)';
  for (let i = 0; i < road.length - 1; i++){
    const a = road[i], b = road[i+1];
    roadArrow((a.x + b.x)/2, (a.y + b.y)/2, Math.atan2(b.y - a.y, b.x - a.x));
  }
  ctx.restore();

  // ---- 逐格 ----
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const idx = c + r*COLS;
      const x = BX + c*CELL, y = baseY + r*CELL;
      // 主公那一格：只铺一层淡底，边框交给 drawAdu 里的那枚印
      if (isAduCell(idx, mine)){
        ctx.fillStyle = isEnemy ? 'rgba(176,58,46,0.055)' : 'rgba(184,134,11,0.075)';
        rr(ctx, x+3, y+3, CELL-6, CELL-6, 9); ctx.fill();
        continue;
      }
      if (isPathCell(idx, mine)){
        // 拖着普通兵时，把「可以上路」的格子标出来
        const dg = G.dragger;
        if (mine && dg && dg.moved && dg.tile && dg.tile.kind === 'unit'){
          ctx.strokeStyle = 'rgba(184,134,11,0.55)';
          ctx.setLineDash([5,6]); ctx.lineWidth = 1.6;
          rr(ctx, x+5, y+5, CELL-10, CELL-10, 8); ctx.stroke();
          ctx.setLineDash([]);
        }
        continue;                                    // 路已经在底层铺好了
      }
      // 荒地：玩家要用铲子挖，电脑没有铲子就一律用不了
      const locked = mine ? !G.unlocked[idx] : !aiLandOK(idx);
      // 开局 7 格熟地、其余是荒地 —— 每格都画个小铲子会糊成一片，
      // 所以只在「手里正拖着铲子」的时候才把可开垦的格子点亮，平时只留一层淡绿。
      const dg2 = G.dragger;
      const digging = mine && dg2 && dg2.moved && dg2.tile && dg2.tile.kind === 'shovel';
      if (locked){
        ctx.fillStyle = 'rgba(125,156,90,0.10)';
        rr(ctx, x+3, y+3, CELL-6, CELL-6, 9); ctx.fill();
        ctx.strokeStyle = digging ? 'rgba(184,134,11,0.60)' : 'rgba(125,156,90,0.30)';
        ctx.setLineDash([6,6]); ctx.lineWidth = digging ? 2 : 1.2;
        rr(ctx, x+3, y+3, CELL-6, CELL-6, 9); ctx.stroke();
        ctx.setLineDash([]);
      } else {
        ctx.fillStyle = isEnemy ? 'rgba(176,58,46,0.045)' : 'rgba(255,255,255,0.52)';
        rr(ctx, x+3, y+3, CELL-6, CELL-6, 9); ctx.fill();
        ctx.strokeStyle = isEnemy ? 'rgba(176,58,46,0.20)' : 'rgba(90,80,65,0.20)';
        ctx.lineWidth = 1;
        rr(ctx, x+3, y+3, CELL-6, CELL-6, 9); ctx.stroke();
      }
    }
  }

  // ---- 出兵点：路的起点画一座小城门 ----
  const sp = spawnPos(mine);
  drawGateMark(sp.x, sp.y, isEnemy);
}

function tierOf(t){
  const lv = clamp(t.level || 1, 1, MAX_TIER);
  return TIER[lv];
}
/* 等级角标：右上角一个实心方块，里面直接写数字 1–5。
   以前写的是「卒/士/校/尉/将」，玩家得先背一张对照表才知道谁高谁低 ——
   数字没有学习成本；「这是第几档」仍然由方块颜色（白绿蓝紫金）负责，远看也能分级。 */
function drawLevelBadge(xRight, yTop, bs, lv, color){
  const side = bs*1.42;
  const x = xRight - side;
  ctx.fillStyle = color; ctx.globalAlpha = 0.94;
  rr(ctx, x, yTop, side, side, 4); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fffaf0';
  ctx.font = 'bold ' + Math.round(bs*1.04) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(lv), x + side/2, yTop + side/2 + 0.5);
}
// 统一的卡面绘制（手牌 / 棋盘单位 / 名将）
function drawCard(x, y, s, t, o){
  o = o || {};
  const kind = t.kind;
  let bg = PAPER_L, bd = '#c9c0b0', tc = INK, badge = '', lvBadge = 0;
  if (kind === 'shovel'){ bg = '#e9efe1'; bd = '#a4bb8c'; tc = '#4c6b3a'; badge = '铲'; }
  else if (kind === 'hero'){
    const rank = HEROES[t.type].r;
    bg = rank === 'gold' ? '#fdf3d6' : '#f4ecfb';
    bd = rank === 'gold' ? '#d8b64f' : '#b08ed0';
    tc = rank === 'gold' ? '#8a5a06' : '#5f2f88';
    lvBadge = clamp(t.level||1,1,MAX_TIER);
  }
  else if (kind === 'char'){ bg = '#fdf7e8'; bd = '#d9bd68'; tc = '#8a5a06'; badge = '字'; }
  else { const st = tierOf(t); bg = st.bg; bd = st.bd; tc = st.c; lvBadge = clamp(t.level||1,1,MAX_TIER); }

  ctx.save();
  if (o.alpha) ctx.globalAlpha = o.alpha;
  // 阴影 + 卡面
  ctx.fillStyle = 'rgba(70,60,45,0.16)';
  rr(ctx, x+2, y+3, s, s, 10); ctx.fill();
  ctx.fillStyle = bg;
  rr(ctx, x, y, s, s, 10); ctx.fill();
  // 边框随品阶加粗：高品阶的牌一眼更「重」
  const lvl = clamp(t.level || 1, 1, MAX_TIER);
  ctx.strokeStyle = bd;
  ctx.lineWidth = (kind === 'hero') ? (2.2 + lvl*0.24) : (1.4 + lvl*0.36);
  rr(ctx, x, y, s, s, 10); ctx.stroke();
  ctx.lineWidth = 1;

  if (kind === 'shovel'){
    const mx = x + s/2, my = y + s/2;
    ctx.strokeStyle = '#5d7a41'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(mx-3, my-21); ctx.lineTo(mx-3, my+18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx-17, my+10); ctx.quadraticCurveTo(mx-3, my+28, mx+11, my+10); ctx.stroke();
  } else if (kind === 'hero'){
    // 竖排名将名
    ctx.fillStyle = tc;
    ctx.font = Math.round(s*0.31) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.type[0], x + s/2, y + s*0.30);
    ctx.fillText(t.type[1] || '', x + s/2, y + s*0.70);
    // 技能冷却环
    if (o.cd !== undefined){
      const h = HEROES[t.type];
      const p = clamp(o.cd / h.cd, 0, 1);
      ctx.strokeStyle = 'rgba(184,134,11,0.65)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(x + s/2, y + s/2, s*0.47, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1-p));
      ctx.stroke();
    }
  } else {
    const ch = t.char || (UNITS[t.type] ? UNITS[t.type].char : (FUSE[t.type] ? FUSE[t.type].char : '?'));
    ctx.fillStyle = tc;
    ctx.font = Math.round(s*0.48) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, x + s/2, y + s*0.42);
  }
  // 品阶角标 / 攻击力小签都按卡面尺寸等比缩放：
  // 出场那 0.22 秒卡面只有 0.6 倍大，固定字号的角标会盖到字上
  const bs = Math.max(8, Math.round(s*0.19));
  if (lvBadge) drawLevelBadge(x + s - 2.5, y + 2.5, bs, lvBadge, tc);
  if (badge){
    // 铲 / 字 这两类不是等级，是「这张牌是什么」—— 仍然用字
    const cw = bs*1.6, ch = bs*1.44;
    ctx.globalAlpha = 0.94;
    ctx.fillStyle = tc;
    rr(ctx, x + s - cw - 2.5, y + 2.5, cw, ch, 4); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fffaf0';
    ctx.font = 'bold ' + Math.round(bs*1.0) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(badge, x + s - cw/2 - 2.5, y + 2.5 + ch/2 + 0.5);
  }
  // 攻击力小签（兵种差异一眼可见；射程/攻速点开看详情）
  // 压在左下角：上方留出大字的位置，下方留出血条的位置
  if (o.stat){
    const bw = s*0.46, bh = s*0.20, bf = Math.max(7, Math.round(s*0.15));
    ctx.fillStyle = 'rgba(90,80,65,0.15)';
    rr(ctx, x + s*0.06, y + s - bh - s*0.11, bw, bh, 4); ctx.fill();
    ctx.fillStyle = INK2; ctx.font = bf + 'px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('攻' + o.stat, x + s*0.12, y + s - bh/2 - s*0.11);
  }
  ctx.restore();

  // 血条
  if (o.hp !== undefined && o.maxHp){
    const p = clamp(o.hp/o.maxHp, 0, 1);
    if (p < 0.999){
      const w = s - 14, bx = x + 7, by = y + s - 7;
      ctx.fillStyle = 'rgba(60,50,40,0.22)';
      rr(ctx, bx, by, w, 5, 2.5); ctx.fill();
      ctx.fillStyle = p > 0.5 ? '#4f8a4a' : (p > 0.25 ? '#c79a26' : SEAL);
      rr(ctx, bx, by, w*p, 5, 2.5); ctx.fill();
    }
  }
}

/* 名将宽卡：横跨两个格子，左格第一个字、右格第二个字 */
function drawHeroWide(x, y, w, h, t, o){
  o = o || {};
  const rank = HEROES[t.type].r;
  const bg = rank === 'gold' ? '#fdf3d6' : '#f4ecfb';
  const bd = rank === 'gold' ? '#d8b64f' : '#b08ed0';
  const tc = rank === 'gold' ? '#8a5a06' : '#5f2f88';
  ctx.save();
  if (o.alpha) ctx.globalAlpha = o.alpha;
  ctx.fillStyle = 'rgba(70,60,45,0.16)';
  rr(ctx, x+2, y+3, w, h, 11); ctx.fill();
  ctx.fillStyle = bg;
  rr(ctx, x, y, w, h, 11); ctx.fill();
  ctx.strokeStyle = bd; ctx.lineWidth = 2.5;
  rr(ctx, x, y, w, h, 11); ctx.stroke();
  // 两格之间的分隔（明确告诉玩家它占了两个格子）
  ctx.strokeStyle = 'rgba(150,130,80,0.40)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(x + w/2, y + 7); ctx.lineTo(x + w/2, y + h - 7); ctx.stroke();
  ctx.setLineDash([]);
  // 两个字各占一格
  ctx.fillStyle = tc;
  ctx.font = Math.round(h*0.58) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t.type[0], x + w*0.25, y + h*0.48);
  ctx.fillText(t.type[1] || '', x + w*0.75, y + h*0.48);
  // 等级角标（右上角数字，与普通卡同一套）
  drawLevelBadge(x + w - 4, y + 4, Math.max(9, Math.round(h*0.20)), clamp(t.level||1,1,MAX_TIER), tc);
  // 技能冷却环
  if (o.cd !== undefined){
    const hd = HEROES[t.type];
    const pr = clamp(o.cd / hd.cd, 0, 1);
    ctx.strokeStyle = 'rgba(184,134,11,0.60)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x + w*0.25, y + h*0.48, Math.min(w,h)*0.30, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1-pr));
    ctx.stroke();
  }
  ctx.restore();
  // 血条（横跨两格）
  if (o.hp !== undefined && o.maxHp){
    const pr = clamp(o.hp/o.maxHp, 0, 1);
    if (pr < 0.999){
      const bw = w - 14, bx = x + 7, by = y + h - 7;
      ctx.fillStyle = 'rgba(60,50,40,0.22)';
      rr(ctx, bx, by, bw, 5, 2.5); ctx.fill();
      ctx.fillStyle = pr > 0.5 ? '#4f8a4a' : (pr > 0.25 ? '#c79a26' : SEAL);
      rr(ctx, bx, by, bw*pr, 5, 2.5); ctx.fill();
    }
  }
}

/* ============================================================
   兵种详情（点击查看）：攻击力 / 攻速 / 攻击范围 的差异都摊开给玩家看
   ============================================================ */
function statAtkOf(t){
  // 手牌里的牌还没落地 —— 按它落地后的属性算
  if (!t) return 0;
  if (t.kind === 'char') return 0;
  if (t.kind === 'hero') return Math.round(HEROES[t.type].atk * heroAtkMul(t.level || 1));
  const u = UNITS[t.type] || FUSE[t.type];
  if (!u) return 0;
  const st = TIER[t.level] || TIER[1];
  return Math.round(u.atk * st.atkMul);
}
function rateOf(t){
  if (!t) return 0;
  if (t.kind === 'hero') return HEROES[t.type].rate * heroRateMul(t.level || 1);
  const u = UNITS[t.type] || FUSE[t.type];
  if (!u) return 0;
  const st = TIER[t.level] || TIER[1];
  return u.rate * st.rateMul;
}
function rangeOf(t){
  if (!t) return 0;
  if (t.kind === 'hero') return HEROES[t.type].range;
  const u = UNITS[t.type] || FUSE[t.type];
  return u ? u.range : 0;
}
/* 行军速度（格/秒，已含 MOVE_MUL）：只有能上路的普通兵有，名将/单字不上路 */
function spdOf(t){
  if (!t) return 0;
  const u = (t.kind === 'hero') ? HEROES[t.type] : (UNITS[t.type] || FUSE[t.type]);
  return (u && u.spd) ? u.spd * MOVE_MUL : 0;
}
/* ---------------- 距离一律用「格」说话：一格 = CELL 像素 ---------------- */
function cellStr(px){
  const c = Math.round(px / CELL * 10) / 10;
  return (c % 1 === 0 ? c.toFixed(0) : c.toFixed(1)) + ' 格';
}
function spdStr(cellsPerSec){
  if (!cellsPerSec) return '—';
  return (Math.round(cellsPerSec * 100) / 100) + ' 格/秒';
}
/* 行军兵的详情：和棋盘上的守军同一套字段，只是多一句「谁派来的」 */
function foeInfo(m){
  const u = UNITS[m.key] || UNITS.dao;
  const mine = m.owner === 'me';
  return {
    side:'foe', kind:'unit', level: m.level,
    name: u.name + (mine ? ' · 我军出击' : ' · 来犯'),
    char: u.char, tierName: m.level + ' 阶', color: mine ? GOLD : SEAL,
    atk: Math.round(m.atk), rate: m.rate, range: m.range, spd: m.spd / CELL,
    hp: Math.round(m.hp) + '/' + Math.round(m.maxHp),
    vs: m.vs || [], desc: u.desc,
    skill:null, skDesc:null, px:m.x, py:m.y, span:1,
  };
}
/* 把任意单位整理成详情面板需要的数据 */
function makeInspect(src, side, px, py){
  if (!src) return null;
  if (side === 'foe') return foeInfo(src);
  if (src.kind === 'char'){
    return {
      side, kind:'char', name:'武将单字 · ' + src.char, char:src.char, tierName:'字牌', color:'#8a5a06',
      atk:0, rate:0, range:0, spd:0, hp:null, vs: [],
      desc:'凑齐同一个名将的两个字，把它们叠在一起就能召出武将（横占两格）',
      skill:null, skDesc:null, px, py,
    };
  }
  const isHero = src.kind === 'hero';
  const u = isHero ? HEROES[src.type] : (UNITS[src.type] || FUSE[src.type]);
  if (!u) return null;
  const lv = clamp(src.level || 1, 1, MAX_TIER);
  const tier = TIER[lv];
  return {
    side, kind: src.kind, level: lv,
    name: isHero ? src.type : u.name,
    char: src.char || u.char,
    tierName: lv + ' 阶', color: tier.tc,
    atk: Math.round(src.atk !== undefined ? src.atk : statAtkOf(src)),
    rate: (src.rate !== undefined ? src.rate : rateOf(src)),
    range: (src.range !== undefined ? src.range : rangeOf(src)),
    spd: (src.queued !== undefined ? (src.spd / CELL) : spdOf(src)),
    hp: (src.hp !== undefined && src.maxHp) ? (Math.round(src.hp) + '/' + Math.round(src.maxHp)) : null,
    vs: u.vs || [],
    desc: u.desc || '',
    skill: isHero ? u.sk : null,
    skDesc: isHero ? u.skDesc : null,
    span: src.cells ? src.cells.length : 1,
    xp: isHero ? Math.floor(src.xp || 0) : null,
    xpNeed: isHero ? heroXpNeed(src) : 0,
    maxLv: isHero ? heroMaxLv(src) : 0,
    px, py,
  };
}
/* 点棋盘 / 手牌 / 敌军 -> 打开详情 */
function inspectAt(side, src, idx){
  let px = W/2, py = H/2;
  if (side === 'my' || side === 'ai'){
    const baseY = side === 'ai' ? Y_ENEMY : Y_MINE;
    const p = unitPos(src, baseY);
    px = p.x; py = p.y;
  } else if (side === 'foe'){
    px = src.x; py = src.y;
  }
  const ins = makeInspect(src, side, px, py);
  if (!ins) return false;
  G.inspect = ins;
  G.inspect.cellIdx = (idx === undefined ? null : idx);
  sfx('click');
  return true;
}
function closeInspect(){ G.inspect = null; }

/* 克制对象的名字：两边共用同一套兵，名字也只此一份 */
const VS_NAME = {};
for (const k in UNITS) VS_NAME[k] = UNITS[k].name;
for (const k in FUSE)  VS_NAME[k] = FUSE[k].name;
/* 被点中的东西现在画在屏幕的哪个 y（决定详情面板挂上还是挂下） */
function insScreenY(ins){
  if (ins.side === 'hand') return HAND_Y;
  const foeV = G.enemyBig ? V_BIG : V_MINI;
  const v = (ins.side === 'my') ? V_PLAY
          : (ins.side === 'ai') ? foeV
          : (inFoeHalf(ins.py) ? foeV : V_PLAY);
  return viewPt(v, ins.px, ins.py).y;
}

/* 详情标记（范围圈 / 名将两格）：画在它所属的那个视口里，跟着世界坐标走 */
function drawInspectMark(viewMine){
  const ins = G.inspect;
  if (!ins) return;
  const targetMine = (ins.side === 'my') ? true
                   : (ins.side === 'ai') ? false
                   : (ins.side === 'foe') ? !inFoeHalf(ins.py)
                   : null;                       // 手牌没有棋盘位置
  if (targetMine !== viewMine) return;

  // ---- 攻击范围圈 ----
  // 判定用的是「格心距 <= range」，所以半径 2 格的圈正好切在第二格中心上，
  // 看着只有 1.5 格。画的时候补半格，让整格都落在圈里，视觉与「N 格」口径一致。
  if (ins.range > 0){
    const my = ins.side === 'my';
    const rr = ins.range + CELL*0.5;
    ctx.save();
    ctx.fillStyle = my ? 'rgba(184,134,11,0.10)' : 'rgba(176,58,46,0.10)';
    ctx.beginPath(); ctx.arc(ins.px, ins.py, rr, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = my ? 'rgba(184,134,11,0.60)' : 'rgba(176,58,46,0.55)';
    ctx.lineWidth = 2; ctx.setLineDash([9, 7]);
    ctx.beginPath(); ctx.arc(ins.px, ins.py, rr, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // 名将：把它占的两格框出来
  if (G.inspect.cellIdx !== null && G.inspect.cellIdx !== undefined && (ins.side === 'my' || ins.side === 'ai')){
    const baseY = ins.side === 'ai' ? Y_ENEMY : Y_MINE;
    const u = (ins.side === 'ai' ? G.enBoard : G.board)[G.inspect.cellIdx];
    if (u && u.cells){
      ctx.save();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
      for (const i of u.cells){
        rr(ctx, BX + colOf(i)*CELL + 2, baseY + rowOf(i)*CELL + 2, CELL - 4, CELL - 4, 9);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawInspectPanel(){
  const ins = G.inspect;
  if (!ins) return;

  // ---- 面板 ----
  // 我方棋盘上的守军多一行「脱战回血」说明，所以面板要加高一点
  const isMine = ins.side === 'my' && !!ins.kind && ins.kind !== 'char';
  const w = 384, h = isMine ? 214 : 192;
  const x = (W - w)/2;
  // 面板永远摆在「看不见被点单位」的那一侧：
  //   目标在下半场靠上 -> 面板贴兵营；靠下 -> 面板挂到操作区顶上。
  //   敌军的单位在上区，范围圈画在缩略图里，面板就落到操作区顶部（不挡缩略图）。
  const ty = insScreenY(ins);
  const y = (ty < BOT_Y) ? (BOT_Y + 14)
          : (ty < (BOT_Y + HAND_Y) / 2) ? (HAND_Y - 26 - h)
          : (BOT_Y + 14);
  ctx.save();
  ctx.fillStyle = 'rgba(28,26,23,0.18)';
  rr(ctx, x + 2, y + 4, w, h, 16); ctx.fill();
  ctx.fillStyle = PAPER_L;
  rr(ctx, x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = ins.color === SEAL ? SEAL : 'rgba(90,80,65,0.30)';
  ctx.lineWidth = 2;
  rr(ctx, x, y, w, h, 16); ctx.stroke();

  // 头部：字 + 名称 + 阶
  ctx.fillStyle = '#fdf6e3';
  rr(ctx, x + 14, y + 14, 52, 52, 10); ctx.fill();
  ctx.strokeStyle = ins.color; ctx.lineWidth = 2;
  rr(ctx, x + 14, y + 14, 52, 52, 10); ctx.stroke();
  ctx.fillStyle = ins.color; ctx.font = '30px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ins.char, x + 40, y + 41);
  ctx.textAlign = 'left';
  ctx.fillStyle = INK; ctx.font = 'bold 20px ' + FONT;
  ctx.fillText(ins.name, x + 78, y + 32);
  ctx.fillStyle = ins.color; ctx.font = '12px ' + FONT;
  let sub = ins.tierName + (ins.span > 1 ? ' · 横占两格' : '');
  if (ins.kind === 'hero'){
    sub += (ins.level >= ins.maxLv) ? ' · 已满级'
         : (' · 经验 ' + ins.xp + '/' + ins.xpNeed + '（杀敌自动升级）');
  }
  ctx.fillText(fitText(sub, x + w - 14 - (x + 78)), x + 78, y + 55);

  // 三项核心属性（攻击力 / 攻速 / 攻击范围）
  const sx = x + 14, sw = (w - 28 - 16)/3, sy = y + 78;
  const stats = [
    ['攻击力', ins.atk + ''],
    ['攻速',   ins.rate ? ins.rate.toFixed(2) + '/s' : '—'],
    ['攻击范围', ins.range ? cellStr(ins.range) : '—'],
  ];
  for (let i = 0; i < 3; i++){
    const bx = sx + i*(sw + 8);
    ctx.fillStyle = 'rgba(90,80,65,0.07)';
    rr(ctx, bx, sy, sw, 46, 9); ctx.fill();
    ctx.fillStyle = INK3; ctx.font = '11px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(stats[i][0], bx + sw/2, sy + 14);
    ctx.fillStyle = INK; ctx.font = 'bold 17px ' + FONT;
    ctx.fillText(stats[i][1], bx + sw/2, sy + 33);
  }

  // 生命 / 克制
  let lx = sx;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '12px ' + FONT;
  ctx.fillStyle = INK2;
  if (ins.hp){ ctx.fillText('生命 ' + ins.hp, lx, y + 138); lx += 100; }
  // 行军速度：一格 = CELL 像素，只对能上路的兵有意义
  if (ins.spd){ ctx.fillText('移动 ' + spdStr(ins.spd), lx, y + 138); lx += 104; }
  if (ins.vs && ins.vs.length){
    const names = ins.vs.map(k => VS_NAME[k] || k).join('·');
    ctx.fillStyle = SEAL;
    ctx.fillText(fitText('克制 ' + names + ' ×1.6', (x + w - 14) - lx), lx, y + 138);
  } else if (ins.kind === 'unit'){
    ctx.fillStyle = INK3;
    ctx.fillText('无克制', lx, y + 138);
  }
  // 大招 / 兵种说明（超宽自动省略，别顶出面板）
  if (ins.skill){
    ctx.fillStyle = GOLD; ctx.font = '12px ' + FONT;
    ctx.fillText(fitText('大招 · ' + ins.skill + '　' + ins.skDesc, w - 28), sx, y + 158);
  } else if (ins.desc){
    ctx.fillStyle = INK3; ctx.font = '12px ' + FONT;
    ctx.fillText(fitText(ins.desc, w - 28), sx, y + 158);
  }
  // 守军的加减成：现在双方完全对称，只有「脱战回血」这一条（系数≠1 时才把倍率也写出来）
  if (isMine){
    ctx.textAlign = 'left'; ctx.fillStyle = '#3f8a55'; ctx.font = '12px ' + FONT;
    let s = '脱战 ' + MY_REGEN_IDLE + ' 秒回 ' + Math.round(MY_REGEN_PCT*100) + '%';
    if (MY_HP_MUL !== 1 || MY_DEF_MUL !== 1) s = '生命 ×' + MY_HP_MUL + ' · 防御 ×' + MY_DEF_MUL + ' · ' + s;
    ctx.fillText(fitText(s, w - 28), sx, y + 178);
  }
  ctx.fillStyle = INK3; ctx.font = '11px ' + FONT; ctx.textBaseline = 'middle';
  if (ins.side === 'hand'){
    ctx.textAlign = 'left';
    ctx.fillText('拖到棋盘上布阵 · 点空白处关闭', sx, y + h - 15);
  } else {
    ctx.textAlign = 'right';
    ctx.fillText('点空白处关闭', x + w - 14, y + h - 15);
  }
  ctx.restore();
}

/* 一行放不下就截断加省略号（商城/详情面板这类固定宽度的文字框都用它） */
function fitText(text, maxW){
  if (maxW <= 0) return '';
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}

function drawUnitsOnBoard(baseY, board, isEnemy){
  for (let i = 0; i < board.length; i++){
    const u = board[i];
    if (!u || u.hp <= 0) continue;
    if (!isAnchor(u, i)) continue;          // 名将只画一次（锚点格）
    const p = unitPos(u, baseY);
    const grow = u.born < 0.22 ? (0.6 + 0.4*(u.born/0.22)) : 1;
    const sw = u.swing > 0 ? Math.sin((1 - u.swing/0.26) * Math.PI) * 3 : 0;
    const w = unitW(u) * grow, h = (CELL - 12) * grow;
    let alpha = isEnemy ? 0.94 : 1;
    if (u.flash > 0) alpha = 1;
    ctx.save();
    ctx.translate(p.x + (u.swing > 0 ? sw * (isEnemy ? -1 : 1) : 0), p.y);
    if (u.kind === 'hero' && unitCells(u).length > 1){
      drawHeroWide(-w/2, -h/2, w, h, u, { alpha, hp: u.hp, maxHp: u.maxHp, cd: u.skCd });
    } else {
      drawCard(-w/2, -h/2, w, u, {
        alpha, hp: u.hp, maxHp: u.kind === 'char' ? 0 : u.maxHp,
        stat: (u.kind === 'unit') ? u.atk : undefined,
        cd: u.kind === 'hero' ? u.skCd : undefined
      });
    }
    if (u.flash > 0){
      ctx.globalAlpha = u.flash * 0.55;
      ctx.fillStyle = SEAL;
      rr(ctx, -w/2, -h/2, w, h, 10); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 脱战回血：绿框一闪，提示这格正在回血（画在卡面外侧一圈，别盖住品阶边框）
    if (u.regenT > 0){
      ctx.globalAlpha = Math.min(1, u.regenT / 0.55) * 0.55;
      ctx.strokeStyle = '#3f8a55'; ctx.lineWidth = 2;
      rr(ctx, -w/2 - 4, -h/2 - 4, w + 8, h + 8, 13); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 名将经验条：贴在卡面下沿，攒满自动升一阶（满阶就不再画）
    if (u.kind === 'hero' && u.level < heroMaxLv(u)){
      const bw = w - 12, bh = 3.5, bx = -bw/2, by = h/2 - 6;
      const pct = clamp((u.xp || 0) / Math.max(1, heroXpNeed(u)), 0, 1);
      ctx.fillStyle = 'rgba(60,50,40,0.28)';
      rr(ctx, bx, by, bw, bh, 2); ctx.fill();
      ctx.fillStyle = isEnemy ? SEAL : GOLD;
      rr(ctx, bx, by, Math.max(1.5, bw*pct), bh, 2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================================================
   视口：把 720×1446 的世界「怎么画到屏幕上」
   ------------------------------------------------------------
   世界坐标一个字没动（两块棋盘各 8×8、格距 72、上下严格镜像），
   变的是每个视口的 ox/oy/k —— 渲染才有的东西。
   好处：射程、行军距离、命中判定全在世界坐标里算，
   所以「上半场缩小」不会让电脑的兵变弱或变强，规则依旧完全对称。
   ============================================================ */
function withView(v, fn){
  ctx.save();
  ctx.setTransform(SCALE*DPR, 0, 0, SCALE*DPR, 0, 0);
  ctx.beginPath();
  ctx.rect(v.clip.x, v.clip.y, v.clip.w, v.clip.h);
  ctx.clip();
  ctx.translate(v.ox - BX*v.k, v.oy - v.wy0*v.k);
  ctx.scale(v.k, v.k);
  fn();
  ctx.restore();
}
/* 中缝：世界坐标里两半的分界线，画面上不再是一条缝，
   但「兵过没过缝」还是按它算（决定这颗兵画在哪个视口） */
const SEAM_Y = (MID1 + MID2) / 2;
const inFoeHalf = y => y < SEAM_Y;

/* 对面派上路的兵（联机）：他的格索引镜像到我这块敌人棋盘上画个记号。
   兵一拖到路上就不在 G.board 里了，不对面报一份，右上角就永远是一块空盘。 */
function drawFoeOut(v){
  const list = (NET.pvp && Array.isArray(G.enOut)) ? G.enOut : null;
  if (!list || !list.length) return;
  for (const e of list){
    const idx = mirrorCell(e.c | 0);
    if (!(idx >= 0 && idx < COLS * ROWS)) continue;
    const cx = BX + colOf(idx) * CELL + CELL / 2;
    const cy = v.wy0 + rowOf(idx) * CELL + CELL * 0.46;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.24, 0, Math.PI * 2);
    if (e.q){                    // 还在出兵口后面排着队
      ctx.strokeStyle = 'rgba(176,58,46,0.70)'; ctx.lineWidth = 2; ctx.stroke();
    } else {                     // 已经上路了
      ctx.fillStyle = 'rgba(176,58,46,0.80)'; ctx.fill();
    }
  }
}
/* 画一整块战场：底盘 + 守军 + 主公 + 路上的兵 + 特效 */
function drawBoardIn(v, mine){
  withView(v, function(){
    const baseY = mine ? Y_MINE : Y_ENEMY;
    const board = mine ? G.board : G.enBoard;
    drawBoardBase(baseY, board, !mine);
    drawUnitsOnBoard(baseY, board, !mine);
    drawAdu(mine ? ADU_M : ADU_E,
            mine ? G.myLife : G.enLife,
            mine ? G.myMax  : G.enMax, mine);
    drawInspectMark(mine);              // 注意传布尔：drawInspectMark 内部按布尔比对
    drawMarchers(v, !mine);
    if (!mine) drawFoeOut(v);           // 对面派上路的兵（联机才有）
    drawFx(v, !mine);
  });
}

/* ---------------- 左上：战况面板 ----------------
   双方馒头、第几波、本波剩余、主公命数、羁绊 —— 能读的都塞这儿。
   以后要加展示内容（商人倒计时、伤害统计……）也往这块里排。 */
function drawInfoPanel(){
  const R = TOP_L;
  const bx = 10, by = 10, bw = R.w - 20, bh = R.h - 20;   // 340 × 462
  ctx.fillStyle = 'rgba(255,255,255,0.62)';
  rr(ctx, bx, by, bw, bh, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(90,80,65,0.18)'; ctx.lineWidth = 1;
  rr(ctx, bx, by, bw, bh, 16); ctx.stroke();

  const x0 = bx + 16, x1 = bx + bw - 16;      // 26 .. 334
  const wave = Math.max(G.wave, 1);

  // ---- 标题：第几波 + 兵阶 ----
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = INK; ctx.font = 'bold 26px ' + FONT;
  ctx.fillText('第 ' + wave + ' 波', x0, by + 34);
  ctx.fillStyle = INK3; ctx.font = '12px ' + FONT;
  ctx.fillText(waveTier(wave) + ' 阶兵', x0 + 88, by + 38);

  // ---- 下一波倒计时 ----
  const line2 = (G.phase === 'prep')
    ? ('备战 ' + Math.ceil(Math.max(0, G.prepT)) + 's')
    : ('下一波 ' + Math.ceil(Math.max(0, WAVE_GAP - G.waveT)) + 's');
  ctx.fillStyle = INK2; ctx.font = '14px ' + FONT;
  ctx.fillText(line2, x0, by + 74);
  // 商人预告：偶数波开波前出现
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(176,58,46,0.80)'; ctx.font = '12px ' + FONT;
  ctx.fillText('商人 第 ' + nextShopWave(wave) + ' 波', x1, by + 74);
  ctx.textAlign = 'left';
  // 进度条：走满就开下一波（速清会提前，所以它会跳）
  const barW = x1 - x0, barY = by + 90;
  ctx.fillStyle = 'rgba(90,80,65,0.10)';
  rr(ctx, x0, barY, barW, 6, 3); ctx.fill();
  const prog = (G.phase === 'prep') ? 0 : clamp(G.waveT / WAVE_GAP, 0, 1);
  if (prog > 0){
    ctx.fillStyle = 'rgba(176,58,46,0.55)';
    rr(ctx, x0, barY, Math.max(4, barW*prog), 6, 3); ctx.fill();
  }

  // ---- 两方数据小卡 ----
  const sides = [
    { mine:true,  label:'我方', color:GOLD, dim:'rgba(184,134,11,0.42)' },
    { mine:false, label:'敌方', color:SEAL, dim:'rgba(176,58,46,0.40)' },
  ];
  for (let i = 0; i < 2; i++){
    const s = sides[i];
    const cardY = by + 112 + i*92;
    ctx.fillStyle = 'rgba(90,80,65,0.05)';
    rr(ctx, x0, cardY, x1 - x0, 84, 12); ctx.fill();

    const ly = cardY + 24;
    // 阵营
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(x0 + 14, ly, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = INK2; ctx.font = 'bold 15px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(s.label, x0 + 26, ly + 1);
    // 馒头
    ctx.fillStyle = '#d9a02b';
    ctx.beginPath(); ctx.arc(x0 + 82, ly, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a5a06'; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('馒', x0 + 82, ly + 1);
    ctx.fillStyle = INK; ctx.font = 'bold 20px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText(String(Math.floor(moneyOf(s.mine))), x0 + 96, ly + 1);
    // 守军 / 出击（排队没出发的不算出击）
    const guard = guardCount(s.mine ? G.board : G.enBoard);
    let out = 0;
    for (const m of G.marchers) if (m.owner === (s.mine ? 'me' : 'ai') && !m.queued) out++;
    ctx.fillStyle = INK3; ctx.font = '12px ' + FONT;
    ctx.fillText('守 ' + guard + ' · 出击 ' + out, x0 + 150, ly + 2);
    // 本波剩余
    const left = s.mine ? G.spawnLeft : G.aiSpawnLeft;
    ctx.textAlign = 'right';
    ctx.fillStyle = left > 0 ? SEAL : INK3;
    ctx.fillText('待出 ' + left, x1 - 12, ly + 2);

    // 战功条
    const merit = s.mine ? G.merit : G.ai.merit;
    const need = s.mine ? G.meritNeed : G.ai.meritNeed;
    const mp = clamp(merit / need, 0, 1);
    const mw = 150, mh = 7, mx = x0 + 12, my = cardY + 52;
    ctx.fillStyle = 'rgba(90,80,65,0.12)';
    rr(ctx, mx, my, mw, mh, 4); ctx.fill();
    if (mp > 0){
      ctx.fillStyle = mp >= 1 ? s.color : s.dim;
      rr(ctx, mx, my, Math.max(5, mw*mp), mh, 4); ctx.fill();
    }
    ctx.textAlign = 'left'; ctx.fillStyle = INK3; ctx.font = '11px ' + FONT;
    ctx.fillText('战功 ' + Math.floor(merit) + '/' + need + (mp >= 1 ? ' · 突击队出阵' : ''),
                 mx + mw + 10, my + 4);
  }

  // ---- 主公命数 ----
  const ay = by + 314;
  ctx.textAlign = 'left'; ctx.font = '12px ' + FONT;
  ctx.fillStyle = GOLD; ctx.fillText('主公', x0, ay);
  drawLifeRow(x0 + 46, ay, G.myLife, G.myMax, GOLD);
  ctx.fillStyle = SEAL; ctx.fillText('主公', x0 + 172, ay);
  drawLifeRow(x0 + 218, ay, G.enLife, G.enMax, SEAL);

  // ---- 羁绊 / 被动 ----
  const bs = [];
  for (const b of BONDS) if (G.bondOn[b.id]) bs.push(b.name);
  const ps = [];
  for (const k in G.passive) if (G.passive[k]) ps.push(ITEMS[k].icon);
  ctx.textAlign = 'left';
  if (bs.length || ps.length){
    ctx.fillStyle = '#8a5a06'; ctx.font = '13px ' + FONT;
    if (bs.length) ctx.fillText('羁绊 · ' + bs.join(' / '), x0, by + 352);
    if (ps.length){
      ctx.fillStyle = INK2;
      ctx.fillText('被动 · ' + ps.join(' '), x0, by + (bs.length ? 376 : 352));
    }
  } else {
    ctx.fillStyle = INK3; ctx.font = '12px ' + FONT;
    ctx.fillText('馒头只从杀敌里来 · 征兵费只涨不降', x0, by + 352);
  }
  if (G.aduShield > 0){
    ctx.fillStyle = GOLD; ctx.font = 'bold 14px ' + FONT;
    ctx.fillText('神兵符 无敌 ' + G.aduShield.toFixed(1) + 's', x0, by + 400);
  }

  // ---- 底部提示 ----
  ctx.fillStyle = 'rgba(90,80,65,0.42)'; ctx.font = '11px ' + FONT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('点右侧敌军缩略图 → 放大查看', x0, by + bh - 22);

  // ---- 暂停按钮 ----
  if (canPause()){
    const b = BTN_PAUSE;
    ctx.fillStyle = 'rgba(70,60,45,0.14)';
    rr(ctx, b.x + 1, b.y + 2, b.w, b.h, 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    rr(ctx, b.x, b.y, b.w, b.h, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(90,80,65,0.26)'; ctx.lineWidth = 1.5;
    rr(ctx, b.x, b.y, b.w, b.h, 14); ctx.stroke();
    ctx.fillStyle = INK2;
    rr(ctx, b.x + 15, b.y + 14, 8, 22, 3); ctx.fill();
    rr(ctx, b.x + 27, b.y + 14, 8, 22, 3); ctx.fill();
  }
}
/* 一行小红心（主公命数） */
function drawLifeRow(x, y, life, max, color){
  const n = Math.max(max, life);
  for (let i = 0; i < n; i++){
    const on = i < life;
    ctx.save();
    ctx.translate(x + i*17, y); ctx.scale(0.95, 0.95);
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(-9, -3, -3, -11, 0, -6);
    ctx.bezierCurveTo(3, -11, 9, -3, 0, 5);
    ctx.closePath();
    ctx.fillStyle = on ? color : 'rgba(120,105,80,0.18)';
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = life > 0 ? INK2 : SEAL; ctx.font = '11px ' + FONT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(life + '/' + max, x + n*17 + 2, y);
}

/* 路面上的兵：双方共用一套画法，靠颜色 + 箭头区分归属
   金 = 我方出击兵（朝上打对面），红 = 来犯的兵（朝下打我的主公）
   foeHalf：这一遍是画在「敌军视口」里还是「我方视口」里 —— 只画属于那一半的兵。 */
function drawMarchers(v, foeHalf){
  for (const e of G.marchers){
    if (inFoeHalf(e.y) !== foeHalf) continue;
    // 过缝：挨着中缝的 36px 内淡出/淡入。两块战场在屏幕上不再相连，
    // 不加这一下，兵会从这块盘子的边上「凭空消失 / 凭空出现」。
    const fade = clamp((foeHalf ? SEAM_Y - e.y : e.y - SEAM_Y) / 36, 0, 1);
    if (fade <= 0.02) continue;
    const mine = e.owner === 'me';
    const s = e.w;
    const edge = mine ? GOLD : SEAL;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(e.x + (e.jit || 0), e.y + (e.jit || 0)*0.45);
    ctx.fillStyle = 'rgba(70,60,45,0.18)';
    ctx.beginPath(); ctx.ellipse(0, s*0.42, s*0.46, s*0.16, 0, 0, Math.PI*2); ctx.fill();
    // 前进方向的小三角：我方朝上，敌方朝下；列队待命时改成虚线圈 + 一个「待」字
    if (e.queued){
      ctx.strokeStyle = edge; ctx.globalAlpha = fade*0.55;
      ctx.setLineDash([4,4]); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, 0, s*0.62, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = fade*0.8; ctx.fillStyle = edge;
      ctx.font = Math.round(s*0.32) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('待', 0, s*0.74);
      ctx.globalAlpha = fade;
    } else {
      ctx.fillStyle = edge; ctx.globalAlpha = fade*0.5;
      const ay = mine ? -s*0.66 : s*0.66;
      ctx.beginPath();
      ctx.moveTo(0, ay + (mine ? -6 : 6)); ctx.lineTo(-4.5, ay); ctx.lineTo(4.5, ay);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = fade;
    }
    // 盘面按「品阶」上色（和棋盘上的守军、手牌同一套），
    // 外面再套一圈阵营色 —— 一眼既分敌我又分几阶。
    const tier = TIER[clamp(e.level || 1, 1, MAX_TIER)];
    ctx.fillStyle = e.hurt > 0.35 ? tier.bd : tier.bg;
    ctx.beginPath(); ctx.arc(0, 0, s*0.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = tier.bd; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.strokeStyle = edge; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, s*0.5 + 3.2, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = tier.c;
    ctx.font = Math.round(s*0.58) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.char, 0, 1);
    // 品阶数字：四个兵种长得一样，几阶全靠这个角标
    if (e.level > 1){
      const bs = Math.round(s*0.30);
      ctx.fillStyle = edge;
      rr(ctx, s*0.10, -s*0.54, bs, bs, 3); ctx.fill();
      ctx.fillStyle = '#fffaf0';
      ctx.font = 'bold ' + Math.round(bs*0.78) + 'px ' + FONT;
      ctx.fillText(String(e.level), s*0.10 + bs/2, -s*0.54 + bs/2 + 0.5);
    }
    if (e.elite > 0){
      const bs = Math.round(s*0.30);
      ctx.fillStyle = '#1c4f8c';
      rr(ctx, s*0.90 - bs, -s*0.54, bs, bs, 3); ctx.fill();
      ctx.fillStyle = '#fffaf0';
      ctx.font = 'bold ' + Math.round(bs*0.72) + 'px ' + FONT;
      ctx.fillText('+' + e.elite, s*0.90 - bs/2, -s*0.54 + bs/2 + 0.5);
    }
    if (e.stun > 0){
      ctx.strokeStyle = '#c79a26'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -s*0.72, 4, 0, Math.PI*2); ctx.stroke();
    }
    if (e.slowT > 0){
      ctx.fillStyle = 'rgba(42,95,168,0.20)';
      ctx.beginPath(); ctx.arc(0, 0, s*0.62, 0, Math.PI*2); ctx.fill();
    }
    if (e.hp < e.maxHp){
      const w = s, p = clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle = 'rgba(60,50,40,0.25)';
      rr(ctx, -w/2, -s*0.5 - 9, w, 4, 2); ctx.fill();
      ctx.fillStyle = edge;
      rr(ctx, -w/2, -s*0.5 - 9, w*p, 4, 2); ctx.fill();
    }
    ctx.restore();
  }
}
/* 主公那一格：一枚「印」——
   圆牌 + 竖排两个字挤在 72px 的格子里实在不好看（字顶到边、签压在圆上、红心又咬住圆底）。
   改成方印：双线印边 + 一个「主」字 + 底沿三颗命数心，居中留白，远看是一枚压在盘上的印章。 */
function drawAdu(pos, life, max, mine){
  const { x, y } = pos;
  const danger = life <= 1;
  const c = mine ? GOLD : SEAL;
  const S = CELL - 10;                 // 62
  const L = x - S/2, T = y - S/2;

  // 我方：一圈虚线护罩，和守军的「脱战回血」框区分开（这里更淡、更大）
  if (mine){
    ctx.strokeStyle = 'rgba(184,134,11,0.20)'; ctx.lineWidth = 2;
    ctx.setLineDash([5,7]);
    ctx.beginPath(); ctx.arc(x, y, CELL*0.47, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 印底
  ctx.fillStyle = 'rgba(70,60,45,0.14)';
  rr(ctx, L + 1, T + 3, S, S, 13); ctx.fill();
  const g = ctx.createLinearGradient(0, T, 0, T + S);
  if (mine){ g.addColorStop(0, '#fdf8ea'); g.addColorStop(1, '#f1e2bd'); }
  else     { g.addColorStop(0, '#fceeed'); g.addColorStop(1, '#f2d8d4'); }
  ctx.fillStyle = g;
  rr(ctx, L, T, S, S, 13); ctx.fill();
  // 外印边 + 内细线（双线才像印，不像普通的格子）
  ctx.strokeStyle = c; ctx.lineWidth = 2.4;
  rr(ctx, L, T, S, S, 13); ctx.stroke();
  ctx.strokeStyle = mine ? 'rgba(184,134,11,0.34)' : 'rgba(176,58,46,0.30)';
  ctx.lineWidth = 1;
  rr(ctx, L + 5.5, T + 5.5, S - 11, S - 11, 9); ctx.stroke();

  // 字：一个「主」，略偏上，给底下的心留位
  ctx.fillStyle = mine ? '#8a5a06' : SEAL;
  ctx.font = 'bold ' + Math.round(S*0.50) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('主', x, y - 6);

  // 命数心：压在印底，一颗一颗排整齐
  const n = Math.max(max, life);
  const gap = 15, w0 = (n-1)*gap;
  const hy = T + S - 13;
  for (let i = 0; i < n; i++){
    const hx = x - w0/2 + i*gap;
    const on = i < life;
    ctx.save();
    ctx.translate(hx, hy); ctx.scale(0.66, 0.66);
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-8, -3, -3, -10, 0, -5.5);
    ctx.bezierCurveTo(3, -10, 8, -3, 0, 4);
    ctx.closePath();
    ctx.fillStyle = on ? (danger ? '#d8342a' : SEAL) : 'rgba(120,105,80,0.18)';
    ctx.fill();
    if (on && danger){
      ctx.globalAlpha = 0.35 + 0.35*Math.sin(G.t*8);
      ctx.fillStyle = '#ff6a5e'; ctx.fill();
    }
    ctx.restore();
  }

  // 挨打：整枚印闪一下红 —— 一个兵换一滴血，这一下要看得见
  const hurt = mine ? (G.aduHurtM || 0) : (G.aduHurtE || 0);
  if (hurt > 0){
    ctx.save();
    ctx.globalAlpha = clamp(hurt / 0.45, 0, 1) * 0.5;
    ctx.fillStyle = '#d8342a';
    rr(ctx, L, T, S, S, 13); ctx.fill();
    ctx.restore();
  }
}

function drawHandAndButtons(){
  // 手牌区底板
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  rr(ctx, HAND_X0 - 12, HAND_Y - 12, (HAND_N*HAND_S + (HAND_N-1)*HAND_GAP) + 24, HAND_S + 24, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,80,65,0.16)'; ctx.lineWidth = 1; ctx.stroke();

  for (let i = 0; i < HAND_N; i++){
    const x = HAND_X0 + i*(HAND_S + HAND_GAP);
    const t = G.hand[i];
    if (t){
      if (G.dragger && G.dragger.from.kind === 'hand' && G.dragger.from.i === i) continue;
      drawCard(x, HAND_Y, HAND_S, t, { stat: t.kind === 'unit' ? statAtkOf(t) : undefined });
    } else {
      ctx.strokeStyle = 'rgba(90,80,65,0.16)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([5,5]);
      rr(ctx, x, HAND_Y, HAND_S, HAND_S, 10); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 拖拽中：高亮手牌格作为落点（拖回来 = 换位 / 收回）
  if (G.dragger && G.dragger.moved){
    const hs = handSlotAt({ x: G.dragger.x, y: G.dragger.y });
    if (hs >= 0){
      const x = HAND_X0 + hs*(HAND_S + HAND_GAP);
      const occupied = !!G.hand[hs];
      ctx.save();
      // 红环 = 和这格换位；绿环 = 空位，收进兵营
      ctx.strokeStyle = occupied ? SEAL : '#4f8a4a';
      ctx.lineWidth = 3;

/* 特效也按「落在哪一半」分给各自的视口：一束光、一圈涟漪不会横跨两张盘子 */
function drawFx(v, foeHalf){
  for (const f of G.fx){
    const p = f.t / f.dur;
    if (f.type === 'beam'){
      if (inFoeHalf((f.y1 + f.y2) / 2) !== foeHalf) continue;
      ctx.save();
      ctx.globalAlpha = (1-p) * 0.9;
      ctx.strokeStyle = f.color || GOLD; ctx.lineWidth = 16*(1-p) + 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y1 + (f.y2-f.y1)); ctx.stroke();
      ctx.strokeStyle = '#fff3cc'; ctx.lineWidth = 5*(1-p) + 1;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y1 + (f.y2-f.y1)); ctx.stroke();
      ctx.restore();
    } else if (f.type === 'ring'){
      if (inFoeHalf(f.y) !== foeHalf) continue;
      ctx.save();
      ctx.globalAlpha = (1-p) * 0.85;
      ctx.strokeStyle = f.color || INK; ctx.lineWidth = 10*(1-p) + 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1-f.r0)*p, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
  for (const p of G.parts){
    if (inFoeHalf(p.y) !== foeHalf) continue;
    const a = 1 - p.t/p.dur;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.4+a*0.6), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of G.floaters){
    if (inFoeHalf(f.y) !== foeHalf) continue;
    const a = 1 - f.t/f.dur;
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 17px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawDragger(){
  if (!G.dragger) return;
  const d = G.dragger;
  const isHero = d.tile.kind === 'hero';
  // 拖着的牌按我方棋盘的倍率画，落到盘上不会「缩一下」
  const h = (CELL - 12) * V_PLAY.k;
  const w = isHero ? h * 2 + 8 : h;
  // 名将：先把要占的两个格子亮出来（世界格 → 屏幕格）
  if (isHero){
    const mi = boardCellAtV({ x: d.x, y: d.y }, V_PLAY);
    if (mi >= 0){
      const allow = d.from.kind === 'board' ? [d.from.idx] : [];
      const span = findHeroSpan(mi, G.board, true, allow);
      if (span){
        ctx.save();
        ctx.strokeStyle = 'rgba(184,134,11,0.85)'; ctx.lineWidth = 2.5;
        ctx.setLineDash([7,5]);
        for (const i of span){

          ctx.stroke();

}

function wrapText(text, x, y, maxW, lh){
  const chars = text.split('');
  let line = '', ly = y;
  for (const ch of chars){
    if (ctx.measureText(line + ch).width > maxW){ ctx.fillText(line, x, ly); line = ch; ly += lh; }
    else line += ch;
  }
  if (line) ctx.fillText(line, x, ly);
}

/* ============================================================
   首页 / 联机（PvP）
   ------------------------------------------------------------
   两种入口：单人（人机，原逻辑）、多人（真人 1v1，房间号配对）。
   联机采用「各端自跑一份模拟 + 只同步操作」：
     - 双方用同一个地图种子开局（房主发 seed）
     - 各自的棋盘/手牌由自己结算，操作完成后把「我方盘面」推给对面
     - 对面收到后镜像到自己的敌方棋盘（上下两块棋盘是行镜像）
     - 路上兵（出击兵）用 raid 事件单独同步
   这样不需要每帧同步位置，视觉与手感都不抖；代价是极端情况下两边会有细微偏差。
   ============================================================ */
/* 联机地址从「你是用什么地址打开这个页面的」推出来 —— 这是第二台设备最容易踩的坑：
   在服务器那台机器上打开 localhost，默认就该是 ws://localhost:8787；
   在手机/另一台电脑上用 192.168.x.x 打开，默认就该是 ws://192.168.x.x:8787。
   一律写死 localhost 的话，第二个客户端连的永远是它自己。 */
function defaultAddr(){
  const h = (location.hostname || '').trim();
  if (!h) return 'ws://localhost:8787';                    // file:// 直接打开
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  return proto + h + ':' + (location.port || '8787');
}
/* 地址容错：少写 ws://、写成 http://、末尾带斜杠、不带端口 —— 都替人补齐 */
function normalizeAddr(v){
  let s = String(v || '').trim();
  if (!s) return '';
  s = s.replace(/^https:\/\//i, 'wss://').replace(/^http:\/\//i, 'ws://');
  if (!/^wss?:\/\//i.test(s)) s = 'ws://' + s;
  s = s.replace(/\/+$/, '');
  const host = s.replace(/^wss?:\/\//i, '');
  if (!/:\d+$/.test(host)) s += ':' + (location.port || '8787');
  return s;
}
/* 这是个回环地址吗（= 只指自己这台机器） */
function isLoopbackAddr(a){
  return /^wss?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/i.test(String(a || ''));
}

/* ---------------- 对局记录页 ---------------- */
const REC_UI = { page:0, per:8 };
const pad2 = n => String(n).padStart(2, '0');
function recTime(ts){
  const d = new Date(ts || 0);
  return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function recDur(sec){
  const s = Math.max(0, Math.round(sec || 0));
  return Math.floor(s/60) + ':' + pad2(s%60);
}
function recModeName(rec){
  if (rec.mode === 'pvp') return '多人 · 1v1';
  const lv = AI_LEVELS[clamp(rec.aiLevel | 0, 0, AI_LEVELS.length - 1)];
  return '单人 · ' + (lv ? lv.name : '对战');
}
function drawRecords(){
  drawBg(true);
  UI_BTNS = [];

  const pages = Math.max(1, Math.ceil(total / REC_UI.per));

  ctx.fillStyle = INK3; ctx.font = '16px ' + FONT;

  const y0 = 240, rh = 102, gap = 11, x = 70, w = W - 140;
  const items = all.slice(REC_UI.page * REC_UI.per, (REC_UI.page + 1) * REC_UI.per);

    const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);

/* ---------------- 通用按钮 ---------------- */
/* mode: primary(红实心) | plain(纸白) | off(灰，不可点)，sub 是按钮上的第二行小字 */
function uiBtn(id, x, y, w, h, t, mode, sub){
  const off = mode === 'off';
  if (!off) UI_BTNS.push({ id, r:{ x, y, w, h } });
  ctx.fillStyle = 'rgba(70,60,45,0.14)';
  rr(ctx, x+2, y+4, w, h, 14); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y+h);
  if (mode === 'primary'){ g.addColorStop(0, '#c0483a'); g.addColorStop(1, '#9e3226'); }
  else if (off){ g.addColorStop(0, '#e7e1d7'); g.addColorStop(1, '#d8d1c5'); }
  else { g.addColorStop(0, '#fbf7ef'); g.addColorStop(1, '#eee4d3'); }
  ctx.fillStyle = g; rr(ctx, x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = off ? 'rgba(120,105,80,0.20)'
    : (mode === 'primary' ? 'rgba(120,40,30,0.35)' : 'rgba(120,105,80,0.32)');
  ctx.lineWidth = 2; rr(ctx, x, y, w, h, 14); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = mode === 'primary' ? '#fff6ee' : (off ? 'rgba(70,62,50,0.42)' : INK);
  ctx.font = 'bold 26px ' + FONT;
  ctx.fillText(t, x + w/2, sub ? y + h/2 - 12 : y + h/2 + 1);

/* ---------------- 文字输入框（HTML 覆盖层） ---------------- */
let addrInput = null, joinNoInput = null, fRoomInput = null, fPwdInput = null, pwdInput = null;
let connTimer = null, layoutKey = '';
/* 输入框里的文字永远是准的：DOM 是唯一真相，点击时直接读，
   不依赖 input 事件有没有触发（自动填充、输入法、脚本改值都可能不发事件） */
function inputVal(el, fallback){
  const v = (el && typeof el.value === 'string') ? el.value.trim() : '';
  if (v) return v;                      // 框里有字就以框里为准（不依赖 input 事件有没有发过）
  return (fallback || '').trim();        // 框里是空的：可能是直接改了内存值，退回去用它
}
function makeNetInputs(){
  const mk = (ph, onIn, onSubmit) => {
    const el = document.createElement('input');
    el.type = 'text';
    el.placeholder = ph;
    el.autocomplete = 'off';
    el.spellcheck = false;
    el.style.cssText = 'position:fixed;display:none;box-sizing:border-box;z-index:9;' +
      'text-align:center;border-radius:12px;padding:0 12px;outline:none;' +
      'font-family:"Songti SC","STSong","SimSun",serif;font-weight:600;' +
      'color:#2b2620;background:rgba(255,255,255,0.94);border:2px solid rgba(90,80,65,0.35);';
    const sync = () => onIn(el.value);
    el.addEventListener('input', sync);
    el.addEventListener('change', sync);
    el.addEventListener('blur', sync);
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      sync();
      if (onSubmit) onSubmit();
      el.blur();
    });
    document.body.appendChild(el);
    return el;
  };
  addrInput  = mk('ws://192.168.1.5:8787', v => { NET.addr = v.trim(); scheduleConnect(); },
                  () => { if (NET.screen === 'online') netConnect(); });
  joinNoInput = mk('房间号', v => { NET.joinNo = v.trim(); }, () => screenButton('joinByNo'));
  fRoomInput = mk('房间号', v => { NET.formRoom = v.trim(); }, () => screenButton('doCreate'));
  fPwdInput  = mk('密码（可留空）', v => { NET.formPwd = v.trim(); }, () => screenButton('doCreate'));
  pwdInput   = mk('房间密码', v => { NET.tmpPwd = v.trim(); }, () => screenButton('doJoinPwd'));
  NET.addr = defaultAddr();              // 按「你是用什么地址打开这个页面」推默认值
  addrInput.value = NET.addr;
}
/* 改地址时别每敲一个字符就重连，停下来再连 */
function scheduleConnect(){
  clearTimeout(connTimer);
  connTimer = setTimeout(() => {
    if (NET.screen !== 'online') return;
    NET.tries = 0;                       // 换了地址就重新计数
    netConnect();
  }, 700);
}
function layoutNetInputs(){

/* ---------------- 网络 ---------------- */
/* 后台标签页里的定时器会被浏览器节流到几十秒；切回前台时立刻补一次，
   不然人看到的是「明明刚才是好的，怎么一回来就连不上」 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (NET.screen !== 'online' && NET.screen !== 'lobby') return;
  if (NET.link === 'online' || NET.link === 'connecting') return;
  clearRetry();
  netConnect();
});
/* 连不上别只留一行红字：自动退避重试几次，再给一个手动重试按钮。
   浏览器/系统偶发拒连（代理、休眠唤醒、后台标签页被节流）都靠这个兜回来。 */
const NET_RETRY = { max:5, wait:[1200, 1800, 2600, 3600, 5000] };
let retryTimer = null;
function clearRetry(){
  if (retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
}
function scheduleRetry(msg){
  clearRetry();
  if (NET.screen !== 'online' && NET.screen !== 'lobby'){ NET.status = msg; return; }
  if (NET.tries >= NET_RETRY.max){
    NET.status = msg + ' · 重试 ' + NET_RETRY.max + ' 次都没成功';
    return;
  }
  const wait = NET_RETRY.wait[Math.min(NET.tries, NET_RETRY.wait.length - 1)];
  NET.tries++;
  NET.status = msg + ' · 正在自动重试（' + NET.tries + '/' + NET_RETRY.max + '）';
  retryTimer = setTimeout(() => {
    retryTimer = null;
    if (NET.screen === 'online' || NET.screen === 'lobby') netConnect();
  }, wait);
}

function netReady(){ return !!(NET.ws && NET.ws.readyState === 1); }
function netSend(o){
  const ws = NET.ws;
  if (!ws || ws.readyState !== 1) return false;
  const out = o.t ? o : { t:'relay', data:o };    // 带 t 的是协议消息，其余是游戏内通道
  try { ws.send(JSON.stringify(out)); return true; } catch (e){ return false; }
}
function netClose(){
  NET.peer = false;
  clearRetry();
  if (NET.ws){
    NET.ws.onopen = null;
    NET.ws.onmessage = null;
    NET.ws.onerror = null;
    NET.ws.onclose = null;
    try { NET.ws.close(); } catch (e){}
  }
  NET.ws = null;
  NET.rooms = [];
}
function netAutoConnect(){
  if (NET.ws && NET.ws.readyState === 1){        // 已经连着：进来就把灯点亮，别显示「未连接」
    NET.link = 'online'; NET.status = '服务器在线'; NET.tries = 0; clearRetry(); return;
  }
  if (NET.ws && NET.ws.readyState === 0) return;
  netConnect();
}
/* 连不上时补一句人话：最常见的原因就是第二台设备填了 localhost */
function addrHint(addr){
  if (!isLoopbackAddr(addr)) return '';
  const h = location.hostname || '';
  if (!h || /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(h)) return '';
  return ' · localhost 只指你自己这台机器，要填服务器那台的 IP';
}
function connFailMsg(addr){ return '连不上 ' + addr + addrHint(addr); }
/* WS 连不上时，再探一下同一个端口的普通网页：
   网页能开 → 服务器活着，是这个浏览器把 WebSocket 拦了（代理插件/系统代理最常见）
   网页也开不了 → 地址填错了，或者不在同一个网段/被防火墙挡了
   这两件事在界面上长得一模一样，不探一下只能靠猜。 */
let httpProbeT = 0;
function probeServer(addr){
  const now = Date.now();
  if (now - httpProbeT < 2500) return;
  httpProbeT = now;
  const u = addr.replace(/^ws:/i, 'http:').replace(/^wss:/i, 'https:').replace(/\/+$/, '') + '/';
  fetch(u, { method:'GET', mode:'no-cors', cache:'no-store' })
    .then(() => { if (NET.link === 'offline')
      NET.status = '网页能开但 WebSocket 被拦了（' + addr + '）· 查浏览器代理/插件'; })
    .catch(() => { if (NET.link === 'offline')
      NET.status = '完全没响应（' + addr + '）· 查 IP 和端口、或防火墙'; });
}
function netConnect(){
  const raw = inputVal(addrInput, NET.addr);
  NET.addr = normalizeAddr(raw) || defaultAddr();
  if (addrInput && addrInput.value !== NET.addr) addrInput.value = NET.addr;
  const addr = NET.addr;
  netClose();
  NET.link = 'connecting'; NET.status = '连接中…';
  let ws;
  try { ws = new WebSocket(addr); }
  catch (e){ NET.link = 'offline'; NET.status = '服务器地址格式不对：' + addr; return; }
  NET.ws = ws;
  let opened = false;
  ws.onopen = () => {
    opened = true;
    NET.tries = 0; clearRetry();
    NET.link = 'online'; NET.status = '服务器在线';
    ws.send(JSON.stringify({ t:'list' }));
    const nr = NET.pendingRoom;
    if (nr){                                   // ?net=host|guest 直连用
      NET.pendingRoom = '';
      ws.send(JSON.stringify(NET.pendingRole === 'host'
        ? { t:'create', room:nr, pwd:'' }
        : { t:'join', room:nr, pwd:'' }));
    }
  };
  ws.onerror = () => {
    if (NET.ws !== ws || opened) return;       // 已经换了新连接 / 连上之后再报错，交给 onclose
    NET.link = 'offline';
    probeServer(addr);
    scheduleRetry(connFailMsg(addr));
  };
  ws.onclose = () => {
    if (NET.ws !== ws) return;
    NET.peer = false;
    if (!opened){ NET.link = 'offline'; probeServer(addr); scheduleRetry(connFailMsg(addr)); return; }
    NET.link = 'offline';
    if (NET.pvp){
      NET.status = '连接断开';
      if (G.phase !== 'over'){ G.phase = 'over'; G.result = 'lose'; toast('连接断开 · 本局判负'); }
    } else if (NET.screen === 'online' || NET.screen === 'lobby'){
      NET.status = '连接已断开 · 正在自动重连…';
      scheduleRetry('连接已断开');
    } else {
      NET.status = '连接已断开';       // 房间/对局中断线不自动重连，回去重进更干净
    }
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e){ return; }
    netOnMessage(m);
  };
}
function netOnMessage(m){
  if (m.t === 'rooms'){
    NET.rooms = Array.isArray(m.list) ? m.list : [];
    return;
  }
  if (m.t === 'created' || m.t === 'joined'){
    NET.waitT = 0; NET.panelMsg = ''; NET.panelBad = false;
    NET.joinNo = ''; NET.joinName = ''; NET.tmpPwd = '';    // 用掉了就清掉，别带到下一间房
    if (joinNoInput) joinNoInput.value = '';
    if (pwdInput) pwdInput.value = '';
    NET.room = m.room;
    NET.role = m.t === 'created' ? 'host' : 'guest';
    NET.peer = !!m.peer;
    NET.peerReady = false; NET.ready = false;
    enterRoom();
    return;
  }
  if (m.t === 'peer'){
    NET.peer = true; NET.peerReady = false;
    if (NET.screen === 'room') toast('对手已进入房间');
    return;
  }
  if (m.t === 'peerleft'){
    NET.peer = false; NET.peerReady = false;
    if (NET.pvp && G.phase !== 'over'){ G.phase = 'over'; G.result = 'win'; toast('对手离开 · 本局判胜'); }
    else if (NET.screen === 'room') toast('对手已离开房间');
    return;
  }
  if (m.t === 'dissolved'){
    const inRoom = NET.screen === 'room' || NET.pvp;
    NET.pvp = false; NET.peer = false; NET.peerReady = false; NET.ready = false;
    NET.room = ''; NET.role = '';
    if (inRoom){ showScreen('lobby'); toast(m.msg || '房间已解散'); }
    return;
  }
  if (m.t === 'relay'){ netOnGame(m.data); return; }
  if (m.t === 'err'){
    NET.waitT = 0;
    const msg = m.msg || '服务器拒绝';
    NET.status = msg;
    if (NET.panel){ NET.panelMsg = msg; NET.panelBad = true; }   // 浮层开着就写在浮层里
    else toast(msg);
    return;
  }
}
/* 进房间（还没开局）：先摆一张干净空盘，看得见但动不了 */
function enterRoom(){
  NET.panel = '';
  NET.pvp = false;
  newGame();
  showScreen('room');
}
/* 房主发种子，双方用同一个种子开同一张地图 */
function pvpHostStart(){
  if (NET.pvp) return;                    // 已经在打/已经开过局
  NET.seed = (Math.random() * 1e9) | 0;
  netSend({ t:'started' });               // 告诉服务器这局开打了，大厅不再挂着这间房
  netSend({ k:'start', seed:NET.seed });
  pvpStart(NET.seed, true);
}
function pvpStart(seed, isHost){
  if (NET.pvp) return;
  NET.started = true;
  NET.pvp = true;
  NET.role = isHost ? 'host' : 'guest';
  NET.seen = {};
  fixedSeed = seed >>> 0;
  showScreen('game');
  newGame();
  G.vsAI = false;              // 联机不可暂停（暂停会让两边时间线错开）
  startBattle();
  toast('联机对局开始 · 对手已就位', GOLD);
}
function netOnGame(d){
  if (!d) return;
  if (d.k === 'ready'){ NET.peerReady = true; toast('对手已准备'); return; }
  if (d.k === 'start'){ pvpStart(d.seed, false); return; }
  if (d.k === 'wave'){ netApplyWave(d.n); return; }
  if (d.k === 'again'){ gotoRoom(false); return; }   // 对面点了再来一局，一起回等候室
  if (!NET.pvp) return;
  if (d.k === 'side') netApplySide(d);
  else if (d.k === 'raid') netApplyRaid(d);
  else if (d.k === 'atk'){                                 // 对面战功满的突击队压过来了
    G.spawnLeft += Math.max(0, Math.min(12, d.n | 0));
    if (G.spawnGap <= 0) G.spawnGap = 0.30;
  }
  else if (d.k === 'over') netApplyOver(d.winner);
}
/* 对面速清提前开了一波：跟上，别让两边波号分叉（兵种是按波号算的） */
function netApplyWave(n){
  if (!NET.pvp || typeof n !== 'number') return;
  if (G.phase !== 'battle') return;
  if (n === G.wave + 1) startWave(false);
}
/* 同一间房里再来一局：不清连接、不清房间，只把对局状态推倒重来，回到等候室。
   bcast=true 表示是自己点的（要通知对面），false 表示收到了对面的通知。 */
function gotoRoom(bcast){
  if (NET.screen === 'room' && !NET.pvp) return;     // 已经回来了，别重复推倒
  if (bcast) netSend({ k:'again' });
  NET.pvp = false;
  NET.started = false;
  NET.ready = false;
  NET.peerReady = false;
  NET.seen = {};
  NET.seq = 0;
  NET.pushT = 0;
  G.result = '';
  G.phase = 'prep';
  closeInspect();
  newGame();
  showScreen('room');
  toast('准备再来一局', GOLD);
}
/* 结算后回大厅：连着的就回大厅，断了的回首页 */
function gotoLobby(){
  if (NET.ws && NET.ws.readyState === 1){
    netSend({ t:'leave' });
    NET.pvp = false; NET.started = false; NET.ready = false; NET.peerReady = false;
    NET.seen = {}; NET.role = ''; NET.room = '';
    G.result = ''; G.phase = 'prep';
    showScreen('lobby');
  } else {
    netClose();
    NET.pvp = false; NET.started = false; NET.peer = false; NET.peerReady = false;
    NET.ready = false; NET.role = ''; NET.room = ''; NET.link = 'idle';
    G.result = ''; G.phase = 'prep';
    showScreen('home');
  }
}
/* 终局裁定：命只由自己掉自己上报，所以房主手里的两个数（我的 myLife + 对面推来的 enLife）
   就是两边唯一的真相。由房主算一次、发一次，客机照办 —— 不会出现两边各判各的。 */
function netCheckOver(){
  if (!NET.pvp || NET.role !== 'host' || G.phase === 'over') return;
  const me = G.myLife, foe = G.enLife;
  if (me > 0 && foe > 0) return;
  const winner = (me <= 0 && foe <= 0) ? 'draw' : (me <= 0 ? 'guest' : 'host');
  netSend({ k:'over', winner });
  netApplyOver(winner);
}
function netApplyOver(winner){
  if (G.phase === 'over') return;
  if (winner === 'draw'){ G.phase = 'over'; G.result = 'draw'; sfx('lost'); return; }
  endGame(winner === NET.role);
}
/* 把自己这一侧的盘面推给对面（操作后立刻推一次，平时 0.4s 补一次） */
function netPushSide(){
  if (!NET.pvp || !NET.ws || NET.ws.readyState !== 1) return;
  /* 我派上路的兵（排队 + 行军）也要一起报过去 —— 否则对面右上角永远只看到
     一块空棋盘：兵拖到路上就不再属于 G.board 了，对方根本看不到我在出兵。 */
  const out = [];
  for (const m of G.marchers){
    if (m.owner !== 'me') continue;
    const col = clamp(Math.floor((m.x - BX) / CELL), 0, COLS - 1);
    const row = clamp(Math.floor((m.y - Y_MINE) / CELL), 0, ROWS - 1);
    out.push({ c: row * COLS + col, q: m.queued ? 1 : 0 });
  }
  netSend({
    k:'side',
    board: G.board,
    hand: G.hand,
    unlocked: G.unlocked,
    mantou: G.mantou,
    lives: G.myLife,
    max: G.myMax,
    out,
    pas: G.passive,      // 被动也要报：对撞伤害两端各算一遍，攻加成不一致就会分叉
  });
}
/* 收到对面盘面：镜像到自己的敌方棋盘 */
function netApplySide(d){
  if (Array.isArray(d.board)){
    const b = new Array(COLS*ROWS).fill(null);
    for (let i = 0; i < d.board.length; i++){
      const u = d.board[i];
      if (!u) continue;
      const j = mirrorCell(i);
      b[j] = u;
      /* 棋子内部的 cell/cells 还是发送方的格子编号 —— 不翻过来的话
         isAnchor(u,i) 永远不成立（8 行镜像没有一格映射回自己），
         整个敌方棋盘一格都画不出来，武将的位置也是错的。 */
      u.cell = j;
      if (Array.isArray(u.cells)) u.cells = u.cells.map(mirrorCell);
    }
    G.enBoard = b;
  }
  if (Array.isArray(d.hand)) G.ai.hand = d.hand;
  if (d.unlocked){
    const unl = {};
    for (const k in d.unlocked) unl[mirrorCell(+k)] = true;
    G.aiUnlocked = unl;
  }
  if (typeof d.mantou === 'number') G.ai.mantou = d.mantou;
  if (d.pas) G.ai.passive = d.pas;                   // 对面的被动道具（兵书攻加成等）
  if (typeof d.lives === 'number') G.enLife = d.lives;
  if (typeof d.max === 'number') G.enMax = d.max;
  G.enOut = Array.isArray(d.out) ? d.out : [];      // 对方派上路的兵（只用来画）
  refreshAiBonds();
}
/* 对手把兵派上路：在镜像格上生成一个敌方行军兵 */
function netApplyRaid(d){
  if (!d || typeof d.cell !== 'number') return;
  if (NET.seen[d.rid]) return;
  NET.seen[d.rid] = 1;
  const idx = mirrorCell(d.cell);
  const m = spawnRaider('ai', idx, d.type, d.level);
  if (m) m.queued = true;
  /* 迟到兜底：raid 在出兵口放行那一刻发出，若本端这波已经放行过
     （消息比 startWave 晚到几毫秒），这支兵会干等一整波 —— 直接放行拉平。 */
  if (m && G.qReleased) m.queued = false;
}

    if (!netReady()){ NET.panelMsg = '还没连上服务器 · 返回上一页重新连接'; NET.panelBad = true; return; }
    const sent = netSend({ t:'create', room:nm, pwd:(NET.formPwd || '').trim(), priv:NET.formPriv });
    if (!sent){ NET.panelMsg = '发送失败 · 连接已断开'; NET.panelBad = true; return; }

    netSend({ t:'join', room:NET.joinName, pwd:NET.tmpPwd });
    NET.panelMsg = '加入中…'; NET.panelBad = false; NET.waitT = 4;

  }
  if (id === 'joinByNo'){

    const rm = NET.rooms.find(r => r.name === nm);
    if (rm && rm.locked){ NET.joinName = nm; NET.panel = 'pwd'; NET.tmpPwd = '';
      NET.panelMsg = ''; NET.panelBad = false; NET.waitT = 0;
      if (pwdInput) pwdInput.value = ''; return; }
    netSend({ t:'join', room:nm, pwd:'' });
    NET.waitT = 4;

  }
  if (id.indexOf('join:') === 0){

    const rm = NET.rooms.find(r => r.name === nm);
    if (rm && rm.locked){ NET.joinName = nm; NET.panel = 'pwd'; NET.tmpPwd = '';
      NET.panelMsg = ''; NET.panelBad = false; NET.waitT = 0;

    if (!netReady()){ toast('连接已断开'); return; }

    netSend({ t:'leave' });
    NET.room = ''; NET.role = ''; NET.peer = false; NET.peerReady = false; NET.ready = false;
